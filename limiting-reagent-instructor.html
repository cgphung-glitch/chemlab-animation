/* A typed number as it should read on paper: four significant figures, scientific when small. */
function answerText(v, unit) {
  const n = parseFloat(v);
  const s = isFinite(n) ? (Math.abs(n) < 0.01 ? sci(n) : String(+n.toPrecision(4))) : (v.trim() || '—');
  return unit ? `${s} ${unit}` : s;
}

/* What the student answered, question by question, with the grader's verdict.
   `raw` is the unformatted answer, so an edit too small to change `answer` still shows. */
function postlabSnapshot() {
  const root = $('#postlabView');
  const rows = [];
  root.querySelectorAll('.pf').forEach(pf => {
    const input = pf.querySelector('input[data-ans]');
    rows.push({
      label: pf.querySelector('.plab').textContent.trim(),
      raw: input.value.trim(),
      answer: answerText(input.value, (pf.querySelector('em') || {}).textContent || ''),
      ok: isCorrect(input)
    });
  });
  root.querySelectorAll('.pickgroup').forEach(g => {
    const chosen = g.querySelector(`[data-pick-val="${picks[g.dataset.group]}"]`);
    rows.push({
      label: g.querySelector('.note').textContent.trim(),
      raw: picks[g.dataset.group] || '',
      answer: chosen ? chosen.textContent.trim() : '—',
      ok: picks[g.dataset.group] === g.dataset.ans
    });
  });
  root.querySelectorAll('.chklist').forEach(list => {
    const ticks = [...list.querySelectorAll('input[data-src]')].filter(i => i.checked);
    rows.push({
      label: 'Sources of the lost yield',
      raw: ticks.map(i => i.dataset.src).join(','),
      answer: ticks.length ? ticks.map(i => i.parentElement.textContent.trim()).join('; ') : 'none ticked',
      ok: checksMatch(list)
    });
  });
  return { score: $('#postlabScore').textContent.trim(), rows };
}

/* The notebook as plain text, read off the rendered sheet so there is only one copy of the data. */
function notebookText() {
  const lines = ['Experiment Simulation — limiting reagent and percent yield'];
  if (STUDENT.name) lines.push(`Name: ${STUDENT.name}`);
  if (STUDENT.course) lines.push(`Course: ${STUDENT.course}${STUDENT.section ? ' · Section ' + STUDENT.section : ''}`);
  if (STUDENT.date) lines.push(`Date: ${STUDENT.date}`);
  [...$('#modalBody').children].forEach(el => {          // walk the sheet in the order it prints
    if (el.matches('table.data')) {
      lines.push('', el.dataset.nb.toUpperCase());
      el.querySelectorAll('tr').forEach(tr => {
        const cells = [...tr.children].map(td => td.textContent.replace(/\u00a0/g, ' ').trim());
        lines.push(`${cells[0].replace(/\?$/, '')}: ${cells[1]}`);   // no ': ?' on question rows
      });
    } else if (el.matches('.nb-rules')) {
      lines.push('', el.textContent.trim());
    } else if (el.matches('ol.errlist')) {
      lines.push('', 'BENCH LOG');
      [...el.children].forEach((li, i) => lines.push(`${i + 1}. ${li.textContent.trim()}`));
    } else if (el.matches('.nbdiscuss')) {
      lines.push('', 'DISCUSSION', el.textContent.trim());
    }
  });
  return lines.join('\n');
}

async function copyNotebook() {
  const text = notebookText();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
  }
  const b = $('#modalBody [data-ui="copy-notebook"]');
  if (!b) return;
  b.textContent = ok ? 'Copied ✓' : 'Copy failed';
  setTimeout(() => { b.textContent = 'Copy as text'; }, 1600);
}

/* The running footer for the hand-in sheet: a page-margin box, drawn from @page, so it lands at the
   foot of every printed page — which a normal element cannot do. @page cannot be scoped by a class
   and the name is runtime data, so the rule exists only while the notebook is open; a plain print of
   the bench carries no footer. It is rebuilt as the name is typed, because the browser's own Ctrl+P
   never runs printNotebook(). font and colour sit on @page and are inherited by both boxes. */
function nbPrintFoot() {
  let el = $('#nbPrintFoot');
  if (!document.body.classList.contains('nb-open')) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('style');
    el.id = 'nbPrintFoot';
    document.head.appendChild(el);
  }
  const who = STUDENT.name.trim() || 'Name ______________________';
  el.textContent = `@page{
    font:10.5px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;color:#475467;
    @bottom-left{content:"${who.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"}
    @bottom-right{content:"Page " counter(page) " of " counter(pages)}
  }`;
}

/* Ask for the details that identify the sheet before exporting it, rather than printing a nameless page. */
/* A shared lab computer: one click forgets the details this browser remembers, and the sheet, its footer
   and the export check all fall back to empty. */
function forgetStudent() {
  NEEDED.forEach(k => { STUDENT[k] = ''; });
  try { localStorage.removeItem(STUDENT_KEY); localStorage.removeItem(OLD_STUDENT_KEY); } catch { /* nothing stored to clear */ }
  openNotebook();       // the sheet re-renders from the cleared details, footer included
  toast('Name, course and section cleared from this computer.');
}

function printNotebook() {
  const missing = NEEDED.filter(k => !STUDENT[k].trim());
  const fields = [...$('#modalBody').querySelectorAll('[data-student]')];
  fields.forEach(f => f.classList.toggle('need', missing.includes(f.dataset.student)));
  if (!missing.length) return window.print();
  const first = fields.find(f => f.dataset.student === missing[0]);
  if (first) first.focus();
  const list = missing.length > 1 ? `${missing.slice(0, -1).join(', ')} and ${missing[missing.length - 1]}` : missing[0];
  toast(`Add your ${list} before exporting the PDF.`);
}

/* The browser's own Ctrl+P never runs printNotebook(), so on the sheet it is routed through it: the
   same ask applies, and a complete sheet prints. On the bench the key is left alone. Capture phase on
   window so no other handler can swallow it first, and e.code as well as e.key because on a non-Latin
   layout the browser still prints on Ctrl+P while e.key is not 'p'. The browser menu's Print cannot be
   blocked by any page — beforeprint is not cancelable — so this guards the shortcut only. */
addEventListener('keydown', e => {
  if (e.repeat || e.altKey || e.shiftKey || !(e.ctrlKey || e.metaKey)) return;
  if (e.code !== 'KeyP' && e.key.toLowerCase() !== 'p') return;
  if (!document.body.classList.contains('nb-open')) return;
  e.preventDefault();
  printNotebook();
}, { capture: true });

/* A print started from the browser menu cannot be blocked, so an incomplete sheet shows a short note
   instead. The note is part of the sheet already and one class on body decides which one prints, so the
   sheet is never rebuilt: typed values, focus and scroll all survive, and a repeated beforeprint is
   harmless. */
addEventListener('beforeprint', () => {
  const missing = document.body.classList.contains('nb-open') && NEEDED.some(k => !STUDENT[k].trim());
  document.body.classList.toggle('nb-note', missing);
});
addEventListener('afterprint', () => document.body.classList.remove('nb-note'));

  Object.assign(S, defaults());
  POSTLAB = null;
  sprinkleAt = -1e9; topupAt = -1e9; pourMixAt = -1e9; rinseBeakerAt = -1e9; washAt = -1e9;
  vacDryLeft = 0; pumpStall = 0; pumpOffAt = 0;
  pourAt.ca = -1e9; pourAt.na = -1e9; mixPourAt.ca = -1e9; mixPourAt.na = -1e9;
  swirlAt.ca = -1e9; swirlAt.na = -1e9;
  rinseQueue = [];
  clearInterval(boilTimer); boilTimer = null;
  clearInterval(dryTimer); dryTimer = null;
  clearInterval(vacTimer); vacTimer = null;
  closeModal();
  $('#resultsView').classList.add('hidden');
  $('#introView').classList.add('hidden');
  $('#prelabView').classList.add('hidden');
  $('#postlabView').classList.add('hidden');
  $('#labView').classList.remove('hidden');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- wiring ---------- */
function nextStep() {
  if (!gate()) return;
  if (S.step === STEPS.length - 1) { showResults(); return; }
  S.step++;
  render();
  const pb = $('#panelBody');
  if (pb) pb.scrollTop = 0;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.addEventListener('input', e => {
  const field = e.target.closest('[data-student]');
  if (!field) return;
  STUDENT[field.dataset.student] = field.value;
  field.classList.remove('need');
  saveStudent();
  if (field.dataset.student === 'name') nbPrintFoot();   // keeps the printed footer in step with typing
});

document.addEventListener('click', e => {
  const pk = e.target.closest('[data-pick-group]');
  if (pk) {
    picks[pk.dataset.pickGroup] = pk.dataset.pickVal;
    document.querySelectorAll(`[data-pick-group="${pk.dataset.pickGroup}"]`)
      .forEach(b => b.classList.toggle('on', b === pk));
    return;
  }
  const ui = e.target.closest('[data-ui]');
  if (ui) {
    const run = {
      'restart': restart,
      'notebook': openNotebook,
      'prelab': openPrelab,
      'postlab': openPostlab,
      'check-prelab': checkPrelab,
      'check-postlab': checkPostlab,
      'reset-prelab': resetPrelab,
      'new-problem': newProblem,
      'print-notebook': printNotebook,
      'forget-student': forgetStudent,
      'copy-notebook': copyNotebook,
      'reset-postlab': resetPostlab,
      'close-prelab': hideSheet,
      'close-postlab': hideSheet,
      'close-intro': hideSheet
    }[ui.dataset.ui];
    if (run) run();
    return;
  }
  const act = e.target.closest('#panelBody [data-act]');
  if (act) doAct(act.dataset.act, act.dataset.val);
});
document.addEventListener('input', e => {
  const r = e.target.closest('#panelBody [data-range]');
  if (r) setDraft(r.dataset.range, r.value);
});
/* The discussion is free text: it is kept in the run's state so the hand-in sheet and a re-render both see it. */
document.addEventListener('input', e => {
  const d = e.target.closest('[data-discuss]');
  if (d) S.discussion = d.value;
});
$('#btnNext').addEventListener('click', nextStep);
$('#btnIntro').addEventListener('click', openIntro);
$('#btnPrelab').addEventListener('click', openPrelab);
$('#btnPostlab').addEventListener('click', openPostlab);
$('#btnNotebook').addEventListener('click', openNotebook);
$('#chkAnim').addEventListener('change', e => {
  animOverride = e.target.checked;
  try { localStorage.setItem(MOTION_KEY, animOverride ? 'on' : 'off'); } catch (err) {}
  applyMotion();
  if (!$('#labView').classList.contains('hidden')) render();   /* the step panel notes when motion is off */
});
motionQuery.addEventListener('change', () => { if (animOverride === null) applyMotion(); });
applyMotion();
$('#modalClose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/* ---- Instructor edition: answer keys on screen as soon as a sheet is built ----
   Inert in the student copy, where INSTRUCTOR is false. It fills the answers the sheet already
   grades against, so the key can never drift from the marks. */
if (INSTRUCTOR) {
  const KEYED = { '#prelabView': '#prelabScore', '#postlabView': '#postlabScore' };

  function fillKeys(rootSel, scoreSel) {
    const root = document.querySelector(rootSel);
    if (!root) return;
    root.querySelectorAll('[data-ans]').forEach(el => {
      if (el.matches('.pickgroup')) {
        picks[el.dataset.group] = el.dataset.ans;
        root.querySelectorAll(`[data-pick-group="${el.dataset.group}"]`)
          .forEach(b => b.classList.toggle('on', b.dataset.pickVal === el.dataset.ans));
      } else if (el.tagName === 'SELECT') {
        el.value = el.dataset.ans;
      } else {
        /* Keys the sheet authored itself ("236.15") are already the answer as written; the post-lab
           passes raw doubles to the grader, so those are rounded to four significant figures. */
        const ans = String(el.dataset.ans);
        el.value = ans.length > 8 && isFinite(Number(ans)) ? String(+Number(ans).toPrecision(4)) : ans;
      }
    });
    root.querySelectorAll('.chklist[data-checks]').forEach(list => {
      const want = sourceKeys();
      list.querySelectorAll('input[data-src]').forEach(i => { i.checked = want.includes(i.dataset.src); });
    });
    root.querySelectorAll('[data-ans], [data-checks]').forEach(el => {
      const ok = el.hasAttribute('data-checks') ? checksMatch(el)
        : el.matches('.pickgroup') ? picks[el.dataset.group] === el.dataset.ans
        : isCorrect(el);
      markField(el, ok, el.dataset.show || el.dataset.ans);
    });
    const score = document.querySelector(scoreSel);
    if (score) {
      score.textContent = 'Instructor copy — answer key shown';
      score.classList.add('ok');
      score.classList.remove('bad');
    }
    if (rootSel === '#prelabView') showWork();   // the worked solution for part 4, always on
  }

  const shownSheet = showSheet, clearedSheet = resetSheet, drawnProblem = newProblem;
  showSheet = function (id, build) { shownSheet(id, build); if (KEYED[id]) fillKeys(id, KEYED[id]); };
  resetSheet = function (id, build) { clearedSheet(id, build); if (KEYED[id]) fillKeys(id, KEYED[id]); };
  newProblem = function () { drawnProblem(); fillKeys('#prelabView', '#prelabScore'); };
}

render();
openIntro();
</script>
</body>
