<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ternary Mole Fraction Plotter</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: #f7f7f7;
      color: #111;
    }
    h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }
    .container {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 1rem;
      align-items: flex-start;
    }
    .panel {
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 0.75rem;
    }
    label {
      display: inline-block;
      margin-right: 0.5rem;
      margin-bottom: 0.4rem;
    }
    input[type="text"], select {
      padding: 0.25rem 0.4rem;
      margin-right: 0.5rem;
      border-radius: 4px;
      border: 1px solid #bbb;
      min-width: 4rem;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 0.5rem;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 0.25rem 0.4rem;
      text-align: right;
      font-size: 0.85rem;
    }
    th {
      background: #eee;
    }
    button {
      margin-top: 0.5rem;
      margin-right: 0.5rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid #888;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover {
      background: #f0f0f0;
    }
    #plotCanvas {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff; /* light mode */
    }
    .error {
      color: #b00020;
      font-size: 0.8rem;
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>
  <h1>Ternary Mole Fraction Plotter</h1>
  <div class="container">
    <div class="panel">
      <h2>Inputs & Data</h2>
      <div>
        <label>Graph title:
          <input type="text" id="graphTitle" placeholder="My ternary plot">
        </label>
      </div>
      <div style="margin-top:0.4rem;">
        <label>Component A:
          <input type="text" id="compA" value="A">
        </label>
        <label>Component B:
          <input type="text" id="compB" value="B">
        </label>
        <label>Component C:
          <input type="text" id="compC" value="C">
        </label>
      </div>
      <div style="margin-top:0.4rem;">
        <label>Plot style:
          <select id="plotStyle">
            <option value="scatter">Scatter (points)</option>
            <option value="connected">Connected (polyline)</option>
            <option value="interpolated">Interpolated (smooth-ish)</option>
          </select>
        </label>
      </div>

      <h3>Data table (mole fractions)</h3>
      <p style="font-size:0.85rem;margin:0;">
        Each row should satisfy A + B + C ≈ 1.00.
      </p>
      <table id="dataTable">
        <thead>
          <tr>
            <th>#</th>
            <th>A</th>
            <th>B</th>
            <th>C</th>
          </tr>
        </thead>
        <tbody>
        </tbody>
      </table>
      <button id="addRowBtn">Add row</button>
      <button id="plotBtn">Plot</button>
      <button id="resetBtn">Reset</button>
      <div class="error" id="errorMsg"></div>

      <h3>Export</h3>
      <button id="downloadPngBtn">Download PNG</button>
      <button id="downloadCsvBtn">Download CSV</button>
    </div>

    <div class="panel">
      <h2>Plot</h2>
      <canvas id="plotCanvas" width="500" height="450"></canvas>
    </div>
  </div>

<script>
  // Utility: add an empty row to the data table
  function addRow() {
    const tbody = document.querySelector('#dataTable tbody');
    const rowIndex = tbody.rows.length + 1;
    const tr = document.createElement('tr');

    const idxTd = document.createElement('td');
    idxTd.textContent = rowIndex;

    const aTd = document.createElement('td');
    const bTd = document.createElement('td');
    const cTd = document.createElement('td');

    const aInput = document.createElement('input');
    aInput.type = 'text';
    aInput.value = rowIndex === 1 ? '1.0' : '0.33';
    const bInput = document.createElement('input');
    bInput.type = 'text';
    bInput.value = rowIndex === 1 ? '0.0' : '0.33';
    const cInput = document.createElement('input');
    cInput.type = 'text';
    cInput.value = rowIndex === 1 ? '0.0' : '0.34';

    aTd.appendChild(aInput);
    bTd.appendChild(bInput);
    cTd.appendChild(cInput);

    tr.appendChild(idxTd);
    tr.appendChild(aTd);
    tr.appendChild(bTd);
    tr.appendChild(cTd);
    tbody.appendChild(tr);
  }

  document.getElementById('addRowBtn').addEventListener('click', addRow);
  // add a couple of default rows
  addRow();
  addRow();

  function readData() {
    const tbody = document.querySelector('#dataTable tbody');
    const data = [];
    const tol = 1e-3;
    let error = '';

    for (let i = 0; i < tbody.rows.length; i++) {
      const row = tbody.rows[i];
      const a = parseFloat(row.cells[1].querySelector('input').value);
      const b = parseFloat(row.cells[2].querySelector('input').value);
      const c = parseFloat(row.cells[3].querySelector('input').value);
      if (Number.isNaN(a) || Number.isNaN(b) || Number.isNaN(c)) {
        error = `Row ${i+1}: invalid number.`;
        break;
      }
      const sum = a + b + c;
      if (Math.abs(sum - 1.0) > tol) {
        error = `Row ${i+1}: A+B+C = ${sum.toFixed(3)}, not 1.0.`;
        break;
      }
      data.push({a, b, c});
    }
    return {data, error};
  }

  function drawGrid(ctx, unitToCanvas, sqrt3over2, w, h, margin) {
    ctx.save();
    ctx.setLineDash([4, 4]); // dashed lines
    ctx.lineWidth = 0.7;

    // Helper to draw a line between two unit-space points (x,y)
    function lineUnit(x1, y1, x2, y2, isMajor) {
      const p1 = unitToCanvas(x1, y1);
      const p2 = unitToCanvas(x2, y2);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = isMajor ? '#cccccc' : '#e0e0e0';
      ctx.stroke();
    }

    // Lines of constant A (parallel to BC): A = const
    // A + B + C = 1 => B + C = 1 - A, so these are straight segments inside the triangle.
    for (let f = 0.05; f < 1.0; f += 0.05) {
      const a = f;
      const isMajor = Math.abs(f * 10 - Math.round(f * 10)) < 1e-6 && (Math.round(f * 10) % 2 === 0); // 0.10, 0.20, ...
      const BCsum = 1 - a;
      if (BCsum <= 0) continue;
      // When B = 0, C = BCsum; when C = 0, B = BCsum
      const B0 = 0, C0 = BCsum;
      const B1 = BCsum, C1 = 0;
      // Map (A,B,C) to unit triangle: x = C + 0.5 B, y = (sqrt3/2)*B
      const x1 = C0 + 0.5 * B0;
      const y1 = sqrt3over2 * B0;
      const x2 = C1 + 0.5 * B1;
      const y2 = sqrt3over2 * B1;
      lineUnit(x1, y1, x2, y2, isMajor);
    }

    // Lines of constant B (parallel to AC): B = const
    for (let f = 0.05; f < 1.0; f += 0.05) {
      const b = f;
      const isMajor = Math.abs(f * 10 - Math.round(f * 10)) < 1e-6 && (Math.round(f * 10) % 2 === 0);
      const ACsum = 1 - b;
      if (ACsum <= 0) continue;
      // When A = 0, C = ACsum; when C = 0, A = ACsum
      const A0 = 0, C0 = ACsum;
      const A1 = ACsum, C1 = 0;
      const x1 = C0 + 0.5 * b;
      const y1 = sqrt3over2 * b;
      const x2 = C1 + 0.5 * b;
      const y2 = sqrt3over2 * b;
      lineUnit(x1, y1, x2, y2, isMajor);
    }

    // Lines of constant C (parallel to AB): C = const
    for (let f = 0.05; f < 1.0; f += 0.05) {
      const c = f;
      const isMajor = Math.abs(f * 10 - Math.round(f * 10)) < 1e-6 && (Math.round(f * 10) % 2 === 0);
      const ABsum = 1 - c;
      if (ABsum <= 0) continue;
      // When A = 0, B = ABsum; when B = 0, A = ABsum
      const A0 = 0, B0 = ABsum;
      const A1 = ABsum, B1 = 0;
      const x1 = c + 0.5 * B0;
      const y1 = sqrt3over2 * B0;
      const x2 = c + 0.5 * B1;
      const y2 = sqrt3over2 * B1;
      lineUnit(x1, y1, x2, y2, isMajor);
    }

    ctx.restore();
  }

function drawPlot() {
  const {data, error} = readData();
  const errorMsg = document.getElementById('errorMsg');
  if (error) {
    errorMsg.textContent = error;
    return;
  } else {
    errorMsg.textContent = '';
  }

  const compA = document.getElementById('compA').value || 'A';
  const compB = document.getElementById('compB').value || 'B';
  const compC = document.getElementById('compC').value || 'C';
  const title = document.getElementById('graphTitle').value || 'Ternary mole fraction plot';
  const style = document.getElementById('plotStyle').value;

  const canvas = document.getElementById('plotCanvas');
  const ctx = canvas.getContext('2d');

  // clear canvas (light mode background)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // layout
  const margin = 50;
  const w = canvas.width - 2 * margin;
  const h = canvas.height - 2 * margin;

  const sqrt3over2 = Math.sqrt(3) / 2;

  // unit→canvas mapping
  function unitToCanvas(x, y) {
    const cx = margin + x * w;
    const cy = margin + (1 - y) * h; // invert y (canvas y grows downward)
    return {x: cx, y: cy};
  }

  // Triangle corners in unit space
  const A_unit = {x: 0,   y: 0};
  const B_unit = {x: 0.5, y: sqrt3over2};
  const C_unit = {x: 1,   y: 0};

  const A = unitToCanvas(A_unit.x, A_unit.y);
  const B = unitToCanvas(B_unit.x, B_unit.y);
  const C = unitToCanvas(C_unit.x, C_unit.y);
 
  // Draw grid before axes and data
  drawGrid(ctx, unitToCanvas, sqrt3over2, w, h, margin);

  // Draw triangle edges (axes)
  ctx.strokeStyle = '#000000';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([]); // solid
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y);
  ctx.lineTo(A.x, A.y);
  ctx.stroke();

  // Axis labels at corners
  ctx.font = '12px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#000000';
  ctx.fillText(compA + ' (pure)', A.x - 10, A.y + 8);
  ctx.textBaseline = 'bottom';
  ctx.fillText(compB + ' (pure)', B.x, B.y - 8);
  ctx.textBaseline = 'top';
  ctx.fillText(compC + ' (pure)', C.x + 10, C.y + 8);

  // Title at top
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = '14px system-ui';
  ctx.fillText(title, canvas.width / 2, 10);

  // Edge tick labels in percent
  ctx.font = '10px system-ui';
  ctx.fillStyle = '#444444';
  ctx.setLineDash([]);

  // Edge tick labels in percent, aligned with edges and pushed outward

  ctx.font = '10px system-ui';
  ctx.fillStyle = '#444444';
  ctx.setLineDash([]);

  // Helper: label at fraction t along edge from (x1,y1) to (x2,y2) in unit-space,
  // offset outward by a normal vector.
  function labelOnEdge(x1, y1, x2, y2, t, text, outwardSign) {
    // point on edge in unit space
    const xu = x1 + t * (x2 - x1);
    const yu = y1 + t * (y2 - y1);
    const p = unitToCanvas(xu, yu);

    // edge endpoints in canvas space
    const p1c = unitToCanvas(x1, y1);
    const p2c = unitToCanvas(x2, y2);
    const dx = p2c.x - p1c.x;
    const dy = p2c.y - p1c.y;

    // normal vector (perpendicular to edge)
    let nx = -dy;
    let ny = dx;
    const len = Math.sqrt(nx*nx + ny*ny);
    if (len !== 0) {
      nx /= len;
      ny /= len;
    }

    const offset = 12; // pixels away from edge
    const xLabel = p.x + outwardSign * offset * nx;
    const yLabel = p.y + outwardSign * offset * ny;

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, xLabel, yLabel);
  }

  // Component A labels: along edge AB, on the LEFT side.
  // AB edge in unit space: from A_unit to B_unit.
  // We'll place labels at positions t = 0.1, 0.2, ..., 0.9 (even spacing).
  for (let f = 0.9; f >= 0.1; f -= 0.1) {
    const pct = Math.round((1-f) * 100) + '%';
    const t = f; // parameter along AB from A to B
    // outwardSign +1 or -1 depends on which side we consider "left".
    // With our mapping, +1 gives labels on the geometric left of AB.
    labelOnEdge(A_unit.x, A_unit.y, B_unit.x, B_unit.y, t, pct, -1);
  }

  // Component B labels: along edge BC, on the RIGHT side.
  // BC edge in unit space: from B_unit to C_unit.
  for (let f = 0.9; f >= 0.1; f -= 0.1) {
    const pct = Math.round((1-f) * 100) + '%';
    const t = f; // parameter along BC from B to C
    // outwardSign = -1 here to push labels to the geometric right of BC.
    labelOnEdge(B_unit.x, B_unit.y, C_unit.x, C_unit.y, t, pct, -1);
  }

  // Component C labels: along edge AC, UNDER the edge.
  // AC edge in unit space: from A_unit to C_unit (bottom).
  for (let f = 0.9; f >= 0.1; f -= 0.1) {
    const pct = Math.round(f * 100) + '%';
    const t = f; // parameter along AC from A to C
    // AC is roughly horizontal. With our mapping, +1 pushes labels downward (under edge).
    labelOnEdge(A_unit.x, A_unit.y, C_unit.x, C_unit.y, t, pct, +1);
  }

  // Convert mole fractions to canvas points
  const points = data.map(d => {
    const x_unit = d.c + 0.5 * d.b;
    const y_unit = sqrt3over2 * d.b;
    return unitToCanvas(x_unit, y_unit);
  });

  // Draw data according to style
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = '#0077cc';
  ctx.fillStyle = '#0077cc';
  ctx.setLineDash([]);

  if (style === 'scatter') {
    points.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
      ctx.fill();
    });
  } else if (style === 'connected') {
    if (points.length > 0) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.stroke();
    }
    points.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, 2 * Math.PI);
      ctx.fill();
    });
  } else if (style === 'interpolated') {
    if (points.length > 1) {
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        const p0 = points[i-1];
        const p1 = points[i];
        const steps = 10;
        for (let t = 1; t <= steps; t++) {
          const u = t / steps;
          const x = p0.x + u * (p1.x - p0.x);
          const y = p0.y + u * (p1.y - p0.y);
          ctx.lineTo(x, y);
        }
      }
      ctx.stroke();
    }
    points.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, 2 * Math.PI);
      ctx.fill();
    });
  }
}

  function resetApp() {
    // Clear data table body
    const tbody = document.querySelector('#dataTable tbody');
    while (tbody.firstChild) {
      tbody.removeChild(tbody.firstChild);
    }

    // Clear error message
    document.getElementById('errorMsg').textContent = '';

    // Reset inputs (optional)
    document.getElementById('graphTitle').value = '';
    document.getElementById('compA').value = 'A';
    document.getElementById('compB').value = 'B';
    document.getElementById('compC').value = 'C';
    document.getElementById('plotStyle').value = 'scatter';

    // Clear canvas
    const canvas = document.getElementById('plotCanvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Optionally add a couple of default rows again
    addRow();
    addRow();
  }

  document.getElementById('resetBtn').addEventListener('click', resetApp);

  document.getElementById('plotBtn').addEventListener('click', drawPlot);

  // Download PNG
  document.getElementById('downloadPngBtn').addEventListener('click', function() {
    const canvas = document.getElementById('plotCanvas');
    const link = document.createElement('a');
    link.download = 'ternary_plot.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // Download CSV
  document.getElementById('downloadCsvBtn').addEventListener('click', function() {
    const {data, error} = readData();
    if (error) {
      document.getElementById('errorMsg').textContent = error;
      return;
    }
    const compA = document.getElementById('compA').value || 'A';
    const compB = document.getElementById('compB').value || 'B';
    const compC = document.getElementById('compC').value || 'C';
    let csv = `${compA},${compB},${compC}\n`;
    data.forEach(d => {
      csv += `${d.a},${d.b},${d.c}\n`;
    });
    const blob = new Blob([csv], {type: 'text/csv'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'mole_fractions.csv';
    link.click();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
