<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparing Three Functions - Function Plotter</title>
  <!-- Math.js for safe mathematical expression evaluation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --input-bg: #334155;
      --border-color: #475569;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --f1-color: #38bdf8; /* Cyan */
      --f2-color: #f472b6; /* Pink */
      --f3-color: #facc15; /* Yellow */
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.025em;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    @media (min-width: 900px) {
      .app-container {
        display: grid;
        grid-template-columns: 360px 1fr;
        align-items: start;
      }
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
    }

    /* Mode Selector Tabs */
    .mode-tabs {
      display: flex;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 8px 4px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #fff;
    }

    /* Inputs Group */
    .input-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .function-input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .fn-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .color-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .f1-indicator { background-color: var(--f1-color); }
    .f2-indicator { background-color: var(--f2-color); }
    .f3-indicator { background-color: var(--f3-color); }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: monospace;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: var(--accent);
    }

    .bounds-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .bound-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bound-item label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .bound-item input {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .toggle-group {
      display: flex;
      gap: 16px;
      margin-top: 8px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .checkbox-label input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-secondary {
      background-color: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--border-color);
    }

    /* Plot Canvas Container */
    .plot-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #020617;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      touch-action: none;
    }

    @media (min-width: 900px) {
      .canvas-wrapper {
        aspect-ratio: 4 / 3;
      }
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Inspector Box */
    .inspector-card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 12px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .inspector-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .inspector-values {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      font-family: monospace;
    }

    .val-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .val-badge {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Function Plotter</h1>
    <p>Compare equations in Cartesian, Parametric, and Polar modes</p>
  </div>

  <div class="app-container">
    <!-- Controls Panel -->
    <div class="card">
      <!-- Mode Tabs -->
      <div class="mode-tabs">
        <button class="tab-btn active" onclick="setMode('cartesian')">Cartesian</button>
        <button class="tab-btn" onclick="setMode('parametric')">Parametric</button>
        <button class="tab-btn" onclick="setMode('polar')">Polar</button>
      </div>

      <!-- Function Inputs -->
      <div class="input-section">
        <!-- Fn 1 -->
        <div class="function-input-group">
          <div class="fn-header">
            <span class="color-indicator f1-indicator"></span>
            <label id="lbl-f1">y₁ = f₁(x)</label>
          </div>
          <div class="input-wrapper" id="wrap-f1">
            <input type="text" id="input-f1-a" value="sin(x)" placeholder="e.g. sin(x)">
            <input type="text" id="input-f1-b" value="" placeholder="y1(t)" style="display:none; margin-left: 4px;">
          </div>
        </div>

        <!-- Fn 2 -->
        <div class="function-input-group">
          <div class="fn-header">
            <span class="color-indicator f2-indicator"></span>
            <label id="lbl-f2">y₂ = f₂(x)</label>
          </div>
          <div class="input-wrapper" id="wrap-f2">
            <input type="text" id="input-f2-a" value="0.5 * x^2 - 3" placeholder="e.g. x^2">
            <input type="text" id="input-f2-b" value="" placeholder="y2(t)" style="display:none; margin-left: 4px;">
          </div>
        </div>

        <!-- Fn 3 -->
        <div class="function-input-group">
          <div class="fn-header">
            <span class="color-indicator f3-indicator"></span>
            <label id="lbl-f3">y₃ = f₃(x)</label>
          </div>
          <div class="input-wrapper" id="wrap-f3">
            <input type="text" id="input-f3-a" value="2 * cos(x) + 1" placeholder="e.g. cos(x)">
            <input type="text" id="input-f3-b" value="" placeholder="y3(t)" style="display:none; margin-left: 4px;">
          </div>
        </div>

        <!-- Axes Limits -->
        <div class="bounds-grid">
          <div class="bound-item">
            <label>X Min</label>
            <input type="number" id="xMin" value="-10" step="any">
          </div>
          <div class="bound-item">
            <label>X Max</label>
            <input type="number" id="xMax" value="10" step="any">
          </div>
          <div class="bound-item">
            <label>Y Min</label>
            <input type="number" id="yMin" value="-10" step="any">
          </div>
          <div class="bound-item">
            <label>Y Max</label>
            <input type="number" id="yMax" value="10" step="any">
          </div>
        </div>

        <!-- Parameter Bounds (Hidden by default, used for Parametric/Polar) -->
        <div class="bounds-grid" id="param-bounds" style="display: none;">
          <div class="bound-item">
            <label id="lbl-pmin">t Min</label>
            <input type="number" id="pMin" value="0" step="any">
          </div>
          <div class="bound-item">
            <label id="lbl-pmax">t Max</label>
            <input type="number" id="pMax" value="6.283" step="any">
          </div>
        </div>

        <!-- Feature Toggles -->
        <div class="toggle-group">
          <label class="checkbox-label">
            <input type="checkbox" id="chk-roots" checked onchange="draw()"> Show Roots (f=0)
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="chk-intersections" checked onchange="draw()"> Intersections
          </label>
        </div>

        <!-- Actions -->
        <div class="btn-group">
          <button class="btn btn-primary" onclick="draw()">
            <i class="fa-solid fa-arrows-rotate"></i> Update
          </button>
          <button class="btn btn-secondary" onclick="exportGraph()">
            <i class="fa-solid fa-download"></i> Export
          </button>
        </div>
      </div>
    </div>

    <!-- Graph Visualization -->
    <div class="plot-container">
      <div class="canvas-wrapper" id="canvas-container">
        <canvas id="graphCanvas"></canvas>
      </div>

      <!-- Point Inspector -->
      <div class="inspector-card">
        <div class="inspector-title">Cursor Readout</div>
        <div class="inspector-values">
          <div class="val-item">Pos: <span id="readout-pos" style="color: #fff;">(-, -)</span></div>
          <div class="val-item"><span class="val-badge f1-indicator"></span><span id="readout-f1">-</span></div>
          <div class="val-item"><span class="val-badge f2-indicator"></span><span id="readout-f2">-</span></div>
          <div class="val-item"><span class="val-badge f3-indicator"></span><span id="readout-f3">-</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // App State
    let currentMode = 'cartesian'; // 'cartesian', 'parametric', 'polar'
    let hoverPos = null; // {x, y} in graph coordinates

    // Color definitions
    const COLORS = {
      f1: '#38bdf8',
      f2: '#f472b6',
      f3: '#facc15',
      root: '#22c55e',
      intersection: '#a855f7'
    };

    // Canvas setup
    const canvas = document.getElementById('graphCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvas-container');

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      draw();
    }

    window.addEventListener('resize', resizeCanvas);

    // Set Active Plot Mode
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', ['cartesian', 'parametric', 'polar'][idx] === mode);
      });

      const paramBounds = document.getElementById('param-bounds');
      const inputF1B = document.getElementById('input-f1-b');
      const inputF2B = document.getElementById('input-f2-b');
      const inputF3B = document.getElementById('input-f3-b');

      if (mode === 'cartesian') {
        paramBounds.style.display = 'none';
        
        document.getElementById('lbl-f1').innerText = 'y₁ = f₁(x)';
        document.getElementById('lbl-f2').innerText = 'y₂ = f₂(x)';
        document.getElementById('lbl-f3').innerText = 'y₃ = f₃(x)';

        document.getElementById('input-f1-a').value = 'sin(x)';
        document.getElementById('input-f2-a').value = '0.5 * x^2 - 3';
        document.getElementById('input-f3-a').value = '2 * cos(x) + 1';

        inputF1B.style.display = 'none';
        inputF2B.style.display = 'none';
        inputF3B.style.display = 'none';

      } else if (mode === 'parametric') {
        paramBounds.style.display = 'grid';
        document.getElementById('lbl-pmin').innerText = 't Min';
        document.getElementById('lbl-pmax').innerText = 't Max';
        document.getElementById('pMin').value = '0';
        document.getElementById('pMax').value = '6.283';

        document.getElementById('lbl-f1').innerText = 'Curve 1: x₁(t), y₁(t)';
        document.getElementById('lbl-f2').innerText = 'Curve 2: x₂(t), y₂(t)';
        document.getElementById('lbl-f3').innerText = 'Curve 3: x₃(t), y₃(t)';

        document.getElementById('input-f1-a').value = '3 * cos(t)';
        document.getElementById('input-f1-b').value = '3 * sin(t)';
        
        document.getElementById('input-f2-a').value = '2 * cos(3 * t)';
        document.getElementById('input-f2-b').value = '2 * sin(2 * t)';

        document.getElementById('input-f3-a').value = '0.8 * t * cos(t)';
        document.getElementById('input-f3-b').value = '0.8 * t * sin(t)';

        inputF1B.style.display = 'block';
        inputF2B.style.display = 'block';
        inputF3B.style.display = 'block';

      } else if (mode === 'polar') {
        paramBounds.style.display = 'grid';
        document.getElementById('lbl-pmin').innerText = 'θ Min';
        document.getElementById('lbl-pmax').innerText = 'θ Max';
        document.getElementById('pMin').value = '0';
        document.getElementById('pMax').value = '12.566';

        document.getElementById('lbl-f1').innerText = 'r₁ = f₁(θ)';
        document.getElementById('lbl-f2').innerText = 'r₂ = f₂(θ)';
        document.getElementById('lbl-f3').innerText = 'r₃ = f₃(θ)';

        document.getElementById('input-f1-a').value = '3 * cos(2 * theta)';
        document.getElementById('input-f2-a').value = '2 + 2 * cos(theta)';
        document.getElementById('input-f3-a').value = '0.5 * theta';

        inputF1B.style.display = 'none';
        inputF2B.style.display = 'none';
        inputF3B.style.display = 'none';
      }

      draw();
    }

    // Helper: Safe math evaluator
    function compileExpression(exprStr, varNames) {
      if (!exprStr.trim()) return null;
      try {
        const node = math.parse(exprStr);
        const code = node.compile();
        return (scope) => {
          try {
            return code.evaluate(scope);
          } catch {
            return NaN;
          }
        };
      } catch {
        return null;
      }
    }

    // Main Draw Function
    function draw() {
      const rect = container.getBoundingClientRect();
      const width = rect.width;
      const height = rect.height;

      const xMin = parseFloat(document.getElementById('xMin').value) || -10;
      const xMax = parseFloat(document.getElementById('xMax').value) || 10;
      const yMin = parseFloat(document.getElementById('yMin').value) || -10;
      const yMax = parseFloat(document.getElementById('yMax').value) || 10;

      // Clear Canvas
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, width, height);

      // Coordinate Transform Helpers
      const toScreenX = (x) => ((x - xMin) / (xMax - xMin)) * width;
      const toScreenY = (y) => height - ((y - yMin) / (yMax - yMin)) * height;
      const toMathX = (px) => xMin + (px / width) * (xMax - xMin);
      const toMathY = (py) => yMin + ((height - py) / height) * (yMax - yMin);

      // Draw Grid & Axes
      drawGrid(width, height, xMin, xMax, yMin, yMax, toScreenX, toScreenY);

      // Fetch & Compile Functions
      const showRoots = document.getElementById('chk-roots').checked;
      const showIntersections = document.getElementById('chk-intersections').checked;

      if (currentMode === 'cartesian') {
        const fn1 = compileExpression(document.getElementById('input-f1-a').value);
        const fn2 = compileExpression(document.getElementById('input-f2-a').value);
        const fn3 = compileExpression(document.getElementById('input-f3-a').value);

        const fns = [
          { fn: fn1, color: COLORS.f1, name: 'f1' },
          { fn: fn2, color: COLORS.f2, name: 'f2' },
          { fn: fn3, color: COLORS.f3, name: 'f3' }
        ];

        // Plot curves
        fns.forEach(item => {
          if (item.fn) plotCartesian(item.fn, item.color, width, xMin, xMax, toScreenX, toScreenY);
        });

        // Numerical Root & Intersection Detection
        if (showRoots) findAndDrawRootsCartesian(fns.map(f => f.fn), xMin, xMax, toScreenX, toScreenY);
        if (showIntersections) findAndDrawIntersectionsCartesian(fns.map(f => f.fn), xMin, xMax, toScreenX, toScreenY);

        // Update Readout if hover exists
        if (hoverPos) {
          const mx = toMathX(hoverPos.x);
          document.getElementById('readout-pos').innerText = `(${mx.toFixed(2)}, ${toMathY(hoverPos.y).toFixed(2)})`;
          document.getElementById('readout-f1').innerText = fn1 ? fn1({x: mx}).toFixed(2) : '-';
          document.getElementById('readout-f2').innerText = fn2 ? fn2({x: mx}).toFixed(2) : '-';
          document.getElementById('readout-f3').innerText = fn3 ? fn3({x: mx}).toFixed(2) : '-';
        }

      } else if (currentMode === 'parametric') {
        const pMin = parseFloat(document.getElementById('pMin').value) || 0;
        const pMax = parseFloat(document.getElementById('pMax').value) || 6.283;

        const curves = [
          {
            xFn: compileExpression(document.getElementById('input-f1-a').value),
            yFn: compileExpression(document.getElementById('input-f1-b').value),
            color: COLORS.f1
          },
          {
            xFn: compileExpression(document.getElementById('input-f2-a').value),
            yFn: compileExpression(document.getElementById('input-f2-b').value),
            color: COLORS.f2
          },
          {
            xFn: compileExpression(document.getElementById('input-f3-a').value),
            yFn: compileExpression(document.getElementById('input-f3-b').value),
            color: COLORS.f3
          }
        ];

        curves.forEach(c => {
          if (c.xFn && c.yFn) plotParametric(c.xFn, c.yFn, pMin, pMax, c.color, toScreenX, toScreenY);
        });

        if (hoverPos) {
          const mx = toMathX(hoverPos.x);
          const my = toMathY(hoverPos.y);
          document.getElementById('readout-pos').innerText = `(${mx.toFixed(2)}, ${my.toFixed(2)})`;
          document.getElementById('readout-f1').innerText = 'Active';
          document.getElementById('readout-f2').innerText = 'Active';
          document.getElementById('readout-f3').innerText = 'Active';
        }

      } else if (currentMode === 'polar') {
        const pMin = parseFloat(document.getElementById('pMin').value) || 0;
        const pMax = parseFloat(document.getElementById('pMax').value) || 12.566;

        const rFns = [
          { fn: compileExpression(document.getElementById('input-f1-a').value), color: COLORS.f1 },
          { fn: compileExpression(document.getElementById('input-f2-a').value), color: COLORS.f2 },
          { fn: compileExpression(document.getElementById('input-f3-a').value), color: COLORS.f3 }
        ];

        rFns.forEach(item => {
          if (item.fn) plotPolar(item.fn, pMin, pMax, item.color, toScreenX, toScreenY);
        });

        if (hoverPos) {
          const mx = toMathX(hoverPos.x);
          const my = toMathY(hoverPos.y);
          document.getElementById('readout-pos').innerText = `(${mx.toFixed(2)}, ${my.toFixed(2)})`;
          document.getElementById('readout-f1').innerText = 'Active';
          document.getElementById('readout-f2').innerText = 'Active';
          document.getElementById('readout-f3').innerText = 'Active';
        }
      }

      // Draw Cursor Crosshairs
      if (hoverPos) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(hoverPos.x, 0);
        ctx.lineTo(hoverPos.x, height);
        ctx.moveTo(0, hoverPos.y);
        ctx.lineTo(width, hoverPos.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Grid Drawing
    function drawGrid(width, height, xMin, xMax, yMin, yMax, toScreenX, toScreenY) {
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;

      // Vertical Grid Lines
      const xRange = xMax - xMin;
      const xStep = Math.pow(10, Math.floor(Math.log10(xRange))) / 2 || 1;
      const startX = Math.ceil(xMin / xStep) * xStep;

      for (let x = startX; x <= xMax; x += xStep) {
        const sx = toScreenX(x);
        ctx.beginPath();
        ctx.moveTo(sx, 0);
        ctx.lineTo(sx, height);
        ctx.stroke();

        // Label
        if (Math.abs(x) > 0.0001) {
          ctx.fillStyle = '#64748b';
          ctx.font = '10px monospace';
          ctx.fillText(x.toFixed(1).replace(/\.0$/, ''), sx + 2, toScreenY(0) - 4);
        }
      }

      // Horizontal Grid Lines
      const yRange = yMax - yMin;
      const yStep = Math.pow(10, Math.floor(Math.log10(yRange))) / 2 || 1;
      const startY = Math.ceil(yMin / yStep) * yStep;

      for (let y = startY; y <= yMax; y += yStep) {
        const sy = toScreenY(y);
        ctx.beginPath();
        ctx.moveTo(0, sy);
        ctx.lineTo(width, sy);
        ctx.stroke();

        if (Math.abs(y) > 0.0001) {
          ctx.fillStyle = '#64748b';
          ctx.font = '10px monospace';
          ctx.fillText(y.toFixed(1).replace(/\.0$/, ''), toScreenX(0) + 4, sy - 2);
        }
      }

      // Main Axes
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 1.5;

      // X Axis
      const sy0 = toScreenY(0);
      ctx.beginPath();
      ctx.moveTo(0, sy0);
      ctx.lineTo(width, sy0);
      ctx.stroke();

      // Y Axis
      const sx0 = toScreenX(0);
      ctx.beginPath();
      ctx.moveTo(sx0, 0);
      ctx.lineTo(sx0, height);
      ctx.stroke();
    }

    // Cartesian Plotter
    function plotCartesian(fn, color, width, xMin, xMax, toScreenX, toScreenY) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();

      let started = false;
      const steps = width; // 1 step per pixel column
      for (let i = 0; i <= steps; i++) {
        const px = i;
        const x = xMin + (i / steps) * (xMax - xMin);
        const y = fn({ x });

        if (!isNaN(y) && isFinite(y)) {
          const py = toScreenY(y);
          if (!started) {
            ctx.moveTo(px, py);
            started = true;
          } else {
            ctx.lineTo(px, py);
          }
        } else {
          started = false;
        }
      }
      ctx.stroke();
    }

    // Parametric Plotter
    function plotParametric(xFn, yFn, tMin, tMax, color, toScreenX, toScreenY) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();

      const steps = 600;
      let started = false;

      for (let i = 0; i <= steps; i++) {
        const t = tMin + (i / steps) * (tMax - tMin);
        const x = xFn({ t });
        const y = yFn({ t });

        if (!isNaN(x) && !isNaN(y) && isFinite(x) && isFinite(y)) {
          const px = toScreenX(x);
          const py = toScreenY(y);
          if (!started) {
            ctx.moveTo(px, py);
            started = true;
          } else {
            ctx.lineTo(px, py);
          }
        } else {
          started = false;
        }
      }
      ctx.stroke();
    }

    // Polar Plotter
    function plotPolar(rFn, thetaMin, thetaMax, color, toScreenX, toScreenY) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();

      const steps = 800;
      let started = false;

      for (let i = 0; i <= steps; i++) {
        const theta = thetaMin + (i / steps) * (thetaMax - thetaMin);
        const r = rFn({ theta, x: theta }); // accept x or theta

        if (!isNaN(r) && isFinite(r)) {
          const x = r * Math.cos(theta);
          const y = r * Math.sin(theta);
          const px = toScreenX(x);
          const py = toScreenY(y);

          if (!started) {
            ctx.moveTo(px, py);
            started = true;
          } else {
            ctx.lineTo(px, py);
          }
        } else {
          started = false;
        }
      }
      ctx.stroke();
    }

    // Root Finder (Cartesian)
    function findAndDrawRootsCartesian(fns, xMin, xMax, toScreenX, toScreenY) {
      const steps = 300;
      const dx = (xMax - xMin) / steps;

      fns.forEach(fn => {
        if (!fn) return;
        for (let i = 0; i < steps; i++) {
          const x1 = xMin + i * dx;
          const x2 = x1 + dx;
          const y1 = fn({ x: x1 });
          const y2 = fn({ x: x2 });

          if (y1 * y2 <= 0 && !isNaN(y1) && !isNaN(y2)) {
            // Simple bisection to refine root
            let rx1 = x1, rx2 = x2, rmid = x1;
            for (let b = 0; b < 10; b++) {
              rmid = (rx1 + rx2) / 2;
              const ymid = fn({ x: rmid });
              if (fn({ x: rx1 }) * ymid <= 0) rx2 = rmid;
              else rx1 = rmid;
            }

            // Draw Root Marker
            ctx.fillStyle = COLORS.root;
            ctx.beginPath();
            ctx.arc(toScreenX(rmid), toScreenY(0), 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });
    }

    // Intersection Finder (Cartesian)
    function findAndDrawIntersectionsCartesian(fns, xMin, xMax, toScreenX, toScreenY) {
      const steps = 300;
      const dx = (xMax - xMin) / steps;

      const pairs = [
        [fns[0], fns[1]],
        [fns[0], fns[2]],
        [fns[1], fns[2]]
      ];

      pairs.forEach(([fA, fB]) => {
        if (!fA || !fB) return;
        for (let i = 0; i < steps; i++) {
          const x1 = xMin + i * dx;
          const x2 = x1 + dx;
          const d1 = fA({ x: x1 }) - fB({ x: x1 });
          const d2 = fA({ x: x2 }) - fB({ x: x2 });

          if (d1 * d2 <= 0 && !isNaN(d1) && !isNaN(d2)) {
            let rx1 = x1, rx2 = x2, rmid = x1;
            for (let b = 0; b < 10; b++) {
              rmid = (rx1 + rx2) / 2;
              const dmid = fA({ x: rmid }) - fB({ x: rmid });
              if ((fA({ x: rx1 }) - fB({ x: rx1 })) * dmid <= 0) rx2 = rmid;
              else rx1 = rmid;
            }

            const iy = fA({ x: rmid });
            ctx.fillStyle = COLORS.intersection;
            ctx.beginPath();
            ctx.arc(toScreenX(rmid), toScreenY(iy), 4, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      });
    }

    // Touch/Hover Event Listeners for Crosshairs
    function handlePointerMove(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      hoverPos = { x, y };
      draw();
    }

    function handlePointerLeave() {
      hoverPos = null;
      document.getElementById('readout-pos').innerText = '(-, -)';
      document.getElementById('readout-f1').innerText = '-';
      document.getElementById('readout-f2').innerText = '-';
      document.getElementById('readout-f3').innerText = '-';
      draw();
    }

    canvas.addEventListener('mousemove', handlePointerMove);
    canvas.addEventListener('mouseleave', handlePointerLeave);
    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handlePointerMove(e.touches[0]);
      }
    });
    canvas.addEventListener('touchend', handlePointerLeave);

    // PNG Export Engine
    function exportGraph() {
      const exportCanvas = document.createElement('canvas');
      const eCtx = exportCanvas.getContext('2d');
      exportCanvas.width = 1200;
      exportCanvas.height = 900;

      // Background
      eCtx.fillStyle = '#0f172a';
      eCtx.fillRect(0, 0, 1200, 900);

      // Title
      eCtx.fillStyle = '#f8fafc';
      eCtx.font = 'bold 32px -apple-system, sans-serif';
      eCtx.textAlign = 'center';
      eCtx.fillText('Comparing three functions', 600, 50);

      // Subtitle Mode
      eCtx.fillStyle = '#94a3b8';
      eCtx.font = '18px sans-serif';
      eCtx.fillText(`Mode: ${currentMode.toUpperCase()}`, 600, 80);

      // Copy Main Plot View
      eCtx.drawImage(canvas, 100, 110, 1000, 680);

      // Draw Legend Box at Bottom
      eCtx.fillStyle = '#1e293b';
      eCtx.strokeStyle = '#475569';
      eCtx.lineWidth = 1;
      eCtx.roundRect(100, 810, 1000, 60, 8);
      eCtx.fill();
      eCtx.stroke();

      // Legend Content
      const getExprText = (idA, idB) => {
        const a = document.getElementById(idA).value;
        const b = document.getElementById(idB).value;
        return b ? `(${a}, ${b})` : a;
      };

      const leg1 = getExprText('input-f1-a', 'input-f1-b');
      const leg2 = getExprText('input-f2-a', 'input-f2-b');
      const leg3 = getExprText('input-f3-a', 'input-f3-b');

      eCtx.font = '16px monospace';
      eCtx.textAlign = 'left';

      // Item 1
      eCtx.fillStyle = COLORS.f1;
      eCtx.beginPath(); eCtx.arc(130, 840, 6, 0, Math.PI * 2); eCtx.fill();
      eCtx.fillStyle = '#f8fafc';
      eCtx.fillText(`f1: ${leg1}`, 145, 845);

      // Item 2
      eCtx.fillStyle = COLORS.f2;
      eCtx.beginPath(); eCtx.arc(450, 840, 6, 0, Math.PI * 2); eCtx.fill();
      eCtx.fillStyle = '#f8fafc';
      eCtx.fillText(`f2: ${leg2}`, 465, 845);

      // Item 3
      eCtx.fillStyle = COLORS.f3;
      eCtx.beginPath(); eCtx.arc(770, 840, 6, 0, Math.PI * 2); eCtx.fill();
      eCtx.fillStyle = '#f8fafc';
      eCtx.fillText(`f3: ${leg3}`, 785, 845);

      // Download
      const link = document.createElement('a');
      link.download = 'Comparing_three_functions.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
    }

    // Initial Load
    window.onload = () => {
      resizeCanvas();
    };
  </script>
</body>
