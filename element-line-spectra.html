<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atomic Emission Spectra Visualizer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      max-width: 1200px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: var(--accent);
    }

    p.subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Controls Header */
    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .search-box {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
      width: 100%;
      max-width: 250px;
    }

    .view-toggle {
      display: flex;
      gap: 6px;
    }

    .btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn.active, .btn:hover {
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
    }

    /* Periodic Table Display */
    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    /* Standard Grid Layout */
    .periodic-table {
      display: grid;
      grid-template-columns: repeat(18, minmax(36px, 1fr));
      gap: 4px;
      min-width: 680px;
    }

    /* Mobile Compact View */
    .periodic-table.mobile-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
      min-width: 0;
      gap: 6px;
    }

    .element {
      aspect-ratio: 1;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, border-color 0.2s;
      position: relative;
    }

    .element:hover {
      transform: scale(1.1);
      border-color: var(--accent);
      z-index: 10;
    }

    .element.selected {
      border: 2px solid var(--accent);
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .element .num {
      font-size: 0.6rem;
      color: var(--text-muted);
      position: absolute;
      top: 2px;
      left: 4px;
    }

    .element .sym {
      font-size: 0.95rem;
      font-weight: bold;
    }

    .element .name {
      font-size: 0.55rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }

    /* Spectrum Viewer Card */
    .spectrum-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .element-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .element-info h2 {
      font-size: 1.4rem;
      color: var(--accent);
    }

    .spectrum-canvas-container {
      position: relative;
      width: 100%;
      height: 120px;
      background: #000;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .spectrum-ruler {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 0 4px;
      margin-top: 4px;
    }

    /* Spectral Lines List */
    .lines-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
      padding: 8px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .line-chip {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    @media (max-width: 768px) {
      body { padding: 8px; }
      h1 { font-size: 1.4rem; }
      .element .name { display: none; }
      .periodic-table { gap: 2px; }
      .spectrum-canvas-container { height: 90px; }
    }
  </style>
</head>

    let currentSelectedZ = 1;
    let isCompact = false;

    const periodicTableEl = document.getElementById("periodicTable");
    const searchInput = document.getElementById("search");
    const canvas = document.getElementById("spectrumCanvas");
    const ctx = canvas.getContext("2d");
    const elemNameEl = document.getElementById("elemName");
    const elemDetailsEl = document.getElementById("elemDetails");
    const linesListEl = document.getElementById("linesList");

    // Convert nanometers (380 - 750 nm) into approximate RGB color
    function nmToRGB(wavelength) {
      let r, g, b;
      if (wavelength >= 380 && wavelength < 440) {
        r = -(wavelength - 440) / (440 - 380); g = 0; b = 1;
      } else if (wavelength >= 440 && wavelength < 490) {
        r = 0; g = (wavelength - 440) / (490 - 440); b = 1;
      } else if (wavelength >= 490 && wavelength < 510) {
        r = 0; g = 1; b = -(wavelength - 510) / (510 - 490);
      } else if (wavelength >= 510 && wavelength < 580) {
        r = (wavelength - 510) / (580 - 510); g = 1; b = 0;
      } else if (wavelength >= 580 && wavelength < 645) {
        r = 1; g = -(wavelength - 645) / (645 - 580); b = 0;
      } else if (wavelength >= 645 && wavelength <= 750) {
        r = 1; g = 0; b = 0;
      } else {
        r = 0; g = 0; b = 0;
      }

      // Intensity falloff near limits
      let factor = 1;
      if (wavelength >= 380 && wavelength < 420) {
        factor = 0.3 + 0.7 * (wavelength - 380) / (420 - 380);
      } else if (wavelength >= 700 && wavelength <= 750) {
        factor = 0.3 + 0.7 * (750 - wavelength) / (750 - 700);
      }

      return [
        Math.round(r * factor * 255),
        Math.round(g * factor * 255),
        Math.round(b * factor * 255)
      ];
    }

    // Render Periodic Table UI
    function renderTable(filterText = "") {
      periodicTableEl.innerHTML = "";
      
      elementsData.forEach(elem => {
        const matches = elem.name.toLowerCase().includes(filterText.toLowerCase()) || 
                        elem.sym.toLowerCase().includes(filterText.toLowerCase()) ||
                        elem.z.toString().includes(filterText);

        if (filterText && !matches) return;

        const elDiv = document.createElement("div");
        elDiv.className = `element ${elem.z === currentSelectedZ ? 'selected' : ''}`;
        
        if (!isCompact) {
          elDiv.style.gridRow = elem.row;
          elDiv.style.gridColumn = elem.col;
        }

        elDiv.innerHTML = `
          <span class="num">${elem.z}</span>
          <span class="sym">${elem.sym}</span>
          <span class="name">${elem.name}</span>
        `;

        elDiv.addEventListener("click", () => selectElement(elem.z));
        periodicTableEl.appendChild(elDiv);
      });
    }

    // Select Element & Draw Spectrum
    function selectElement(z) {
      currentSelectedZ = z;
      const elem = elementsData.find(e => e.z === z);
      
      // Highlight updated selection
      document.querySelectorAll(".element").forEach(el => el.classList.remove("selected"));
      renderTable(searchInput.value);

      // Update Details
      elemNameEl.innerText = `${elem.name} (${elem.sym})`;
      elemDetailsEl.innerText = `Atomic Number: ${elem.z} | Total Visible Lines Recorded: ${elem.lines.length}`;

      // Draw Spectrum Canvas
      drawSpectrum(elem.lines);

      // Update Lines List
      linesListEl.innerHTML = "";
      elem.lines.forEach(wl => {
        const [r, g, b] = nmToRGB(wl);
        const chip = document.createElement("div");
        chip.className = "line-chip";
        chip.innerHTML = `
          <div class="color-dot" style="background: rgb(${r}, ${g}, ${b})"></div>
          <span>${wl} nm</span>
        `;
        linesListEl.appendChild(chip);
      });
    }

    // Draw lines on black background canvas
    function drawSpectrum(lines) {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;

      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const minWl = 380;
      const maxWl = 750;

      lines.forEach(wl => {
        if (wl < minWl || wl > maxWl) return;

        const x = ((wl - minWl) / (maxWl - minWl)) * canvas.width;
        const [r, g, b] = nmToRGB(wl);

        // Draw line with glowing gradient effect
        const grad = ctx.createLinearGradient(x - 3, 0, x + 3, 0);
        grad.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0)`);
        grad.addColorStop(0.5, `rgba(${r}, ${g}, ${b}, 0.9)`);
        grad.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);

        ctx.fillStyle = grad;
        ctx.fillRect(x - 4, 0, 8, canvas.height);

        // Core bright line
        ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
        ctx.fillRect(x - 0.75, 0, 1.5, canvas.height);
      });
    }

    // Event Listeners
    searchInput.addEventListener("input", (e) => renderTable(e.target.value));

    document.getElementById("btnGrid").addEventListener("click", () => {
      isCompact = false;
      periodicTableEl.classList.remove("mobile-list");
      document.getElementById("btnGrid").classList.add("active");
      document.getElementById("btnList").classList.remove("active");
      renderTable(searchInput.value);
    });

    document.getElementById("btnList").addEventListener("click", () => {
      isCompact = true;
      periodicTableEl.classList.add("mobile-list");
      document.getElementById("btnList").classList.add("active");
      document.getElementById("btnGrid").classList.remove("active");
      renderTable(searchInput.value);
    });

    window.addEventListener("resize", () => {
      const elem = elementsData.find(e => e.z === currentSelectedZ);
      if (elem) drawSpectrum(elem.lines);
    });

    // Auto-switch to compact mode on small screens
    if (window.innerWidth < 768) {
      isCompact = true;
      periodicTableEl.classList.add("mobile-list");
      document.getElementById("btnList").classList.add("active");
      document.getElementById("btnGrid").classList.remove("active");
    }

    // Initial Load
    renderTable();
    selectElement(1);
  </script>
</body>
</html>
