<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d18">
<script>(function(){try{var t=localStorage.getItem('experiment-simulation.theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#edf2f9':'#070d18');}}catch(e){}})();</script>
<title>Limiting Reagent Lab · Lite</title>
<style>
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070d18; --card:#0f1a2b; --card2:#0b1524; --line:#1e2c44;
  --txt:#e9f0ff; --muted:#8ea2c6; --accent:#4fb8ff; --accent-ink:#04121f;
  --good:#34d399; --bad:#fb7185; --gold:#fbbf24; --heat:#ff9a3c;
  --shadow:0 14px 38px rgba(0,0,0,.45); --radius:16px; color-scheme:dark;
}
body{
  margin:0; color:var(--txt); background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;
  background-image:radial-gradient(900px 500px at 8% -10%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%),
                   radial-gradient(700px 420px at 100% 0%, color-mix(in srgb, var(--good) 8%, transparent), transparent 70%);
  background-attachment:fixed;
}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:700;letter-spacing:-.01em}
p{margin:.5em 0}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none !important}

.topbar{
  position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter:blur(14px); border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.brand>div{min-width:0}
.brand h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{
  width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 30%,transparent),color-mix(in srgb,var(--good) 18%,transparent));
  border:1px solid var(--line);
}
.brand h1{font-size:16px}
.brand .sub{margin:0;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.brand .sub .sublabel{white-space:nowrap}
@media (max-width:1100px){ .brand .sub .sublabel{display:none} }
.iconbtn{
  height:40px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;
}
.iconbtn:active{transform:scale(.96)}

.app{max-width:1460px;margin:0 auto;padding:14px;display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 384px;align-items:start}
@media (max-width:1020px){ .app{grid-template-columns:1fr} }
.benchcol{min-width:0}
.benchhead{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.rail{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;
  padding:5px 9px;border-radius:99px;border:1px solid var(--line);background:var(--card2);color:var(--muted);
}
.pill b{font-size:10px;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted)}
.pill.done{color:var(--good);border-color:color-mix(in srgb,var(--good) 42%,var(--line))}
.pill.done b{background:var(--good);color:#04120a}
.pill.now{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 10%,var(--card2))}
.pill.now b{background:var(--accent);color:var(--accent-ink)}
.massstrip{display:flex;gap:6px;flex-wrap:wrap}
.mchip{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.mchip b{color:var(--txt);font-variant-numeric:tabular-nums}

.scene{
  position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  background:var(--scene-bg); box-shadow:var(--shadow);container-type:inline-size;
}
.scene svg{display:block;width:100%;height:auto}
.scenetag{
  position:absolute;left:12px;top:11px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--tag-ink);font-weight:800;opacity:.75;
}
.benchsum{
  margin:0;padding:10px 14px 12px;font-size:12.5px;line-height:1.55;color:var(--muted);
  border-top:1px solid var(--line);
}
/* A caption is 12.5 units in a 960-unit scene: 9px of caption needs a 696px bench, and the two-column layout hands
   the bench 595px at a 1021px window but 854px at 1280px, so the query follows the bench, not the window. */
.caplegend{display:none;padding:9px 14px 0;font-size:11px;line-height:1.5;color:var(--muted)}
@container (max-width:695px){
  .cap{display:none}
  .caplegend{display:block}
}

.panel{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;
  position:sticky;top:76px;max-height:calc(100dvh - 92px);
}
@media (max-width:1020px){ .panel{position:static;max-height:none} }
.phead{padding:14px 16px 11px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800}
.phead h2{font-size:18px;margin-top:3px}
.pbody{padding:14px 16px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.pfoot{padding:11px 16px calc(13px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--card2)}
.gate{margin:0 0 8px;font-size:12px;color:var(--gold);min-height:0}
.gate:empty{display:none}

.instr{font-size:13.5px;color:var(--muted);margin:0 0 12px;line-height:1.6}
.small{font-size:12px;color:var(--muted)}
.task{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px}
.task.done{border-color:color-mix(in srgb,var(--good) 40%,var(--line));background:color-mix(in srgb,var(--good) 7%,var(--card2))}
.task.active{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:color-mix(in srgb,var(--accent) 7%,var(--card2))}
.taskhead{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:700;margin-bottom:6px}
.taskhead .tag{font-size:11px;font-weight:700;color:var(--muted);padding:2px 7px;border-radius:6px;border:1px solid var(--line)}
.checkmark{color:var(--good);font-weight:900}

.checks{list-style:none;padding:0;margin:6px 0 10px;display:grid;gap:3px}
.checks li{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:flex-start}
.checks li::before{content:"○";color:var(--line);font-weight:700}
.checks li.done{color:var(--txt)}
.checks li.done::before{content:"✓";color:var(--good)}

.btn{
  border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:10px 13px;
  font-size:13.5px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .1s,border-color .12s,background .12s;
}
.btn:active{transform:scale(.975)}
.btn.primary{background:linear-gradient(160deg,var(--accent),color-mix(in srgb,var(--accent) 76%,#000 14%));color:var(--accent-ink);border-color:transparent;font-weight:800}
.btn.warm{background:linear-gradient(160deg,var(--heat),#e06a1c);color:#1b0a00;border-color:transparent;font-weight:800}
.btn.big{width:100%;padding:14px;font-size:15px;border-radius:13px}
.btn.ghost{background:transparent}
.btn.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card2))}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:7px;flex-wrap:wrap}
.row>.btn{flex:1 1 104px}
.row.tight{gap:6px}

.slider{margin:8px 0 10px}
.slider .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:11px}
.steprow{display:flex;align-items:center;gap:8px;margin-top:2px}
.steprow input[type=range]{flex:1;min-width:0}
.stepbtn{
  flex:0 0 42px;height:38px;padding:0;border-radius:10px;border:1px solid var(--line);
  background:var(--card2);font-size:18px;font-weight:800;line-height:1;display:grid;place-items:center;
}
.stepbtn:active{background:color-mix(in srgb,var(--accent) 18%,var(--card2));color:var(--accent)}
.stepbtn[disabled]{opacity:.35;pointer-events:none}
.slider .lab b{color:var(--txt);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--line);border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-8px;
  background:radial-gradient(circle at 35% 30%,#dff0ff,var(--accent));border:2px solid var(--thumb-edge);
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:2px solid var(--thumb-edge);border-radius:50%;background:var(--accent)}

.clock{
  display:flex;align-items:baseline;gap:8px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:26px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px;
}
.clock small{font-size:12px;color:var(--muted);font-weight:600;font-family:inherit;letter-spacing:0}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:10px}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--good));transition:width .2s}
.bar.warm>i{background:linear-gradient(90deg,var(--gold),var(--heat))}
.vol{font-size:12.5px;color:var(--muted);margin:0 0 9px}
.vol b{color:var(--txt);font-variant-numeric:tabular-nums}
.vol.warn b{color:var(--bad)}

.obs{
  font-size:12.5px;border-radius:9px;padding:8px 10px;margin-top:8px;
  border:1px solid var(--line);background:var(--card);color:var(--muted);
}
.obs.cloudy{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--txt);
  background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.obs.clear{border-color:color-mix(in srgb,var(--good) 40%,var(--line));color:var(--txt);
  background:color-mix(in srgb,var(--good) 7%,var(--card))}

.log{margin-top:4px;border-top:1px dashed var(--line);padding-top:9px}
.log h4{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.log ol{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-height:104px;overflow:auto}
.log li{font-size:11.5px;color:var(--muted);line-height:1.45;padding-left:12px;position:relative}
.log li::before{content:"›";position:absolute;left:0;color:var(--accent)}

.results{max-width:1080px;margin:0 auto;padding:14px 14px 60px}
.rhead{text-align:center;padding:14px 6px 18px}
.rhead h2{font-size:25px;margin:6px 0 4px}
.rhead p{color:var(--muted);font-size:13.5px;margin:0}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
/* A results card can hold a table wider than the screen it is read on. min-width:0 stops the grid item
   from growing to fit that table, and the card scrolls its own table instead of pushing the page wide. */
.rgrid > *{min-width:0}
.rgrid .card{overflow-x:auto}
@media (max-width:880px){ .rgrid{grid-template-columns:1fr} }
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.card h3 .n{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data td:first-child{color:var(--muted)}
table.data td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
/* A long post-lab answer wraps instead of running past the edge; the label column keeps a fixed share
   so its short answers stay on one line. */
table.data[data-nb="Post-lab"] td:last-child{white-space:normal}
table.data[data-nb="Post-lab"] td:first-child{width:58%}
table.data[data-nb="Post-lab"] td:last-child{width:42%}
/* The discussion is written, not marked: a plain box here, and a paragraph that wraps on the hand-in sheet. */
.pdiscuss{width:100%;resize:vertical;background:var(--card2);border:1px solid var(--line);border-radius:10px;
  color:var(--txt);font:inherit;font-size:13px;line-height:1.65;padding:10px 12px;outline:0}
.pdiscuss:focus{border-color:var(--accent)}
.nbdiscuss{white-space:pre-wrap;font-size:13px;line-height:1.6;margin-top:6px}
table.data tr.key td{color:var(--gold)}
table.data tr.key td:last-child{color:var(--gold)}
.math{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.4px;line-height:1.75;color:var(--txt);
  background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre;margin:8px 0}
.math .c{color:var(--muted)}
.math .h{color:var(--accent);font-weight:700}
.math .g{color:var(--good);font-weight:700}
/* The purpose equation reads as one line from 601px up; on phones it breaks at the arrow rather than scrolling
   sideways, since fitting it on one line there would need an unreadable ~8px font. */
@media (min-width:601px){ .eqbr{display:none} }
.yieldbox{text-align:center;padding:10px 0 4px}
.yieldbox .big{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.yieldbox .big.good{color:var(--good)}
.yieldbox .big.warn{color:var(--gold)}
.yieldbox .big.bad{color:var(--bad)}
.yieldbox .cap{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-top:6px}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.errlist{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--muted);line-height:1.65}
.errlist li{margin-bottom:4px}
.errlist b{color:var(--txt);font-weight:650}
.rfoot{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.rfoot .btn{min-width:170px}
@media (max-width:880px){
  .rfoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:10px auto 0}
  .rfoot .btn{min-width:0;width:100%}
  .rhead{padding:18px 10px 24px}
  .rhead h2{font-size:22px;text-wrap:balance}
  .rhead p{text-wrap:balance}
}
@media (max-width:520px){ .rfoot{grid-template-columns:1fr;max-width:360px} }

/* ---------- pre-lab worksheet ---------- */
.prelab{max-width:900px;margin:0 auto;padding:14px 14px 60px}
.plhead{text-align:center;padding:8px 6px 16px}
.plhead h2{font-size:24px;margin:6px 0 4px}
.plhead p{color:var(--muted);font-size:13.5px;margin:0}
.bank{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.bank li{display:flex;gap:8px;font-size:12.5px;color:var(--muted);line-height:1.45;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.bank li b{color:var(--accent);flex:0 0 16px}
table.ptab{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.ptab td{padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.ptab tr.prow.ok{background:color-mix(in srgb,var(--good) 8%,transparent)}
table.ptab tr.prow.bad{background:color-mix(in srgb,var(--bad) 8%,transparent)}
.pterm{color:var(--txt);font-weight:600}
.pselcell{width:92px}
select.psel{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font:inherit;font-size:12.5px;font-weight:700;text-align:center}
select.psel.ok{border-color:var(--good);color:var(--good)}
select.psel.bad{border-color:var(--bad);color:var(--bad)}
.pfixcell{width:78px;text-align:right;font-size:11px;color:var(--bad)}
.pf{display:grid;grid-template-columns:1fr 176px;gap:6px 10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2);margin-bottom:6px}
.pf .plab{font-size:12.5px;color:var(--muted);font-weight:600}
.pfield{display:flex;align-items:center;gap:6px;justify-self:end}
.pfield input{width:96px;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt);font:inherit;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;padding:6px 8px;outline:0}
.pfield input:focus{border-color:var(--accent)}
.pfield em{font-style:normal;font-size:11px;color:var(--muted);width:38px}
.pfield input.ok{border-color:var(--good);color:var(--good)}
.pfield input.bad{border-color:var(--bad);color:var(--bad)}
.pf.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.pf.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.pf-fix{font-size:11px;color:var(--bad);grid-column:1/-1}
.pf-fix:empty{display:none}
.picks{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 2px}
.picks .btn.on{border-color:var(--good);color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--card2))}
.scorebar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
#prelabScore,#postlabScore{font-size:13px;font-weight:700;color:var(--muted)}
#prelabScore.ok,#postlabScore.ok{color:var(--good)}
#prelabScore.bad,#postlabScore.bad{color:var(--gold)}
.pickgroup{margin-bottom:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.pickgroup.ok{border-color:color-mix(in srgb,var(--good) 45%,var(--line));background:color-mix(in srgb,var(--good) 7%,var(--card2))}
.pickgroup.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 7%,var(--card2))}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--muted);padding:5px 0;line-height:1.5}
.chk input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:0 0 16px}
.chklist{border-left:2px solid transparent;padding-left:9px}
.chklist.ok{border-left-color:var(--good)}
.chklist.bad{border-left-color:var(--bad)}
.wf{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.wbar{display:flex;height:9px;border-radius:99px;overflow:hidden;background:var(--line);margin-bottom:9px}
.wbar>i{display:block;height:100%}
.wbar>i.got{background:linear-gradient(90deg,var(--accent),var(--good))}
.wbar>i.lost{background:#8a4040}
.wfrow{display:flex;align-items:baseline;gap:7px;font-size:11.5px;color:var(--muted);padding:1.5px 0}
.wfrow b{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--txt);font-weight:600}
.wfrow.total{color:var(--txt);font-weight:600;border-top:1px solid var(--line);margin-top:5px;padding-top:6px}
.wfd{width:7px;height:7px;border-radius:99px;flex:0 0 7px;background:#8a4040}
.wfd.got{background:var(--good)}
.wfd.gain{background:var(--warn)}
.wfd.none{background:transparent}
@media (max-width:600px){
  .topbar{flex-wrap:wrap;gap:8px;padding-bottom:9px}
  .brand{flex:1 1 100%}
  .iconbtn{flex:1 1 calc(50% - 4px);padding:0 9px;font-size:12px}
  .brand .sub{display:none}
  .prelab{padding:12px 10px 40px}
  .plhead h2{font-size:20px}
  .pf{grid-template-columns:1fr;gap:4px;padding:8px 10px}
  .pfield{justify-self:stretch}
  .pfield input{flex:1;width:auto;text-align:left}
  .pfield em{width:46px;text-align:right}
  table.ptab,table.ptab tbody{display:block}
  table.ptab tr.prow{display:grid;grid-template-columns:1fr 74px;gap:0 8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
  table.ptab td{border:0;padding:3px 0}
  table.ptab{font-size:13px}
  .pselcell{width:74px}
  select.psel{padding:9px 6px;font-size:13px}
  .pfixcell{grid-column:1/-1;text-align:left;padding:0 0 3px}
  .picks .btn{flex:1 1 auto}
  .scorebar{position:static;margin-top:14px}
  .scorebar .btn{flex:1 1 auto}
  .prelab .card{padding:13px}
}

.modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);backdrop-filter:blur(3px)}
.modalcard{width:100%;max-width:720px;max-height:86vh;background:var(--card);border:1px solid var(--line);
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideup .22s ease-out}
@keyframes slideup{from{transform:translateY(26px);opacity:.6}to{transform:none;opacity:1}}
.modalhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modalhead h2{font-size:16px;flex:1}
.modalbody{overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.nbacts{display:flex;gap:8px;margin-top:16px}
.nbacts .btn{flex:1}
.nbid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.nbid label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.nbid input{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--txt);font:inherit;font-size:12.5px;font-weight:600}
.nbid input.need{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 24%,transparent)}
/* The pre-lab's own name line: the export prints it, so the sheet asks for it up front. */
.plid{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.plid label{display:flex;gap:8px;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.plid input{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--txt);font:inherit;font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none;min-width:230px}
.plid input.need{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 24%,transparent)}
.plid-hint{font-size:11.5px;color:var(--muted)}
.nbclear{margin:-6px 0 12px}
.nbfill{display:none}
.nbtitle{font-size:14px;margin-bottom:10px}
/* Printing hands in only the notebook, on a light page. */
/* The notebook prints as a hand-in sheet; a plain Ctrl+P on the bench still prints the bench. */
@media print{
  /* With background graphics on, the root canvas (dark, from :root's color-scheme) inks the page
     margins around the white sheet. A light root makes that canvas white, edge to edge, and body
     inherits it. */
  html:has(body.nb-open){color-scheme:light}
  body.nb-open{background-image:none;
    --bg:#fff;--card:#fff;--card2:#fff;--line:#c9d2e0;--txt:#101828;--muted:#475467;
    --accent:#0b5fa5;--good:#067647;--bad:#b42318}
  body.nb-open .topbar,body.nb-open main,body.nb-open .modalhead,body.nb-open .nbacts,body.nb-open .toast,
  body.nb-open .nbclear,body.nb-open #modalBody [data-ui="restart"]{display:none !important}
  /* Incomplete details: the short note prints instead of the sheet. */
  body.nb-open.nb-note #modalBody > :not(.nbfill){display:none !important}
  body.nb-open.nb-note .nbfill{display:block}
  body.nb-open .modal{position:static;inset:auto;background:none;backdrop-filter:none;display:block}
  /* Printing during the card's open animation would ink it at partial opacity; print it settled. */
  body.nb-open .modalcard{max-width:none;max-height:none;border:0;background:#fff;box-shadow:none;animation:none}
  body.nb-open .modalbody{overflow:visible;padding:0}
  body.nb-open table.data td{padding:4px 4px;font-size:11.5px}
  /* A header field still holding the cursor prints with its focus ring and text caret; the name should
     be plain text on the sheet. */
  body.nb-open input:focus{outline:0;caret-color:transparent}
  /* On paper the constant-mass check wraps rather than running past the margin; on screen the value
     keeps to one line and a narrow modal scrolls. */
  body.nb-open table.data tr.wrapval td:last-child{white-space:normal}
  body.nb-open .errlist{font-size:11px;line-height:1.5}
  body.nb-open .errlist li{break-inside:avoid}
  body.nb-open h3{break-after:avoid}
  body.nb-open .nb-postlab{break-before:page}
  body.nb-open .nbid input{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
    padding:0 0 2px;color:var(--txt)}
  /* The pre-lab exports on its own: the same light page, the bench and the buttons left out, the
     picks and any feedback kept so the PDF shows what the student actually did. */
  html:has(body.sheet-print){color-scheme:light}
  body.sheet-print{background-image:none;
    --bg:#fff;--card:#fff;--card2:#fff;--line:#c9d2e0;--txt:#101828;--muted:#475467;
    --accent:#0b5fa5;--good:#067647;--bad:#b42318}
  body.sheet-print .topbar,body.sheet-print .toast,body.sheet-print #modal,
  body.sheet-print [data-ui]{display:none !important}
  body.sheet-print .prelab{padding:0;max-width:none}
  body.sheet-print .card{break-inside:avoid}
  body.sheet-print .scorebar{position:static;border:0;background:none;padding:0;margin-top:8px}
  body.sheet-print input:focus{outline:0;caret-color:transparent}
  body.sheet-print .plid input{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
    padding:0 0 2px;color:var(--txt)}
  @page{margin:14mm}
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(6px);bottom:24px;
  background:var(--card);border:1px solid var(--line);color:var(--txt);padding:9px 15px;border-radius:12px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:70;opacity:0;transition:.22s;pointer-events:none;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes bub{0%{transform:translateY(0);opacity:.85}100%{transform:translateY(calc(var(--bubrise,26px)*-1));opacity:0}}
.bub{animation:bub calc(1.5s / var(--bubrate,1)) linear infinite}
@keyframes steam{0%{transform:translateY(0) scaleX(1);opacity:0}25%{opacity:.5}100%{transform:translateY(-52px) scaleX(1.5);opacity:0}}
.steam{animation:steam 3.2s ease-out infinite}
@keyframes poul{0%,100%{opacity:.35}50%{opacity:.95}}
.pulse{animation:poul 1.8s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.35}50%{opacity:.85}}
.hglow{animation:glowp 1.4s ease-in-out infinite}
@keyframes drift{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
.drop{animation:drift 1.1s linear infinite}
/* Reagent tipped off the spatula: each grain falls from the blade into the bowl and fades as it lands. */
@keyframes sprinkle{0%{transform:translateY(0);opacity:0}10%{opacity:.95}78%{opacity:.9}100%{transform:translateY(64px);opacity:0}}
.grain{animation:sprinkle .6s cubic-bezier(.35,.05,.8,.6) forwards}
/* D.I. water poured into a flask: the stream runs while the liquid in the flask climbs. The stream is
   drawn all the way to the flask's floor and clipped back to the water line at the same 1.15 s
   ease-out, so its tip rides the rising surface instead of hanging above it. */
@keyframes fillup{from{transform:scaleY(var(--fillfrom,.03))}to{transform:scaleY(1)}}
.pourfill{transform-box:fill-box;transform-origin:bottom;animation:fillup 1.15s ease-out both}
@keyframes streamcut{from{clip-path:inset(0 0 var(--pourcut0,0%) 0)}to{clip-path:inset(0 0 var(--pourcut) 0)}}
@keyframes pourstream{0%{opacity:0}12%{opacity:.9}80%{opacity:.9}100%{opacity:0}}
.pourstream{animation:pourstream var(--pours,1.2s) ease-out both,streamcut 1.15s ease-out both}
/* The flask is carried off the bench to the beaker, tipped over it while the solution runs in, then set
   back down. The transform pivots on the flask's mouth, so rotating it is what tips it over the rim; --carryx
   is how far the mouth has to travel from the bench. */
@keyframes mixcarry{
  0%{transform:translate(var(--carryx),0) rotate(0deg)}
  12%{transform:translate(var(--carryx),calc(var(--liftup)*-1)) rotate(0deg)}
  20%{transform:translate(calc(var(--carryx)*.39),calc(var(--liftup)*-1)) rotate(0deg)}
  32%{transform:translate(0,calc(var(--lift)*-1)) rotate(104deg)}
  76%{transform:translate(0,calc(var(--lift)*-1)) rotate(104deg)}
  84%{transform:translate(calc(var(--carryx)*.39),calc(var(--liftup)*-1)) rotate(0deg)}
  92%{transform:translate(var(--carryx),calc(var(--liftup)*-1)) rotate(0deg)}
  100%{transform:translate(var(--carryx),0) rotate(0deg)}
}
.mixcarry{transform-box:view-box;transform-origin:var(--mx) var(--my);animation:mixcarry 2.6s ease-in-out both}
/* The bench copy of the flask is hidden while its carried twin is away, and fades back in as it lands. */
@keyframes benchhush{0%{opacity:1}4%{opacity:0}99%{opacity:0}100%{opacity:1}}
.mixbenchhush{animation:benchhush 2.6s linear forwards}
@keyframes juglift{0%{transform:translate(44px,20px);opacity:0}30%{opacity:1}100%{transform:none;opacity:1}}
.juglift{animation:juglift .25s ease-out both}
/* A rinse: the wash bottle comes down over the flask and sprays into its neck, then leaves before the flask is
   carried off. One 3.5 s animation covers the whole rinse, so the scene is not re-rendered half way through. */
@keyframes rinsespray{
  0%{opacity:0;transform:translate(20px,26px) rotate(-16deg)}
  8%,24%{opacity:1;transform:none}
  26%,100%{opacity:0}
}
.rinsespray{transform-box:fill-box;transform-origin:center;animation:rinsespray 3.5s ease-out both}
/* A tool lifted off the bench, carried to a vessel, tipped over it and set back down. The digest wash bottle, the
   filtration beaker and the rinse bottle all use this pair: the outer group travels (--dx/--dy), the inner one tips
   about its spout (--px/--py) by --tipdeg, and --dur lets each action keep its own timing. */
@keyframes carry{0%{transform:translate(var(--dx),var(--dy))}30%,78%{transform:none}100%{transform:translate(var(--dx),var(--dy))}}
.carry{animation:carry var(--dur,2.6s) ease-in-out both}
@keyframes tipopen{0%,14%{transform:rotate(0deg)}34%,80%{transform:rotate(var(--tipdeg,-150deg))}100%{transform:rotate(0deg)}}
.tipopen{transform-box:view-box;transform-origin:var(--px) var(--py);animation:tipopen var(--dur,2.6s) ease-in-out both}
/* The label is printed on the glass, so a tipped bottle would show it upside down. It runs the tip's own keyframes,
   on the tip's own clock, turned the other way: level for as long as the bottle is held tipped, and left alone while
   the bottle is still upright on its way. */
@keyframes tiplevel{0%,14%{transform:rotate(0deg)}34%,80%{transform:rotate(calc(-1 * var(--tipdeg,-150deg)))}100%{transform:rotate(0deg)}}
.labellevel{transform-box:view-box;transform-origin:var(--lx) var(--ly);animation:tiplevel var(--dur,2.6s) ease-in-out both}
/* A vessel emptying: it is drawn with a token level and --fillfrom is how many times taller the liquid was to
   begin with, so the drain runs it down to nothing rather than to a film. The glass clip keeps it inside. */
@keyframes drainfill{from{transform:scaleY(var(--fillfrom))}to{transform:scaleY(0)}}
.drainfill{transform-box:fill-box;transform-origin:bottom;animation:drainfill 1.15s ease-in both}
/* What the Büchner bowl holds between the pour and the vacuum pulling it through: up, a moment, then down. */
@keyframes bowlpass{0%{transform:scaleY(0)}34%{transform:scaleY(1)}62%{transform:scaleY(1)}92%,100%{transform:scaleY(0)}}
.bowlpass{transform-box:fill-box;transform-origin:bottom;animation:bowlpass var(--dur,3s) ease-in-out both}
/* The trip a wash tool makes: from its own place on the bench, a stop of --dip on the way if it draws its water
   there (the pipet in the ice bath), across to the funnel, and home. The bottle pours where it stands, so it leaves
   --dip at 0. */
@keyframes tooltrip{0%{transform:none}14%,26%{transform:translate(0,var(--dip))}46%,84%{transform:translate(var(--wx),var(--wy))}100%{transform:none}}
.tooltrip{--dip:0px;animation:tooltrip var(--dur,3s) ease-in-out both}
/* Air pulled through the cake while the vacuum is held: short dashes drawn down into the paper. */
@keyframes airpull{0%{opacity:0;transform:translateY(-9px)}30%{opacity:.85}100%{opacity:0;transform:translateY(15px)}}
.airpull{animation:airpull .9s linear infinite}
/* A drop leaving a dropper: it falls the air gap from the tip to the filtrate and is clipped off at the liquid's
   surface, so it is swallowed by the filtrate instead of being drawn over it. --fall is that gap. */
@keyframes dropfall{0%{transform:translateY(0);opacity:0}12%{opacity:.95}100%{transform:translateY(var(--fall,120px));opacity:.95}}
.dropfall{animation:dropfall .55s cubic-bezier(.4,0,.9,.6) both}
/* Stirring: the rod rocks about the beaker's mouth while the mixture under it turns. */
@keyframes stir{0%,100%{transform:rotate(0deg)}25%{transform:rotate(11deg)}75%{transform:rotate(-11deg)}}
.stirring{transform-box:view-box;transform-origin:var(--sx) var(--sy);animation:stir 1.6s ease-in-out}
@keyframes stirswirl{0%{opacity:0;transform:rotate(0deg)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:rotate(200deg)}}
.stirswirl{transform-box:fill-box;transform-origin:center;animation:stirswirl 1.6s ease-in-out forwards}
/* Swirling a flask by hand: it lifts clear of the bench, rocks ±8° about its own middle three times, and is set
   back down on the same spot. The origin is the flask's centre, so it turns on the spot rather than swinging from
   the bench like a pendulum. Three full oscillations, ending level. */
@keyframes swirlflask{
  0%{transform:none}
  10%{transform:translateY(-12px)}
  13%{transform:translateY(-12px) rotate(8deg)}
  25%{transform:translateY(-12px) rotate(-8deg)}
  38%{transform:translateY(-12px) rotate(8deg)}
  50%{transform:translateY(-12px) rotate(-8deg)}
  62%{transform:translateY(-12px) rotate(8deg)}
  75%{transform:translateY(-12px) rotate(-8deg)}
  87%{transform:translateY(-12px) rotate(8deg)}
  100%{transform:none}
}
.swirlflask{transform-box:fill-box;transform-origin:center;animation:swirlflask 1.6s ease-in-out}
/* Reduced motion governs everything on the bench, not just the pours: bubbles, steam, swirl rings, the
   hot-plate glow and drifting drops all stop, along with the grains and the carried flask.
   html.reduce-motion is set by unticking the "Play animations" box in the top bar; the bench plays by default.
   Elements whose animation carries their meaning keep a still version instead. */
html.reduce-motion #scene *{animation:none !important}
html.reduce-motion .grain{opacity:0}                                     /* falling grains: pure motion */
/* The spatula stays as the source cue: the heap and the readout show the result, but the tool is what ties the new
   powder to the bowl, and it is the bench's only acknowledgement of a sprinkle. With the grains hidden it would
   hang one grain fall (64 units) of empty air above the rim, so the still sets it down on the mouth instead. */
html.reduce-motion .sprinkle{transform:translateY(58px)}
html.reduce-motion .pourstream{clip-path:inset(0 0 var(--pourcut) 0)}   /* stream held at the water line */
/* No carrying: the flask is simply shown already tipped over the beaker, with the stream held still. */
html.reduce-motion .mixcarry{transform:translate(0,calc(var(--lift)*-1)) rotate(104deg)}
html.reduce-motion .mixbenchhush{opacity:0}
/* A carried tool is one still: held tipped over the vessel it is going into, its stream held at the liquid it is
   running into. The bowl keeps a pool, and the pipet is shown over the funnel rather than in the ice bath. */
html.reduce-motion .carry{transform:none}
html.reduce-motion .tipopen{transform:rotate(var(--tipdeg,-150deg))}
html.reduce-motion .labellevel{transform:rotate(calc(-1 * var(--tipdeg,0deg)))}
html.reduce-motion .drainfill{transform:scaleY(var(--fillfrom))}
html.reduce-motion .bowlpass{transform:scaleY(.55)}
html.reduce-motion .tooltrip{transform:translate(var(--wx),var(--wy))}
/* The five drops are one still: spread down the gap between the tip and the filtrate, as if caught in flight. */
html.reduce-motion .dropfall{transform:translateY(calc(var(--fall,120px) * var(--at,.4)))}
/* The stir is one still: the rod is held at the peak of its swing (the 25% keyframe) and the swirl ring stays at
   the liquid surface, turned a little between dashes, so the frame reads as mid-stir instead of a rod at rest. */
html.reduce-motion .stirring{transform:rotate(11deg)}
html.reduce-motion .stirswirl{opacity:1;stroke-dashoffset:7px;stroke-opacity:.8}
/* The looping highlights carry their state in their colour, not their brightness. Without the loop they would sit
   at 1.0 — brighter than their own peak (glowp .85, poul .95) — so they are held near the middle of the range.
   The swirl arc is a group with its own .55 and is left alone. */
html.reduce-motion .hglow{opacity:.6}
html.reduce-motion .pulse:not(g){opacity:.65}
.animtoggle{
  height:40px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;
  color:inherit;cursor:pointer;white-space:nowrap;user-select:none;
}
.animtoggle:hover{border-color:#3f6d9a}
/* Below ~1140px the seven controls and a readable title cannot share one row, so the brand keeps a row of its own
   and the controls wrap under it. The tighter padding/font keeps those five on a single row down to 601px. */
@media (min-width:601px) and (max-width:1140px){
  .topbar{flex-wrap:wrap;gap:8px}
  .brand{flex:1 1 100%}
  .iconbtn{flex:0 1 auto;padding:0 10px;font-size:12px}
  .animtoggle{flex:0 1 auto;padding:0 10px;font-size:12px}
}
.motionnote{margin:10px 0 0}
.animtoggle input{width:15px;height:15px;accent-color:#3aa0ff;cursor:pointer;margin:0}

/* ==========================================================================
   Theme: dark is the bench's own look; html[data-theme="light"] swaps the variables, the SVG bench
   palette and the few colours that were written out in full. The choice is kept in localStorage.
   ========================================================================== */
:root{
  --warn:#fbbf24; --warnink:#ffb066;
  --scene-bg:#0a1422; --scrim:rgba(3,7,15,.66); --thumb-edge:#06121f;
  --tag-ink:color-mix(in srgb,var(--accent) 85%,#fff);
  /* the calculator widget's names, pointed at this page's own palette */
  --panel:var(--card); --panel2:var(--card2); --ink:var(--txt);
  --amber:#ff9a3c; --amber-ink:#1b0a00; --teal:var(--accent); --teal-ink:var(--accent-ink);
}
html[data-theme="light"]{
  --bg:#edf2f9; --card:#ffffff; --card2:#f3f6fb; --line:#cbd6e6;
  --txt:#0f1d33; --muted:#53678a; --accent:#0a6fc2; --accent-ink:#ffffff;
  --good:#0b8a5f; --bad:#c81e45; --gold:#9a5d06; --heat:#e8741a; --warn:#b7791f; --warnink:#a85206;
  --shadow:0 10px 26px rgba(28,52,92,.14);
  --scene-bg:#e3eaf3; --scrim:rgba(20,34,58,.45); --thumb-edge:#ffffff; --tag-ink:var(--accent);
  --amber:#b9560a; --amber-ink:#ffffff;
  color-scheme:light;
}
html[data-theme="light"] .pill.done b{color:#fff}
html[data-theme="light"] input[type=range]::-webkit-slider-thumb{background:radial-gradient(circle at 35% 30%,#fff,var(--accent));box-shadow:0 1px 5px rgba(20,40,80,.35)}
html[data-theme="light"] .animtoggle:hover{border-color:var(--accent)}

/* top-bar launchers: the theme switch and the calculator are icons, so they stay square when the bar wraps */
.iconbtn.sq{padding:0;width:40px;flex:0 0 40px;justify-content:center}
.iconbtn.sq svg{width:20px;height:20px}
.iconbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
@media (max-width:1140px){ .iconbtn.sq{flex:0 0 40px;padding:0} }

/* ---------- calculator (the standard draggable widget; this page opens it from the top bar) ---------- */
.calc{
  position:fixed; z-index:55; right:12px; top:calc(72px + env(safe-area-inset-top, 0px)); width:min(330px, calc(100vw - 24px));
  background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); user-select:none; -webkit-user-select:none; overflow:hidden;
}
.calc-head{ display:flex; align-items:center; justify-content:space-between; padding:6px 6px 6px 12px; background:var(--panel2); cursor:grab; touch-action:none; font-size:12.5px; color:var(--muted); }
.calc-head:active{ cursor:grabbing; }
.calc-head .grip{ display:flex; gap:8px; align-items:center; }
.calc-head .dots{ letter-spacing:2px; }
.calc-head button{ width:38px; height:38px; border:0; background:transparent; border-radius:8px; font-size:20px; line-height:1; }
.disp{ padding:10px 14px 6px; text-align:right; min-height:92px; display:flex; flex-direction:column; justify-content:flex-end; }
.disp .expr{ font-size:15px; color:var(--muted); min-height:22px; overflow-x:auto; white-space:nowrap; direction:rtl; text-align:left; }
.disp .expr span{ direction:ltr; unicode-bidi:plaintext; }
.disp .res{ font-size:30px; font-weight:600; overflow-x:auto; white-space:nowrap; line-height:1.25; }
.disp .res.err{ color:var(--bad); font-size:18px; }
.disp .meta{ font-size:11.5px; color:var(--muted); display:flex; justify-content:space-between; }
.keys{ display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; padding:8px 10px 10px; }
.keys button{
  min-height:46px; border-radius:10px; border:1px solid var(--line); background:var(--panel2); font-size:16px; padding:0; touch-action:manipulation;
}
.keys button:active{ transform:translateY(1px); filter:brightness(1.15); }
.keys .fn{ font-size:13.5px; color:var(--teal); }
.keys .op{ color:var(--amber); font-weight:600; }
.keys .eq{ background:var(--amber); color:var(--amber-ink); border-color:var(--amber); font-weight:700; }
.keys .clr{ color:var(--bad); }
.keys .on{ background:var(--teal); color:var(--teal-ink); border-color:var(--teal); }
.calc-foot{ padding:0 10px 10px; }
.calc-foot .btn{ width:100%; min-height:42px; font-size:13.5px; }

<script>
/* Set to true only in the instructor copy. sync-lab.sh flips exactly this line to build
   limiting-reagent-instructor.html; nothing else in the two files differs. */
const INSTRUCTOR = false;
/* Set to true only in the data-record edition (limiting-reagent-lite.html), which records what
   the bench measures and observes and calculates nothing; sync-lab.sh flips it. */
const LITE = true;

/* ==========================================================================
   Limiting Reagent Lab — Limiting reagent & percent yield
   3 Ca(NO3)2 + 2 Na3PO4 -> Ca3(PO4)2 (s) + 6 NaNO3
   Reagents are the hydrates weighed in lab:
     Ca(NO3)2.4H2O  M = 236.15 g/mol
     Na3PO4.12H2O   M = 380.12 g/mol
     Ca3(PO4)2      M = 310.18 g/mol
   ========================================================================== */

const $ = s => document.querySelector(s);
let _uid = 0;
const uid = () => 'g' + (++_uid);
let sprinkleAt = -1e9;   /* when solid last went into the bowl, for the tipping animation */
let sprinkleTimer = 0;   /* takes the spatula away again once the last addition is done */
const pourAt = { ca: -1e9, na: -1e9 };   /* when water was last poured into each flask */
const dropAt = { a: -1e9, b: -1e9 };     /* when each filtrate portion was last dosed from its dropper */
const mixPourAt = { ca: -1e9, na: -1e9 };   /* when each solution was last emptied into the beaker */
const MIX_POUR_MS = 2600;        /* lift, carry over, pour, carry back — the whole mix-bench animation */
const MIX_STREAM_DELAY = 0.83;   /* the stream starts once the flask has arrived over the beaker */
const MIX_LIFT = 40, MIX_LIFT_UP = 70;   /* how high the flask rides over the rim, and while in transit */
let stirAt = -1e9;                       /* when the rod was last stirred */
const swirlAt = { ca: -1e9, na: -1e9 };  /* when each flask was last swirled on the dissolving bench */
let topupAt = -1e9;                      /* when the digest beaker was last replenished */
let topupLvlFrom = 0;                    /* the beaker level before that replenish, so the fill climbs from it */
let pourMixAt = -1e9;                    /* when the mixture was last poured into the funnel */
let rinseBeakerAt = -1e9;                /* when the beaker was last rinsed into the funnel */
let washAt = -1e9;                       /* when the precipitate was last washed */
let wetAt = -1e9;                        /* when the filter paper was last wetted */
let dishAt = -1e9;                       /* when the dish was last carried to the balance */
let washFromBottle = false;              /* whether the wash in progress was poured from the wash bottle */
let vacDryLeft = 0;                      /* lab minutes still to run on the pump hold, 0 when it is not running */
let pumpStall = 0;                       /* ms of this filtration step the pump has spent switched off */
let pumpOffAt = 0;                       /* when it went off, 0 while it is running */
const STIR_MS = 1600;
const SPRINKLE_MS = 700;      /* the spatula tips solid into the bowl for this long */
const WATER_POUR_MS = 1500;   /* the jug slides in and empties a 50 mL portion into the flask */
const JUG_IN_S = 0.25;        /* .juglift: the water only runs once the jug is over the neck */
const TOPUP_MS = 2600;        /* the bottle is carried over, tipped, squirts, and set back down */
const TOPUP_STREAM_S = 0.78;  /* when the water starts running, once the bottle has arrived and tipped */
/* When each filtration pour actually starts running, in seconds from the click: the vessel has arrived and is tipped
   by then. The funnel bowl's clock and the stream itself both read these, so the two cannot drift apart. */
const POUR_STREAM_S = 0.9, RINSE_STREAM_S = 2.8, WASH_STREAM_S = 1.45;
const BOWL_MS = 1200;         /* the bowl fills as the water arrives, holds, then the vacuum pulls it through */
const VACDRY_MIN = 2;         /* the sheet's hold on the pump, in lab minutes */
const VAC_TICK = 200;         /* ms a tenth of a minute, so the 2 min hold plays over 4 s */
const POUR_MIX_MS = 3000;     /* the beaker carried to the funnel, emptied through it, and brought back */
const RINSE_FILL_MS = 2200;   /* the wash bottle filling the beaker before it is carried over */
const RINSE_BEAKER_MS = 4200; /* that fill, then the beaker's own rinse into the funnel */
const WASH_MS = 3000;         /* the pipet dipping into the ice bath, crossing to the funnel and squirting */
const WET_MS = 2600;          /* the bottle crossing to the funnel, squirting onto the paper, and coming back */
const WET_STREAM_S = WET_MS / 1000 * 0.46;   /* .tooltrip reaches the funnel 46% of the way through its clock */
const WET_SQUIRT_S = 0.6;     /* how long it runs: enough to seat the paper, not half a wash portion */
const WET_LAND_S = WET_STREAM_S + WET_SQUIRT_S;   /* the paper turns wet as the last of it lands */
const DROPS_MS = 1300;        /* five drops, the last of them landing 1.27 s after the click that released them */
let rinseQueue = [];                     /* rinse portions, the one on the bench and any queued behind it */
const DISH_MS = 2600;        /* dish carried to the balance, held on the pan while it reads, and set back down */
const DISH_LAND = 0.3;       /* where in that carry the dish is set down: .carry's own 30% keyframe */
const RINSE_SPRAY = 900;                 /* ms the bottle spends over the flask before it is taken away */
const RINSE_MS = RINSE_SPRAY + MIX_POUR_MS;   /* the spray, then the flask carried over and tipped */
const RINSE_S = RINSE_SPRAY / 1000;      /* the same wait, for the animation-delay on the scene nodes */
const RINSE_LVL = 0.028;                 /* beaker level one rinse portion adds */
const RINSE_SPLASH = 0.08;               /* the washings left in the flask */
/* Seconds played since a click, to two places. Every bench animation is timed from the click that started it,
   and any click re-renders the scene, so a node is handed minus this value as its animation-delay: a re-render
   then picks the animation up where it was instead of starting it over. */
const since = t => Math.round((performance.now() - t) / 10) / 100;
/* The funnel's clock only runs while the pump does: time the vacuum spent off is taken back out, so a bowl left
   without suction holds the level it reached instead of draining on its own. */
const pumpSince = t => since(t) - pumpStall / 1000 - (pumpOffAt ? (performance.now() - pumpOffAt) / 1000 : 0);
/* The bench loops — bubbles, steam, the hot-plate glow, drips and the highlight on an active vessel — run for as
   long as the state that shows them lasts, so they have no start worth keeping. Their delay is the phase taken
   from page uptime, so a repaint keeps them cycling instead of snapping back to the first frame; `offset` staggers
   nodes that share a loop. */
const loopPhase = (offset = 0) => (offset - since(0)).toFixed(2);   /* the same phase, for nodes that set more than a delay */
const loop = (offset = 0) => ` style="animation-delay:${loopPhase(offset)}s"`;
/* The rinse portion that owns the bench at `t`, and the moment the last queued one finishes. Each portion holds
   the bench for RINSE_MS from its own start, so a second one waits its turn instead of replacing the first. */
const rinsePlaying = t => rinseQueue.find(r => t < r.at + RINSE_MS) || null;
const rinseEndsAt = () => (rinseQueue.length ? rinseQueue.at(-1).at + RINSE_MS : -1e9);

/* A carried flask, its stream and the wash bottle are transient scene nodes, so the scene is repainted once
   more when the action that put them there is over — a little after, so the window has closed. Every bench node
   resumes where it was (see `since`), so this repaint cannot cut a second action short. The weigh step repaints
   only the scene: rebuilding the panel would replace the mass slider and end a drag of it. */
const repaintAfter = (wait, repaint = render) => setTimeout(repaint, wait + 120);

/* The bench plays by default: the system's reduced-motion preference is not consulted, so the "Play animations"
   box in the top bar is the only thing that stops it. The switch is a class on <html>, so the reduced-motion
   rules stay plain CSS rather than a media query. */
const MOTION_KEY = 'experiment-simulation.motion';
let animOn = true;   /* the reader's choice, remembered across visits */
try { if (localStorage.getItem(MOTION_KEY) === 'off') animOn = false; } catch (e) {}
/* Carried by every step whose bench feedback is animated, so the switch is explained where the action is. */
const motionReduced = () => document.documentElement.classList.contains('reduce-motion');
const motionNote = () => motionReduced()
  ? `<p class="small motionnote">Motion is off — the bench shows the result without animating it. Tick <b>Play animations</b> in the top bar to watch.</p>`
  : '';
function applyMotion() {
  const reduce = !animOn;
  document.documentElement.classList.toggle('reduce-motion', reduce);
  const box = $('#chkAnim');
  if (box) box.checked = !reduce;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function sci(x, d = 3) {
  if (!isFinite(x)) return '—';
  if (x === 0) return '0';
  const e = Math.floor(Math.log10(Math.abs(x)));
  const m = x / Math.pow(10, e);
  const sup = String(e).split('').map(c => SUP[c] || c).join('');
  return `${m.toFixed(d)} × 10${sup}`;
}
/* Yield model: recovery = 100 % minus the product this run lost, plus any extra mass it kept. */
const LOSS_HANDLING = 4;   /* % left behind in pouring and washing when the beaker is rinsed out */
const LOSS_TRANSFER = 5;   /* % left on the glassware and filter paper */
const LOSS_FINES = 20;     /* % lost at most when the digest is skipped entirely */
const LOSS_SPLATTER = 4;   /* % thrown out by a vigorous boil */
const LOSS_BAKED = 4;      /* % baked onto the beaker wall below VOL_MIN */
const LOSS_REFILTER = 1.5; /* % lost in each extra filtration */
const GAIN_NANO3 = 2;      /* % extra mass per missing wash, from NaNO₃ in the solid */
const GAIN_CHAR = 2.5;     /* % extra mass of soot left by a charred filter paper */
const LOSS_BEAKER = 2;     /* % of product left in a beaker that is never rinsed into the funnel */
const LOSS_WARM = 3;       /* % dissolved off the cake by washing with warm water */
const SCATTER = 3;         /* ± % ordinary run-to-run variation */
const CLEAN_FLOOR = 100 - LOSS_HANDLING - LOSS_TRANSFER - SCATTER;
const CLEAN_TOP = CLEAN_FLOOR + 2 * SCATTER;
const M = { ca: 236.15, na: 380.12, prod: 310.18, nano3: 84.99 };
const HYDRATE = { ca: 'Ca(NO₃)₂·4H₂O', na: 'Na₃PO₄·12H₂O' };
const MASS_MIN = 0.900, MASS_MAX = 1.100, DRAFT_MAX = 1.200;
const DISH_FULL = 0.500; /* g of precipitate that fills the dish drawing */
const DIGEST_MIN = 15;  /* minutes of gentle boiling on the hot plate */
/* The 250-mL beaker's drawn size, shared by every bench that shows one — the reaction beaker, that beaker on the hot
   plate, the one carried to the funnel and the D.I. water beaker — so the four read as the same vessel. A Griffin
   beaker is 70 mm across and 95 mm tall, so its width is 0.74 of its height: the height is what the four benches
   agree on and the width follows from it, because a wider one reads as a jar rather than as a beaker. */
const BEAKER_250_W = 124, BEAKER_250_H = 168;
const VOL_MIN = 50;     /* mL of solution that must stay in the beaker */
const WASH_MIN = 2;     /* portions of cold water drawn through the cake */
const RINSE_MIN = 2;    /* rinse portions per flask before mixing */
const DRY_MIN = 8;      /* minutes over the burner to constant mass */
const CHAR_MIN = DRY_MIN + 4; /* minutes over the burner before the paper chars */
const WEIGH_TOL = 0.003;      /* g — two readings this close mean constant mass */
const READ_NOISE = 0.001;     /* g — the balance flickers in its last digit */
const CHAR_DRIFT = 0.008;     /* g — soot a charred paper keeps adding per reweigh, so it never settles */
const REDRY_MIN = 1;          /* minutes of heating needed between weighings */
const times = n => n === 1 ? 'once' : n === 2 ? 'twice' : `${n} times`;
/* The two weighings side by side — '—' until the mass is constant. */
/* Hand-in details live outside S so restarting the experiment does not wipe them, and are remembered
   between visits so they are typed once. NEEDED is the one list of what identifies the sheet: it is
   what storage keeps, what the export asks for, and what "clear my details" wipes. The date is not
   kept — a sheet is dated when it is made. */
const STUDENT_KEY = 'experiment-simulation.student';
const OLD_STUDENT_KEY = 'exp104.student';   /* where earlier builds kept the same details */
const NEEDED = ['name', 'course', 'section'];
const STUDENT = { name: '', course: '', section: '', date: new Date().toLocaleDateString('en-CA') };
try {
  const raw = localStorage.getItem(STUDENT_KEY) || localStorage.getItem(OLD_STUDENT_KEY);
  const saved = JSON.parse(raw) || {};
  NEEDED.forEach(k => { if (typeof saved[k] === 'string') STUDENT[k] = saved[k]; });
  // details stored by an earlier build move over instead of being asked for again
  if (raw && !localStorage.getItem(STUDENT_KEY)) { saveStudent(); localStorage.removeItem(OLD_STUDENT_KEY); }
} catch { /* unreadable storage: start with blank details */ }
function saveStudent() {
  try {
    localStorage.setItem(STUDENT_KEY, JSON.stringify(Object.fromEntries(NEEDED.map(k => [k, STUDENT[k]]))));
  } catch { /* storage can be unavailable; the sheet still works for this visit */ }
}
const escAttr = v => String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
/* Last post-lab check, captured so the hand-in sheet carries the answers and the score. */
let POSTLAB = null;
/* Paper left past CHAR_MIN chars, and the carbon it leaves is a fault of the run: the mass never
   settles, the soot is weighed, and the post-lab asks about it. */
const paperCharred = () => S.paperIn && S.dryTime > CHAR_MIN;
/* A portion is dosed once its last drop has landed. The bench, the panel, the bench summary and the step gate all
   read this one answer, so none of them reports a verdict while the drops are still in the air. */
const dosed = k => !!(k === 'a' ? S.dropsA : S.dropsB) && since(dropAt[k]) >= DROPS_MS / 1000;
/* When a flask's 50 mL counts as arrived: one jug-slide after the press, or at once when motion is off, since the
   pour is then one still of the finished transfer and there is nothing left to wait for. The caption, the log line,
   the beaker level, the panel, the bench summary and the gate all read this one clock, so none of them can run
   ahead of the bench. */
const landedS = () => motionReduced() ? 0 : JUG_IN_S;
const waterArrived = k => !!(k === 'ca' ? S.waterCA : S.waterNA) && since(pourAt[k]) >= landedS();
/* The 50 mL is reported at the moment the bench shows it arriving, not when the button was pressed: the log line is
   written and the panel repainted then. It waits on the same clock as `waterArrived`, a hair past it, so the panel
   it draws cannot still say the flask is dry. The stamp guards a restart or a fresh pour in between. */
function waterLands(k, at) {
  setTimeout(() => {
    if (pourAt[k] !== at) return;
    log('Added 50 mL D.I. water and washed the crystals into the flask.');
    render();
  }, landedS() * 1000 + 20);
}
/* The paper is wet only once the squirt has landed: the funnel's paper, the panel's tick, the bench summary and the
   gate all read S.paperWet, so none of them can report it while the water is still in the air. With motion off there
   is no squirt to wait for. */
function wetLands(at) {
  setTimeout(() => {
    if (wetAt !== at) return;
    S.paperWet = true;
    log('Wet the filter paper so it seats on the funnel.');
    render();
  }, motionReduced() ? 0 : WET_LAND_S * 1000);
}
const constMass = () => S.weighDelta == null ? '—'
  : `${S.weigh1.toFixed(3)} g then ${S.finalWeigh.toFixed(3)} g — ${S.weighDelta.toFixed(3)} g apart`;
const BENCH_RULES = `Requirements: digest ${DIGEST_MIN} min, keep the volume above ${VOL_MIN} mL, rinse the beaker into the funnel, wash the precipitate ${times(WASH_MIN)} with cold water, dry ${DRY_MIN}–${CHAR_MIN} min, then reweigh after reheating until two readings agree within ${WEIGH_TOL} g.`;
/* 0–1 share of a full-size solid drawing for `g` grams; `full` = grams that fill it. */
const solidFrac = (g, full = DISH_FULL) => clamp(g / full, 0, 1);
const inBand = m => m >= MASS_MIN && m <= MASS_MAX;
/* Half the heap fills on the way to the minimum, half across the accepted band. */
const heapFrac = m => 0.5 * solidFrac(m, MASS_MIN)
  + 0.5 * solidFrac(m - MASS_MIN, MASS_MAX - MASS_MIN);

/* ---------- stoichiometry ---------- */
function stoich(caMass, naMass) {
  const nCa = caMass / M.ca;
  const nNa = naMass / M.na;
  const pCa = nCa / 3;          // mol Ca3(PO4)2 if the calcium salt runs out
  const pNa = nNa / 2;          // mol Ca3(PO4)2 if the phosphate runs out
  const lim = pCa <= pNa ? 'ca' : 'na';
  const nProd = Math.min(pCa, pNa);
  const theoretical = nProd * M.prod;
  const caUsed = nProd * 3 * M.ca;
  const naUsed = nProd * 2 * M.na;
  return {
    nCa, nNa, pCa, pNa, lim, nProd, theoretical,
    caLeft: caMass - caUsed, naLeft: naMass - naUsed,
    nNaNO3: nProd * 6,
    caFrac: (caMass - caUsed) / caMass,
    naFrac: (naMass - naUsed) / naMass
  };
}

/* ---------- experiment state ---------- */
/* Both the boot state and restart() come from here, so the two can't drift apart. */
function defaults() {
  return {
    step: 0,
    draft: { ca: 0, na: 0 },
    weighed: { ca: null, na: null },
    waterCA: false, waterNA: false, swirlCA: false, swirlNA: false,
    pouredCA: false, pouredNA: false, rinses: 0, stirred: false,
    heat: 'off', boilTime: 0, vol: 105, minVol: null, lowVol: false, vigorous: false,

function bg() {

  <rect x="0" y="0" width="960" height="${BENCH}" fill="url(#tiles)"/>

  <rect class="s-edge" x="0" y="${BENCH}" width="960" height="2.5" fill="#4a6482"/>
  <rect class="s-bshade" x="0" y="${BENCH + 2}" width="960" height="16" fill="#0d1726" opacity=".5"/>
  <rect class="s-lipline" x="0" y="611" width="960" height="1.4" fill="#38506f"/>
  <rect class="s-lip" x="0" y="612.4" width="960" height="8" fill="#0a1220"/>`;
}
/* A contact shadow: dark under the glass, melting away to the sides, so a vessel stands on the bench instead of
   hovering over a flat ellipse. */
const shadow = (x, y, rx, ry = 8) =>
  `<ellipse class="shd" cx="${x}" cy="${y + 5}" rx="${(rx * 1.1).toFixed(1)}" ry="${ry + 1.5}" fill="url(#shadowg)"/>`;
/* One baseline for every bench caption. They had drifted four units apart between benches, which read as the line
   hopping as you stepped through the rail, so the height is baked into `cap`: there is no y to pass and get wrong. */
const CAP_Y = BENCH + 58;
const cap = (x, t) =>
  `<text class="cap" x="${x}" y="${CAP_Y}" text-anchor="middle" font-size="12.5" font-weight="650" fill="#8ea2c6">${t}</text>`;

/* What makes drawn glass read as glass: light travelling along the wall, and the way a liquid pulls up where
   it meets it. Both are clipped to the vessel, so the caller only gives the wall's box. */
const glassSheen = (id, x, yTop, yBottom, half) =>
  `<rect x="${x - half}" y="${yTop}" width="${half * 2}" height="${Math.max(4, yBottom - yTop)}" fill="url(#sheen)" clip-path="url(#${id})"/>`
  + `<path d="M${x + half - 7} ${yTop + 10} L${x + half - 7} ${yBottom - 12}" stroke="#fff" stroke-opacity=".24" stroke-width="2.4" stroke-linecap="round" clip-path="url(#${id})"/>`;
/* A meniscus: the liquid climbs the wall, so the surface is a shallow dish, not a straight edge. */
const meniscus = (id, x, y, half) =>
  `<ellipse cx="${x}" cy="${y}" rx="${half}" ry="3" fill="#2b6f9e" fill-opacity=".26" clip-path="url(#${id})"/>`
  + `<path d="M${x - half} ${y - .4} Q${x} ${y + 4.2} ${x + half} ${y - .4}" fill="none" stroke="#e6f6ff" stroke-opacity=".6" stroke-width="1.5" clip-path="url(#${id})"/>`;
/* The mouth of a vessel is a rolled lip around an opening — a dark bore, a thick bead of glass, a bright rim, the
   inner edge below it, and the glint where the bead catches the light at the front. */
const vesselLip = (x, y, rx, ry) => {
  const p = (t) => `${(x + rx * Math.cos(t)).toFixed(1)} ${(y + ry * Math.sin(t)).toFixed(1)}`;
  return `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="#0b1624" fill-opacity=".55"/>
  <ellipse cx="${x}" cy="${y}" rx="${rx + 1}" ry="${ry + 0.6}" fill="none" stroke="#e9f6ff" stroke-opacity=".34" stroke-width="4.2"/>
  <ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="none" stroke="#e9f6ff" stroke-opacity=".85" stroke-width="2.2"/>
  <ellipse cx="${x}" cy="${y + 1.6}" rx="${rx - 3.2}" ry="${ry * 0.55}" fill="none" stroke="#9dc3e0" stroke-opacity=".5" stroke-width="1.2"/>
  <path d="M${p(2.5)} A${rx} ${ry} 0 0 0 ${p(1.9)}" fill="none" stroke="#fff" stroke-opacity=".95" stroke-width="1.6" stroke-linecap="round"/>`;
};
/* Glass has thickness: the wall is darker where light has to cross it (a band just inside the outline) and bright
   at the very edge. Both bands are strokes of the vessel's own outline, clipped to it, so they follow any shape. */
const glassWall = (d, id) =>
  `<path d="${d}" fill="none" stroke="#04263f" stroke-opacity=".16" stroke-width="12" clip-path="url(#${id})"/>`
  + `<path d="${d}" fill="none" stroke="#ffffff" stroke-opacity=".20" stroke-width="3.6" clip-path="url(#${id})"/>`;
/* The shading that makes a liquid read as a volume: its sides, seen through curved glass, are darker than its middle. */
const liquidBody = (x, w, top, bottom, id) =>
  `<rect x="${x - w}" y="${top}" width="${w * 2}" height="${Math.max(2, bottom - top)}" fill="url(#liqedge)" clip-path="url(#${id})"/>`;
/* A flat printed scale, as on a beaker: long and short bars in white enamel. */
const enamelScale = (x0, x1, yTop, yBot, n, op = 0.62, ink = '#f1f8ff') => {
  let s = '';
  for (let i = 0; i <= n; i++) {
    const gy = yTop + (yBot - yTop) * i / n, long = i % 2 === 0;
    s += `<line x1="${x1 - (long ? (x1 - x0) : (x1 - x0) * 0.55)}" y1="${gy.toFixed(1)}" x2="${x1}" y2="${gy.toFixed(1)}" stroke="${ink}" stroke-opacity="${op}" stroke-width="${long ? 1.7 : 1.4}" stroke-linecap="round"/>`;
  }
  return s;
};


/* ---------- flask ---------- */
/* Where the liquid surface sits inside a flask: the one place that geometry is defined, so a
   pour stream can end on the water line instead of guessing at it. */
const FLASK_H = 178, FLASK_FILL_SPAN = 0.94;
const flaskSurface = (y, level, h = FLASK_H) => y - h * clamp(level, 0, 1) * FLASK_FILL_SPAN;

function flask(x, y, o = {}) {
  const h = o.h || FLASK_H, nw = o.nw || 16, bw = o.bw || 50;
  const id = uid();
  const body = `M${x-nw} ${y-h} L${x+nw} ${y-h} L${x+nw} ${y-h*0.54} L${x+bw} ${y-13} Q${x+bw} ${y} ${x+bw-13} ${y} L${x-bw+13} ${y} Q${x-bw} ${y} ${x-bw} ${y-13} L${x-nw} ${y-h*0.54} Z`;
  const lvl = clamp(o.level || 0, 0, 1);
  const top = flaskSurface(y, lvl, h);
  let s = o.sh ? shadow(x, y, bw, 7) : '';
  s += `<g transform="${o.rot ? `rotate(${o.rot} ${x} ${y})` : ''}">`;
  s += `<clipPath id="${id}"><path d="${body}"/></clipPath>`;
  if (lvl > 0.02) {
    s += `<rect${o.fillAnim ? ` class="pourfill"${o.fillDelay ? ` style="animation-delay:${o.fillDelay}s"` : ''}` : ''} x="${x-bw-8}" y="${top}" width="${(bw+8)*2}" height="${y-top+4}" fill="${o.fill || 'url(#clearliq)'}" opacity="${o.op || 1}" clip-path="url(#${id})"/>`;
    s += liquidBody(x, bw + 8, top, y + 2, id);
  }
  if (o.crystals && lvl > 0.06) {
    const n = Math.round(4 + 6 * o.crystals), band = 8 + 14 * o.crystals;
    for (let i = 0; i < n; i++) {
      const cx = x - 30 + (i * 37) % 60;
      const cy = y - 10 - (i * 13) % band;
      s += `<rect x="${cx}" y="${cy}" width="5.2" height="5.2" rx="1" fill="#eaf6ff" opacity=".8" transform="rotate(${i * 29} ${cx + 2.6} ${cy + 2.6})" clip-path="url(#${id})"/>`;
    }
  } else if (o.crystals) {
    /* Still dry: the weighed sample waits as a heap of crystals on the flask's floor. The pile is the
       grains themselves, stacked in columns that taper towards the edges, so it reads as solid rather
       than as a smooth blob. */
    const pw = 16 + 7 * o.crystals, rows = 3 + Math.round(2 * o.crystals);
    s += `<ellipse cx="${x}" cy="${y-1}" rx="${pw*0.5}" ry="2.6" fill="#000" opacity=".22" clip-path="url(#${id})"/>`;
    for (let col = 0; col < 5; col++) {
      const cx = x - pw / 2 + (pw / 4) * col;
      const stack = Math.max(1, Math.round(rows * (1 - Math.abs(col - 2) / 2.8)));
      for (let r = 0; r < stack; r++) {
        const gx = cx + ((r % 2) ? 1.7 : -1.7) + ((col * 5 + r * 3) % 3) - 1;
        const gy = y - 4 - r * 3.4;
        s += `<rect x="${gx}" y="${gy}" width="4" height="4" rx=".8" fill="${(col + r) % 3 ? '#eaf6ff' : '#bdd6ee'}"
          opacity=".9" transform="rotate(${(col * 23 + r * 41) % 90} ${gx + 2} ${gy + 2})" clip-path="url(#${id})"/>`;
      }
    }
  }
  if (lvl > 0.02) s += meniscus(id, x, top, bw * 0.86);
  s += glassSheen(id, x, y - h + 4, y - 6, bw);
  /* The neck is glass too: without a band down its bore and a bright edge on one wall it reads as a solid
     rod between the body and the lip. */
  s += `<rect x="${x-nw}" y="${y-h+3}" width="${nw*2}" height="${h*0.45}" fill="url(#sheen)" clip-path="url(#${id})"/>`;
  s += `<path d="M${x+nw-1.4} ${y-h+7} L${x+nw-1.4} ${y-h*0.56}" stroke="#dff1ff" stroke-opacity=".35" stroke-width="2" stroke-linecap="round" clip-path="url(#${id})"/>`;
  s += glassWall(body, id);
  s += `<path d="${body}" fill="url(#glassg)" stroke="#a9cbe8" stroke-opacity=".5" stroke-width="2"/>`;
  /* A thick moulded bottom: a lens of glass that catches the light, and a bright arc where it meets the wall. */
  s += `<rect x="${x-bw}" y="${y-11}" width="${bw*2}" height="12" fill="url(#glassbase)" clip-path="url(#${id})"/>`;
  s += `<ellipse cx="${x}" cy="${y-4.5}" rx="${bw-12}" ry="4.6" fill="none" stroke="#cfe6ff" stroke-opacity=".24" stroke-width="1.6" clip-path="url(#${id})"/>`;
  /* The white enamel spot every Erlenmeyer carries for pencil notes, with its rough volume bars. */
  const px = x + 5, py = y - h * 0.4, pw2 = 24, ph2 = 38;
  s += `<rect x="${px}" y="${py}" width="${pw2}" height="${ph2}" rx="3" fill="#f3f8fd" fill-opacity=".78" clip-path="url(#${id})"/>`;
  s += enamelScale(px + 3, px + pw2 - 4, py + 6, py + ph2 - 6, 4, 0.9, '#51657d');
  /* The lip is flared and rolled: a ring a little wider than the neck, under the bore. */
  s += `<rect x="${x-nw-2.6}" y="${y-h-1}" width="${nw*2+5.2}" height="7" rx="3.4" fill="url(#glassg)" stroke="#a9cbe8" stroke-opacity=".55" stroke-width="1.6"/>`;
  s += vesselLip(x, y - h, nw + 1.4, 4.6);
  s += `<path d="M${x-nw+6} ${y-h+15} L${x-nw+6} ${y-h*0.62}" stroke="#fff" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>`;
  s += `<path d="M${x+bw*0.66} ${y-62} L${x+bw*0.8} ${y-24}" stroke="#fff" stroke-opacity=".2" stroke-width="2.6" stroke-linecap="round" clip-path="url(#${id})"/>`;
  s += o.bubbles ? bubbles(x - bw + 20, y, top, (bw - 20) * 2, 20) : '';
  s += `</g>`;
  return s;
}

/* Bubbles in a boiling vessel. Each rises a fraction of the liquid's own depth, so it always breaks before the
   surface: a shallow volume gives short rises, and skips only the bubble that has no room rather than lifting
   any of them into the headspace above the liquid. */
function bubbles(x, floorY, surfaceY, w, n, vig = 0) {
  const depth = floorY - surfaceY;
  /* A hard boil throws bigger bubbles and crosses the vessel quicker, so `vig` scales both: 0 is the gentle boil,
     1 a vigorous one. */
  const grow = 1 + 0.5 * vig, rate = 1 + 0.7 * vig;
  let s = '', k = 0;
  for (let i = 0; i < n; i++) {
    const r = (3 + (i % 3) * 1.4) * grow;   /* the size cycle stays on i, so one skipped bubble doesn't shrink the rest */
    const rise = Math.min(26, (depth - 2 * r - 6) * 0.55);
    if (rise < 3) continue;                 /* no room under this one — the smaller bubbles still go in */
    const band = Math.max(1, depth - rise - 2 * r - 6);   /* how far apart the starting heights spread */
    /* Placed by how many are actually drawn (k): a thin set spreads across the full width instead of inheriting
       the gaps the skipped ones leave, which piled the survivors onto one wall. */
    const cx = x + (k * 37) % w;
    const cy = floorY - r - 3 - (k * 11) % band;
    /* White at .55 composited to ~1.07:1 against the precipitate band and the milky liquid, i.e. invisible. Tinted
       a shade darker than the liquid and drawn a little larger, the bubbles hold ~2–3:1 there without reading as
       anything but bubbles. */
    s += `<circle class="bub" cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="#2f86c4" opacity=".85"
      style="animation-delay:${loopPhase(k * 0.17)}s;--bubrise:${rise.toFixed(1)}px${vig ? `;--bubrate:${rate.toFixed(2)}` : ''}"/>`;
    k++;
  }
  return s;
}

/* ---------- beaker ---------- */
function beakerGeo(y, h, lvl) { return y - 10 - (h - 20) * clamp(lvl, 0, 1); }

function beaker(x, y, o = {}) {
  const w = o.w || 132, h = o.h || 152;
  const id = uid();
  const body = `M${x-w/2} ${y-h} L${x-w/2} ${y-14} Q${x-w/2} ${y} ${x-w/2+14} ${y} L${x+w/2-14} ${y} Q${x+w/2} ${y} ${x+w/2} ${y-14} L${x+w/2} ${y-h}`;
  const lvl = clamp(o.level || 0, 0, 1);
  const top = beakerGeo(y, h, lvl);
  let s = o.sh ? shadow(x, y, w / 2, 7) : '';
  s += `<clipPath id="${id}"><path d="${body}"/></clipPath>`;
  const fillAttrs = o.fillAnim
    ? ` class="pourfill" style="--fillfrom:${clamp(o.fillFrom ?? 0.03, 0, 1).toFixed(3)}${o.fillDelay ? `;animation-delay:${o.fillDelay}s` : ''}"`
    : o.drainAnim
      ? ` class="drainfill" style="--fillfrom:${(o.drainFrom || 1).toFixed(2)}${o.drainDelay ? `;animation-delay:${o.drainDelay}s` : ''}"`
      : '';
  if (lvl > 0.012) {
    s += `<rect ${o.liqId ? `id="${o.liqId}"` : ''}${fillAttrs} x="${x-w/2-2}" y="${top}" width="${w+4}" height="${y-top+2}" fill="${o.fill || 'url(#clearliq)'}" clip-path="url(#${id})"/>`;
  }
  if (o.cloud && lvl > 0.012)
    s += `<rect${fillAttrs} x="${x-w/2-2}" y="${top}" width="${w+4}" height="${y-top+2}" fill="url(#milky)" opacity="${o.cloud}" clip-path="url(#${id})"/>`;
  if (o.sediment && lvl > 0.06) {
    const hs = 3 + 20 * o.sediment;
    s += `<rect x="${x-w/2-2}" y="${y-hs}" width="${w+4}" height="${hs+2}" fill="#e8f3fd" clip-path="url(#${id})"/>`;
    s += `<ellipse cx="${x}" cy="${y-hs}" rx="${w/2-5}" ry="${2+2*o.sediment}" fill="#f9fcff" clip-path="url(#${id})"/>`;
    /* A settled solid is never smooth: a few darker grains in its surface. */
    for (let i = 0; i < 9; i++) s += `<circle cx="${(x - w / 2 + 12 + (i * 29) % (w - 24)).toFixed(1)}" cy="${(y - hs + ((i * 7) % 5) - 1).toFixed(1)}" r="1.1" fill="#b9cde2" opacity=".7" clip-path="url(#${id})"/>`;
  }
  if (o.cubes && lvl > 0.06) {
    /* Ice: translucent blocks with a bevelled face and a bright corner. Some float, standing proud of the water. */
    for (let i = 0; i < 6; i++) {
      const cx = x - w / 2 + 14 + (i * 27) % Math.max(10, w - 38);
      const cy = i % 3 === 0 ? top - 6 + (i % 2) * 3 : top + 14 + (i * 19) % Math.max(10, y - top - 28);
      const rot = -18 + i * 9;
      s += `<g transform="rotate(${rot} ${cx + 11} ${cy + 9})" clip-path="url(#${id})">
        <rect x="${cx}" y="${cy}" width="22" height="18" rx="3.5" fill="url(#ice)" stroke="#bfe8ff" stroke-opacity=".85"/>
        <rect x="${cx + 4}" y="${cy + 4}" width="14" height="10" rx="2.5" fill="#ffffff" fill-opacity=".28"/>
        <path d="M${cx + 3} ${cy + 3} L${cx + 11} ${cy + 3}" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-opacity=".95"/></g>`;
    }
  }
  if (lvl > 0.012) s += liquidBody(x, w / 2 + 2, top, y + 2, id);
  if (o.bubbles) s += bubbles(x - w / 2 + 14, y, top, w - 28, 12, o.boil === 'vigorous' ? 1 : 0);
  if (lvl > 0.012) s += meniscus(id, x, top, w / 2 - 4);
  s += glassSheen(id, x, y - h + 3, y - 5, w / 2);
  s += glassWall(body, id);
  s += `<path d="${body}" fill="url(#glassg)" stroke="#a9cbe8" stroke-opacity=".5" stroke-width="2"/>`;
  /* The base is thick glass: a bright lens along the floor, and its arc where it meets the wall. */
  s += `<rect x="${x-w/2}" y="${y-12}" width="${w}" height="13" fill="url(#glassbase)" clip-path="url(#${id})"/>`;
  s += `<ellipse cx="${x}" cy="${y-4.5}" rx="${w/2-10}" ry="4.4" fill="none" stroke="#cfe6ff" stroke-opacity=".22" stroke-width="1.6" clip-path="url(#${id})"/>`;
  /* The frosted write-on spot, and the printed scale up the front. */
  const pw = Math.max(14, w * 0.2), ph = Math.max(18, w * 0.26), px = x - w / 2 + w * 0.2, py = y - h * 0.62;
  s += `<rect x="${px.toFixed(1)}" y="${py.toFixed(1)}" width="${pw.toFixed(1)}" height="${ph.toFixed(1)}" rx="3" fill="#eef5fb" fill-opacity=".34" stroke="#f1f8ff" stroke-opacity=".4" clip-path="url(#${id})"/>`;
  s += enamelScale(x + w / 2 - 24, x + w / 2 - 5, y - h + 20, y - 24, 6);
  s += vesselLip(x, y - h, w / 2, 6.6);
  /* The pouring lip: the rim is drawn out into a spout on the right, where the glass bends to guide the stream. */
  s += `<path d="M${x+w/2-15} ${y-h+.5} Q${x+w/2-3} ${y-h-1.6} ${x+w/2+5} ${y-h-5} Q${x+w/2+2.4} ${y-h+1} ${x+w/2+1} ${y-h+8}" fill="url(#glassg)" stroke="#cfe6ff" stroke-opacity=".7" stroke-width="2" stroke-linejoin="round"/>`;
  s += `<path d="M${x-w/2+16} ${y-h+22} L${x-w/2+16} ${y-30}" stroke="#fff" stroke-opacity=".16" stroke-width="4" stroke-linecap="round"/>`;
  return s;
}

/* The spatula tipping solid into the bowl: grains start under the blade and fall to the rim. */
/* The spatula tipping solid into the bowl: grains start under the blade and fall to the rim. */
function sprinkleInto(x, y, played = 0) {
  const rimY = y - 32;
  const grains = [[-15, 0], [-8, 0.09], [-1, 0.04], [7, 0.15], [13, 0.21], [-4, 0.27], [5, 0.32], [10, 0.38]]
    .map(([dx, delay], i) => `<circle cx="${x + dx}" cy="${rimY - 52 - (i % 3) * 6}" r="${1.5 + (i % 3) * 0.45}" fill="#ffffff" opacity=".9" class="grain" style="animation-delay:${(delay - played).toFixed(2)}s"/>`)
    .join('');
  return `<g class="sprinkle">
    <g transform="rotate(16 ${x - 16} ${rimY - 80})">
      <path d="M${x-40} ${rimY-80} Q${x-39} ${rimY-85.5} ${x-31} ${rimY-85} L${x+2} ${rimY-84.5} L${x+6} ${rimY-80} L${x+2} ${rimY-76} L${x-31} ${rimY-75.5} Q${x-39} ${rimY-74.5} ${x-40} ${rimY-80} Z" fill="url(#pantop)" stroke="#6f879d" stroke-width="1.2"/>
      <line x1="${x-34}" y1="${rimY-82}" x2="${x-4}" y2="${rimY-82.6}" stroke="#fff" stroke-opacity=".8" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="${x+3}" y="${rimY-83.5}" width="9" height="7" rx="2" fill="#7f95ab" stroke="#4a5d72"/>

      <line x1="${x + 11}" y1="${rimY - 80.8}" x2="${x + 47}" y2="${rimY - 103.4}" stroke="#c4d4e4" stroke-width="3" stroke-linecap="round"/>
    </g>
    ${grains}
  </g>`;
}

/* The five drops a dropper delivers: each falls the air gap from the tip to the filtrate's surface, one behind the
   other, and the group is clipped off at that surface so a drop is swallowed by the liquid instead of sitting on
   top of it. `played` is how much of the run a repaint has already shown, so it resumes rather than restarting. */
function dropsInto(x, tipY, surfaceY, played = 0) {
  const fall = +(surfaceY - tipY).toFixed(1);
  const id = uid();
  const drops = [0, 0.18, 0.36, 0.54, 0.72].map((delay, i) =>
    `<circle class="dropfall" cx="${x}" cy="${tipY + 4}" r="3.2" fill="#eaf6ff"
      style="--fall:${fall}px;--at:${(0.18 + 0.16 * i).toFixed(2)};animation-delay:${(delay - played).toFixed(2)}s"/>`)
    .join('');
  return `<clipPath id="${id}"><rect x="${x - 26}" y="${tipY}" width="52" height="${fall}"/></clipPath>
    <g clip-path="url(#${id})">${drops}</g>`;
}

function weighBowl(x, y, f) {
  const rimY = y - 32;
  const rx = 3 + 35 * f, ry = 1 + 15 * f;
  let heap = '';
  if (f > 0.01) {
    const b = rimY + 1, t = b - ry * 2.05;
    heap = `<path d="M${x-rx} ${b} C${x-rx*.7} ${b-ry*1.7} ${x-rx*.25} ${t} ${x} ${t} C${x+rx*.3} ${t} ${x+rx*.7} ${b-ry*1.6} ${x+rx} ${b} Q${x} ${b+ry*.5} ${x-rx} ${b} Z" fill="#ffffff" opacity=".97"/>`;
    const n = Math.round(6 + 16 * f);
    for (let i = 0; i < n; i++) {
      const gx = x - rx * 0.8 + ((i * 37) % 100) / 100 * rx * 1.6;
      const gy = b - 1 - ((i * 53) % 100) / 100 * ry * 1.5;
      heap += `<circle cx="${gx.toFixed(1)}" cy="${gy.toFixed(1)}" r="${(0.9 + (i % 3) * 0.4).toFixed(1)}" fill="${i % 2 ? '#d3e1ef' : '#b9cde2'}" opacity=".8"/>`;
    }
  }
  return `<g>
    <path d="M${x-42} ${rimY} L${x-31} ${y} L${x+31} ${y} L${x+42} ${rimY} Z" fill="url(#plastic)" opacity=".92" stroke="#c3d7e9" stroke-width="1.5"/>
    <path d="M${x-14} ${rimY+8} L${x-12} ${y-3} M${x} ${rimY+8} L${x} ${y-3} M${x+14} ${rimY+8} L${x+12} ${y-3}" stroke="#8aa3bd" stroke-opacity=".35" stroke-width="1.4"/>
    <path d="M${x-34} ${rimY + 8} L${x-27} ${y - 4}" stroke="#fff" stroke-opacity=".5" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M${x-41} ${rimY-2} L${x-52} ${rimY-6} L${x-43} ${rimY+5} Z" fill="#f2f8ff" stroke="#c3d7e9" stroke-width="1.3" stroke-linejoin="round"/>
    <ellipse cx="${x}" cy="${rimY + 2.4}" rx="39" ry="8" fill="#b9cfe2" opacity=".5"/>
    <ellipse cx="${x}" cy="${rimY}" rx="42" ry="9" fill="#f7fbff" opacity=".9" stroke="#fff" stroke-width="1.6"/>
    ${heap}
  </g>`;
}

     turned by an animated tip passes `tipped` — the clock its tip runs on, which the keyframes mirror — and one held
     at a single fixed angle passes `levelDeg`, turned back about its own centre. */
  const plate = `<rect x="${x-24}" y="${y-78}" width="48" height="34" rx="4" fill="#f4f7fb" stroke="#9fb0c4"/>

    : o.levelDeg ? `<g transform="rotate(${o.levelDeg} ${x} ${y - 61})">${plate}</g>`
