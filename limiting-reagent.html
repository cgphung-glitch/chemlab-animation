function resultsHTML() {
  const T = trial(), st = T.st;
  const pct = S.measuredMass / st.theoretical * 100;
  const limName = HYDRATE[st.lim];
  const excName = HYDRATE[st.lim === 'ca' ? 'na' : 'ca'];
  const excLeft = st.lim === 'ca' ? st.naLeft : st.caLeft;
  const excMol = excLeft / (st.lim === 'ca' ? M.na : M.ca);
  const pctCls = pct > CLEAN_TOP ? 'warn' : (pct < CLEAN_FLOOR ? 'bad' : 'good');
  /* Waterfall: the theoretical yield split into the recovered solid and every named cause. The
     handling row is the remainder, so the printed rows add up to the printed percent yield. */
  const total = Math.round(pct * 10) / 10;
  const wf = T.parts.filter(p => p.key === 'handling' || Math.abs(p.pct) >= 0.05)
    .map(p => ({ ...p, shown: Math.round(p.pct * 10) / 10 }));
  const handling = wf.find(p => p.key === 'handling');
  const fixed = wf.reduce((sum, p) => sum + (p === handling ? 0 : p.shown), 0);
  handling.shown = Math.round((total - 100 - fixed) * 10) / 10;
  const lost = wf.filter(p => p.shown < 0);
  const wfScale = total + lost.reduce((sum, p) => sum + Math.abs(p.shown), 0) || 100;
  const wfW = v => (Math.abs(v) / wfScale * 100).toFixed(2) + '%';
  const signed = v => v > 0 ? `+${v.toFixed(1)} %` : v < 0 ? `−${Math.abs(v).toFixed(1)} %` : '0.0 %';
  const waterfall = `<div class="wf">
    <div class="wbar"><i class="got" style="width:${wfW(total)}"></i>${lost.map(p => `<i class="lost" style="width:${wfW(p.shown)}"></i>`).join('')}</div>
    <div class="wfrow"><span class="wfd none"></span><span>Theoretical yield</span><b>100.0 %</b></div>
    ${wf.map(p => `<div class="wfrow"><span class="wfd ${p.shown > 0 ? 'gain' : ''}"></span><span>${p.label}</span><b>${signed(p.shown)}</b></div>`).join('')}
    <div class="wfrow total"><span class="wfd got"></span><span>Recovered as Ca₃(PO₄)₂</span><b>${total.toFixed(1)} %</b></div>
  </div>`;
  const agree = S.answer !== (st.lim);

  const math = [
    `n(Ca(NO₃)₂·4H₂O) = ${S.weighed.ca.toFixed(3)} g ÷ 236.15 g/mol = ${sci(st.nCa)} mol`,
    `mol Ca₃(PO₄)₂ from Ca²⁺  = ${sci(st.nCa)} ÷ 3 = ${sci(st.pCa)} mol`,
    ``,
    `n(Na₃PO₄·12H₂O)  = ${S.weighed.na.toFixed(3)} g ÷ 380.12 g/mol = ${sci(st.nNa)} mol`,
    `mol Ca₃(PO₄)₂ from PO₄³⁻ = ${sci(st.nNa)} ÷ 2 = ${sci(st.pNa)} mol`,
    ``,
    `<span class="h">smaller amount → limiting reagent = ${limName}</span>`,
    `<span class="h">theoretical yield = ${sci(st.nProd)} mol × 310.18 g/mol = ${st.theoretical.toFixed(3)} g</span>`,
    `excess ${excName} left over = ${excLeft.toFixed(3)} g  (${sci(excMol)} mol)`,
    ``,
    `<span class="g">percent yield = ${S.measuredMass.toFixed(3)} g ÷ ${st.theoretical.toFixed(3)} g × 100% = ${pct.toFixed(1)}%</span>`
  ].join('\n');

  const charred = paperCharred();
  const errors = [];
  if (S.vigorous) errors.push('<b>Vigorous boiling</b> — the mixture splattered and fines were created, so some product was lost and some passed the filter paper.');
  if (S.lowVol) errors.push(`<b>Volume fell below ${VOL_MIN} mL</b> during digestion, leaving product baked onto the beaker wall.`);
  if (S.boilTime < DIGEST_MIN) errors.push(`<b>Digested for only ${S.boilTime.toFixed(1)} min</b> instead of ${DIGEST_MIN} — the crystals stayed small, so fines passed the filter paper and product was lost in the extra filtration.`);
  if (S.refilters > 0) errors.push('<b>The filtrate was cloudy</b> and had to be filtered again; each transfer loses solid.');
  if (S.washCount < WASH_MIN) errors.push(`<b>The precipitate was washed only ${S.washCount} of ${WASH_MIN} times</b>, so soluble NaNO₃ stayed with the solid and inflates the mass.`);
  if (!S.beakerRinsed) errors.push('<b>The beaker was never rinsed into the funnel</b>, so the product stuck to its wall was weighed as a loss rather than recovered.');
  if (S.washWarm) errors.push('<b>The cake was washed with warm water</b>, which dissolves a little Ca₃(PO₄)₂, so some product left in the washings.');
  if (charred) errors.push(`<b>The burner was left on for ${S.dryTime.toFixed(1)} min</b>, past ${CHAR_MIN}, so the filter paper charred: its carbon is weighed with the solid and the dish never settled to constant mass.`);
  if (S.dryTime < DRY_MIN) errors.push(`<b>Dried for only ${S.dryTime.toFixed(1)} of ${DRY_MIN} min</b>, so the weighing still contains water.`);
  if (!errors.length) errors.push('<b>No major procedural errors recorded</b> — the deficit is ordinary transfer loss on the glassware and filter paper.');

  const rows = rowTable(dataRowList({ limiting: false, percent: false }));

  return `<header class="rhead">
    <div class="eyebrow">Limiting Reagent Lab · results</div>
    <h2>${limName} was the limiting reagent</h2>
    <p>${excName} was in excess by ${excLeft.toFixed(3)} g, and the precipitate was Ca₃(PO₄)₂.</p>
  </header>
  <div class="rgrid">
    <div>
      <div class="card">
        <h3><span class="n">1</span> Data table</h3>
        <table class="data">${rows}</table>
        <p class="small" style="margin:8px 0 0">${BENCH_RULES}</p>
      </div>
      <div class="card">
        <h3><span class="n">2</span> Filtrate tests</h3>
        <table class="data">
          <tr><td>Filtrate + Ca(NO₃)₂ drops</td><td>${S.dropsA ? (st.lim === 'ca' ? 'white precipitate' : 'no precipitate') : '—'}</td></tr>
          <tr><td>Filtrate + Na₃PO₄ drops</td><td>${S.dropsB ? (st.lim === 'na' ? 'white precipitate' : 'no precipitate') : '—'}</td></tr>
          <tr class="key"><td>Excess reagent from observation</td><td>${HYDRATE[S.answer] || '—'}</td></tr>
          <tr class="key"><td>Excess reagent from stoichiometry</td><td>${excName}</td></tr>
        </table>
        <p class="note" style="margin-top:10px">${agree
          ? 'Your observation matches the calculation: the precipitate formed only when the reagent that was <i>not</i> in excess was added.'
          : 'Your observation disagrees with the calculation. Adding the missing ion is what precipitates, so the filtrate must have contained the <b>' + excName + '</b>.'}</p>
      </div>
    </div>
    <div>
      <div class="card">
        <h3><span class="n">3</span> Percent yield</h3>
        <div class="yieldbox">
          <div class="big ${pctCls}">${pct.toFixed(1)}%</div>
          <div class="cap">${S.measuredMass.toFixed(3)} g obtained of ${st.theoretical.toFixed(3)} g theoretical</div>
        </div>
        <p class="note" style="margin-top:10px">Percent yield = actual yield ÷ theoretical yield × 100%. Recovery is set by what stayed on the glassware, on the filter paper and in the filtrate — the losses listed under “Where the yield went”.</p>
        ${waterfall}
        ${pct > CLEAN_TOP ? `<p class="note" style="margin-top:6px">A yield above ${CLEAN_TOP}% means the solid weighed more than Ca₃(PO₄)₂ alone — soluble NaNO₃ from a missed wash, or carbon from charred filter paper, stayed with it. The sources under “Where the yield went” say which.</p>` : ''}
      </div>
      <div class="card">
        <h3><span class="n">4</span> Stoichiometry</h3>
        <div class="math">${math}</div>
      </div>
      <div class="card">
        <h3><span class="n">5</span> Where the yield went</h3>
        <ul class="errlist">${errors.map(e => `<li>${e}</li>`).join('')}</ul>
      </div>
    </div>
  </div>
  <div class="rfoot">
    <button class="btn primary" data-ui="restart">Run another trial</button>
    <button class="btn" data-ui="prelab">Pre-lab worksheet</button>
    <button class="btn" data-ui="postlab">Post-lab analysis</button>
    <button class="btn" data-ui="notebook">Open lab notebook</button>
  </div>`;
}

  { t: 'Chemical reaction', d: 'A process in which substances change into new substances by rearrangement, combination, or decomposition.' },
  { t: 'Chemical equation', d: 'A shorthand of formulas and coefficients that shows the mole proportions of a reaction.' },
  { t: 'Reactant', d: 'A starting substance that is consumed when the reaction occurs.' },
  { t: 'Product', d: 'A new substance formed by the reaction.' },
  { t: 'Mole', d: 'The amount of substance containing 6.022 × 10²³ representative particles.' },
  { t: "Avogadro's number", d: '6.022 × 10²³, the number of particles in one mole.' },
  { t: 'Limiting reagent', d: 'The reactant used up first; it stops the reaction and fixes the amount of product.' },
  { t: 'Excess reagent', d: 'A reactant that remains unreacted after the limiting reagent is consumed.' },
  { t: 'Stoichiometry', d: 'The quantitative study of the mass and mole relationships in a reaction.' },
  { t: 'Theoretical yield', d: 'The maximum product mass possible, calculated from the limiting reagent.' },
  { t: 'Actual yield', d: 'The product mass actually collected in the laboratory.' },
  { t: 'Percent yield', d: 'Actual yield divided by theoretical yield, multiplied by 100%.' }
];
let prelabBank = null;

function plShuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}
function buildBank() {
  prelabBank = plShuffle(PRELAB_TERMS.map((x, i) => ({ text: x.d, term: i })));
}
function letterForTerm(i) {
  return PL_LETTERS[prelabBank.findIndex(b => b.term === i)];
}
/* What to say when a field is wrong: guidance, never the answer. Keyed on the field label, so the
   hints live in one place and every worksheet field picks its own up automatically. */
const FIELD_HINTS = [
  [/^Percent water in Ca\(NO₃\)₂·4H₂O$/, 'Four waters over the mass of the whole hydrate, then × 100.'],
  [/^Percent water in Na₃PO₄·12H₂O$/, 'Twelve waters over the mass of the whole hydrate, then × 100.'],
  [/^Ca\(NO₃\)₂·4H₂O$/, 'Add the mass of four water molecules to the anhydrous formula.'],
  [/^Na₃PO₄·12H₂O$/, 'Twelve waters go with each formula unit — include every one of them.'],
  [/^Ca₃\(PO₄\)₂$/, 'No water in this formula: 3 Ca, 2 P and 8 O.'],
  [/^NaNO₃$/, 'One Na, one N and three O — nothing else.'],
  [/^H₂O$/, 'Two H and one O.'],
  [/^[ab]\) Moles of /, 'Divide the mass you weighed by the molar mass of that hydrate.'],
  [/^b\) Mass of excess reagent left$/, 'Find what each reagent can make, then subtract what the excess one actually used.'],
  [/^c\) Theoretical yield/, 'Moles of product × the molar mass of Ca₃(PO₄)₂ from part 2.'],
  [/^d\) Percent yield$/, 'actual ÷ theoretical × 100%, using the mass printed in the question.'],
  [/^Mass of excess reagent remaining$/, 'What the limiting reagent left unconsumed.'],
  [/^Theoretical yield/, 'Moles of Ca₃(PO₄)₂ × its molar mass.'],
  [/^Percent yield of your experiment$/, 'Measured mass ÷ theoretical yield × 100%.']
];
function fieldHint(label) {
  const hit = FIELD_HINTS.find(([re]) => re.test(label));
  return hit ? hit[1] : '';
}

function numField(label, ans, tol, unit, opt = {}) {
  const tolAttr = opt.rel ? `data-rel="${opt.rel}"` : `data-tol="${tol}"`;
  return `<label class="pf">
    <span class="plab">${label}</span>
    <span class="pfield">
      <input type="text" inputmode="decimal" autocomplete="off" data-ans="${ans}" ${tolAttr} data-hint="${escAttr(fieldHint(label))}" placeholder="${opt.ph || '0.00'}">
      <em>${unit}</em>
    </span>
    <span class="pf-fix"></span>
  </label>`;
}

let plProblem = null;
function prelabProblem() {
  if (plProblem) return plProblem;
  const draw = () => (800 + Math.floor(Math.random() * 151)) / 1000;
  for (;;) {
    const mCa = draw(), mNa = draw();
    const yCa = mCa / M.ca / 3, yNa = mNa / M.na / 2;   // mol Ca₃(PO₄)₂ each reagent can give
    const lim = yCa < yNa ? 'ca' : 'na';
    const theo = Math.min(yCa, yNa) * M.prod;
    const excess = lim === 'ca' ? mNa - yCa * 2 * M.na : mCa - yNa * 3 * M.ca;
    if (Math.abs(mCa - mNa) < 0.003 || excess < 0.02) continue;
    const frac = 0.602 + Math.floor(Math.random() * 197) / 1000;   // 60.2–79.8 %
    return (plProblem = { mCa, mNa, lim, yCa, yNa, excess, theo, actual: Math.round(theo * frac * 1000) / 1000 });
  }
}

/* ---------- shared worksheet grading and navigation ---------- */
let picks = {};
let sheetReturn = 'lab';

/* Said on both sheets before the student starts: checking gives feedback, not answers. The instructor
   copy shows the key, so the sentence would be untrue there and is left out. */
const PRACTICE_NOTE = INSTRUCTOR ? ''
  : ' Checking is for practice: a wrong answer gets a hint, never the answer.';

/* Answers are never printed. A wrong field gets a hint and a reminder to check the work, so a
   checked sheet shows what is wrong without handing over the answer. */
function hintFor(el, wrap) {
  return el.dataset.hint || (wrap && wrap.dataset.hint) || 'Not quite — recheck your working and try again.';
}

function markField(el, ok) {
  el.classList.toggle('ok', ok);
  el.classList.toggle('bad', !ok);
  const wrap = el.closest('.pf, .prow, .pickgroup');
  if (!wrap) return;
  wrap.classList.toggle('ok', ok);
  wrap.classList.toggle('bad', !ok);
  const fix = wrap.querySelector('.pf-fix');
  if (fix) fix.textContent = ok ? '' : hintFor(el, wrap);
}

function isCorrect(el) {
  if (el.tagName === 'SELECT') return el.value === el.dataset.ans;
  const v = parseFloat(String(el.value).replace(',', '.').trim());
  const want = parseFloat(el.dataset.ans);
  const tol = el.dataset.rel
    ? Math.abs(want) * parseFloat(el.dataset.rel)
    : parseFloat(el.dataset.tol || '0');
  return isFinite(v) && Math.abs(v - want) <= tol + 1e-9;
}

function gradeSheet(root, scoreSel) {
  let correct = 0, total = 0;
  document.querySelectorAll(`${root} [data-ans], ${root} [data-checks]`).forEach(el => {
    total++;
    const ok = el.hasAttribute('data-checks') ? checksMatch(el)
      : el.matches('.pickgroup') ? picks[el.dataset.group] === el.dataset.ans
      : isCorrect(el);
    markField(el, ok);
    if (ok) correct++;
  });
  const s = document.querySelector(scoreSel);
  if (!s) return;
  s.textContent = correct === total
    ? `${correct} / ${total} correct — all correct`
    : `${correct} / ${total} correct — recheck the marked ones; answers are not shown.`;
  s.classList.toggle('ok', correct === total);
  s.classList.toggle('bad', correct !== total);
  s.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function showSheet(id, build) {
  sheetReturn = $('#resultsView').classList.contains('hidden') ? 'lab' : 'results';
  picks = {};
  const view = document.querySelector(id);
  view.innerHTML = build();
  ['#labView', '#resultsView', '#introView', '#prelabView', '#postlabView']
    .forEach(s => document.querySelector(s).classList.add('hidden'));
  view.classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function hideSheet() {
  ['#introView', '#prelabView', '#postlabView'].forEach(s => document.querySelector(s).classList.add('hidden'));
  if (sheetReturn === 'results') $('#resultsView').classList.remove('hidden');
  else $('#labView').classList.remove('hidden');
}
function resetSheet(id, build) {
  picks = {};
  document.querySelector(id).innerHTML = build();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showWork() {
  const box = document.querySelector('#pl4work');
  if (!box) return;
  const p = prelabProblem();
  const limName = HYDRATE[p.lim], excName = HYDRATE[p.lim === 'ca' ? 'na' : 'ca'];
  const nCa = p.mCa / M.ca, nNa = p.mNa / M.na;
  const yTheo = Math.min(p.yCa, p.yNa);
  const excMass = p.lim === 'ca' ? p.mNa : p.mCa;
  const excCoef = p.lim === 'ca' ? 2 : 3;
  const excM = p.lim === 'ca' ? M.na : M.ca;
  const lines = [
    `n(Ca(NO₃)₂·4H₂O) = ${p.mCa.toFixed(3)} g ÷ ${M.ca} g/mol = ${sci(nCa)} mol`,
    `mol Ca₃(PO₄)₂ from Ca²⁺  = ${sci(nCa)} ÷ 3 = ${sci(p.yCa)} mol`,
    ``,
    `n(Na₃PO₄·12H₂O)  = ${p.mNa.toFixed(3)} g ÷ ${M.na} g/mol = ${sci(nNa)} mol`,
    `mol Ca₃(PO₄)₂ from PO₄³⁻ = ${sci(nNa)} ÷ 2 = ${sci(p.yNa)} mol`,
    ``,
    `<span class="h">smaller amount → limiting reagent = ${limName}</span>`,
    `<span class="h">theoretical yield = ${sci(yTheo)} mol × ${M.prod} g/mol = ${p.theo.toFixed(4)} g</span>`,
    `excess ${excName} = ${excMass.toFixed(3)} g − ${excCoef} × ${sci(yTheo)} mol × ${excM} g/mol = ${p.excess.toFixed(4)} g`,
    ``,
    `<span class="g">percent yield = ${p.actual.toFixed(3)} g ÷ ${p.theo.toFixed(4)} g × 100% = ${(p.actual / p.theo * 100).toFixed(2)}%</span>`
  ];
  box.innerHTML = `<div class="note" style="margin:12px 0 4px">Worked solution</div><div class="math">${lines.join('\n')}</div>`;
  box.hidden = false;
}

function postlabSources() {
  return sourceKeys().map(k => SOURCE_TEXT[k]());

/* The faults this run's data shows, in the order the post-lab lists them. */
function sourceKeys() {
  const keys = [];
  if (S.vigorous) keys.push('vigorous');
  if (S.boilTime < DIGEST_MIN) keys.push('short');
  if (S.lowVol) keys.push('low');
  if (S.refilters > 0) keys.push('refilter');
  if (!S.beakerRinsed) keys.push('beaker');
  if (S.washWarm) keys.push('warm');
  if (S.washCount < WASH_MIN) keys.push('wash');
  if (paperCharred()) keys.push('charred');
  keys.push('transfer');
  return keys;
}
const SOURCE_TEXT = {
  vigorous: () => 'Vigorous boiling splattered the mixture and created fines that passed the filter paper.',
  short: () => `The mixture was digested for only ${S.boilTime.toFixed(1)} min, so the crystals stayed small and fines were lost.`,
  low: () => `The volume fell below ${VOL_MIN} mL during digestion, baking product onto the beaker wall.`,
  refilter: () => 'The filtrate was cloudy, so the mixture had to be filtered again.',
  wash: () => `The precipitate was washed only ${S.washCount} of ${WASH_MIN} times, leaving soluble NaNO₃ in the solid.`,
  beaker: () => 'The beaker was never rinsed into the funnel, so the product still stuck to it never reached the dish.',
  warm: () => 'The cake was washed with warm water, which dissolved a little of the precipitate and carried it into the filtrate.',
  charred: () => `The burner was left on for ${S.dryTime.toFixed(1)} min, past ${CHAR_MIN}, so the filter paper charred and the carbon stayed in the dish.`,
  transfer: () => 'Some product always stays behind on the glassware and filter paper — unavoidable transfer loss.'
};
/* A tick-list counts as correct only when it matches the faults exactly. */
function checksMatch(el) {
  const ticked = [...el.querySelectorAll('input[data-src]')].filter(i => i.checked).map(i => i.dataset.src);
  const want = sourceKeys();
  return ticked.length === want.length && want.every(k => ticked.includes(k));
}

/* A typed number as it should read on paper: four significant figures, scientific when small. */
function answerText(v, unit) {
  const n = parseFloat(v);
  const s = isFinite(n) ? (Math.abs(n) < 0.01 ? sci(n) : String(+n.toPrecision(4))) : (v.trim() || '—');
  return unit ? `${s} ${unit}` : s;
}

/* What the student answered, question by question, with the grader's verdict.
   `raw` is the unformatted answer, so an edit too small to change `answer` still shows. */
function postlabSnapshot() {
  const root = $('#postlabView');
  const rows = [];
  root.querySelectorAll('.pf').forEach(pf => {
    const input = pf.querySelector('input[data-ans]');
    rows.push({
      label: pf.querySelector('.plab').textContent.trim(),
      raw: input.value.trim(),
      answer: answerText(input.value, (pf.querySelector('em') || {}).textContent || ''),
      ok: isCorrect(input)
    });
  });
  root.querySelectorAll('.pickgroup').forEach(g => {
    const chosen = g.querySelector(`[data-pick-val="${picks[g.dataset.group]}"]`);
    rows.push({
      label: g.querySelector('.note').textContent.trim(),
      raw: picks[g.dataset.group] || '',
      answer: chosen ? chosen.textContent.trim() : '—',
      ok: picks[g.dataset.group] === g.dataset.ans
    });
  });
  root.querySelectorAll('.chklist').forEach(list => {
    const ticks = [...list.querySelectorAll('input[data-src]')].filter(i => i.checked);
    rows.push({
      label: 'Sources of the lost yield',
      raw: ticks.map(i => i.dataset.src).join(','),
      answer: ticks.length ? ticks.map(i => i.parentElement.textContent.trim()).join('; ') : 'none ticked',
      ok: checksMatch(list)
    });
  });
  return { score: $('#postlabScore').textContent.trim(), rows };
}

function checkPostlab() {
  gradeSheet('#postlabView', '#postlabScore');
  POSTLAB = postlabSnapshot();
  const seventh = $('#pl7fix');
  if (!seventh) return;
  seventh.textContent = seventh.closest('.chklist').classList.contains('ok')
    ? 'Exactly the sources your run supports.'
    : 'Not the right set — go back through your own run: boiling, digest time, volume, filtration, washing and drying.';
}

/* The notebook as plain text, read off the rendered sheet so there is only one copy of the data. */
function notebookText() {
  const lines = ['Limiting Reagent Lab — limiting reagent and percent yield'];
  if (STUDENT.name) lines.push(`Name: ${STUDENT.name}`);
  if (STUDENT.course) lines.push(`Course: ${STUDENT.course}${STUDENT.section ? ' · Section ' + STUDENT.section : ''}`);
  if (STUDENT.date) lines.push(`Date: ${STUDENT.date}`);
  [...$('#modalBody').children].forEach(el => {          // walk the sheet in the order it prints
    if (el.matches('table.data')) {
      lines.push('', el.dataset.nb.toUpperCase());
      el.querySelectorAll('tr').forEach(tr => {
        const cells = [...tr.children].map(td => td.textContent.replace(/\u00a0/g, ' ').trim());
        lines.push(`${cells[0].replace(/\?$/, '')}: ${cells[1]}`);   // no ': ?' on question rows
      });
    } else if (el.matches('.nb-rules')) {
      lines.push('', el.textContent.trim());
    } else if (el.matches('ol.errlist')) {
      lines.push('', 'BENCH LOG');
      [...el.children].forEach((li, i) => lines.push(`${i + 1}. ${li.textContent.trim()}`));
    } else if (el.matches('.nbdiscuss')) {
      lines.push('', 'DISCUSSION', el.textContent.trim());
    }
  });
  return lines.join('\n');
}

async function copyNotebook() {
  const text = notebookText();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
  }
  const b = $('#modalBody [data-ui="copy-notebook"]');
  if (!b) return;
  b.textContent = ok ? 'Copied ✓' : 'Copy failed';
  setTimeout(() => { b.textContent = 'Copy as text'; }, 1600);
}

/* The running footer for the hand-in sheet: a page-margin box, drawn from @page, so it lands at the
   foot of every printed page — which a normal element cannot do. @page cannot be scoped by a class
   and the name is runtime data, so the rule exists only while the notebook is open; a plain print of
   the bench carries no footer. It is rebuilt as the name is typed, because the browser's own Ctrl+P
   never runs printNotebook(). font and colour sit on @page and are inherited by both boxes. */
function nbPrintFoot() {
  let el = $('#nbPrintFoot');
  if (!document.body.classList.contains('nb-open')) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('style');
    el.id = 'nbPrintFoot';
    document.head.appendChild(el);
  }
  const who = STUDENT.name.trim() || 'Name ______________________';
  el.textContent = `@page{
    font:10.5px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;color:#475467;
    @bottom-left{content:"${who.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}"}
    @bottom-right{content:"Page " counter(page) " of " counter(pages)}
  }`;
}

/* Ask for the details that identify the sheet before exporting it, rather than printing a nameless page. */
/* A shared lab computer: one click forgets the details this browser remembers, and the sheet, its footer
   and the export check all fall back to empty. */
function forgetStudent() {
  NEEDED.forEach(k => { STUDENT[k] = ''; });
  try { localStorage.removeItem(STUDENT_KEY); localStorage.removeItem(OLD_STUDENT_KEY); } catch { /* nothing stored to clear */ }
  openNotebook();       // the sheet re-renders from the cleared details, footer included
  toast('Name, course and section cleared from this computer.');
}

function printNotebook() {
  const missing = NEEDED.filter(k => !STUDENT[k].trim());
  const fields = [...$('#modalBody').querySelectorAll('[data-student]')];
  fields.forEach(f => f.classList.toggle('need', missing.includes(f.dataset.student)));
  if (!missing.length) return window.print();
  const first = fields.find(f => f.dataset.student === missing[0]);
  if (first) first.focus();
  const list = missing.length > 1 ? `${missing.slice(0, -1).join(', ')} and ${missing[missing.length - 1]}` : missing[0];
  toast(`Add your ${list} before exporting the PDF.`);
}

/* The pre-lab exports as a PDF of the student's own work. Like the hand-in sheet it asks for the name
   first — the same state the notebook uses, so it is typed once — and that name prints on the sheet. */
function exportPrelab() {
  const field = $('#prelabView [data-student="name"]');
  if (!STUDENT.name.trim()) {
    if (field) { field.classList.add('need'); field.focus(); }
    toast('Add your name before exporting the pre-lab.');
    return;
  }
  if (field) field.classList.remove('need');
  document.body.classList.add('sheet-print');
  print();
}

/* The browser's own Ctrl+P never runs printNotebook(), so on the sheet it is routed through it: the
   same ask applies, and a complete sheet prints. On the bench the key is left alone. Capture phase on
   window so no other handler can swallow it first, and e.code as well as e.key because on a non-Latin
   layout the browser still prints on Ctrl+P while e.key is not 'p'. The browser menu's Print cannot be
   blocked by any page — beforeprint is not cancelable — so this guards the shortcut only. */
addEventListener('keydown', e => {
  if (e.repeat || e.altKey || e.shiftKey || !(e.ctrlKey || e.metaKey)) return;
  if (e.code !== 'KeyP' && e.key.toLowerCase() !== 'p') return;
  if (document.body.classList.contains('nb-open')) { e.preventDefault(); printNotebook(); return; }
  if (!$('#prelabView:not(.hidden)')) return;
  e.preventDefault();
  exportPrelab();
}, { capture: true });

/* A print started from the browser menu cannot be blocked, so an incomplete sheet shows a short note
   instead. The note is part of the sheet already and one class on body decides which one prints, so the
   sheet is never rebuilt: typed values, focus and scroll all survive, and a repeated beforeprint is
   harmless. */
addEventListener('beforeprint', () => {
  const missing = document.body.classList.contains('nb-open') && NEEDED.some(k => !STUDENT[k].trim());
  document.body.classList.toggle('nb-note', missing);
  /* A print started from the browser menu on the pre-lab prints that sheet alone, name line and all. */
  document.body.classList.toggle('sheet-print',
    !document.body.classList.contains('nb-open') && !!$('#prelabView:not(.hidden)'));
});
addEventListener('afterprint', () => {
  document.body.classList.remove('nb-note');
  document.body.classList.remove('sheet-print');
});

/* ---- Instructor edition: answer keys on screen as soon as a sheet is built ----
   Inert in the student copy, where INSTRUCTOR is false. It fills the answers the sheet already
   grades against, so the key can never drift from the marks. */
if (INSTRUCTOR) {
  const KEYED = { '#prelabView': '#prelabScore', '#postlabView': '#postlabScore' };

  function fillKeys(rootSel, scoreSel) {
    const root = document.querySelector(rootSel);
    if (!root) return;
    root.querySelectorAll('[data-ans]').forEach(el => {
      if (el.matches('.pickgroup')) {
        picks[el.dataset.group] = el.dataset.ans;
        root.querySelectorAll(`[data-pick-group="${el.dataset.group}"]`)
          .forEach(b => b.classList.toggle('on', b.dataset.pickVal === el.dataset.ans));
      } else if (el.tagName === 'SELECT') {
        el.value = el.dataset.ans;
      } else {
        /* Keys the sheet authored itself ("236.15") are already the answer as written; the post-lab
           passes raw doubles to the grader, so those are rounded to four significant figures. */
        const ans = String(el.dataset.ans);
        el.value = ans.length > 8 && isFinite(Number(ans)) ? String(+Number(ans).toPrecision(4)) : ans;
      }
    });
    root.querySelectorAll('.chklist[data-checks]').forEach(list => {
      const want = sourceKeys();
      list.querySelectorAll('input[data-src]').forEach(i => { i.checked = want.includes(i.dataset.src); });
    });
    root.querySelectorAll('[data-ans], [data-checks]').forEach(el => {
      const ok = el.hasAttribute('data-checks') ? checksMatch(el)
        : el.matches('.pickgroup') ? picks[el.dataset.group] === el.dataset.ans
        : isCorrect(el);
      markField(el, ok);
    });
    const score = document.querySelector(scoreSel);
    if (score) {
      score.textContent = 'Instructor copy — answer key shown';
      score.classList.add('ok');
      score.classList.remove('bad');
    }
    if (rootSel === '#prelabView') showWork();   // the worked solution for part 4, always on
  }

  const shownSheet = showSheet, clearedSheet = resetSheet, drawnProblem = newProblem;
  showSheet = function (id, build) { shownSheet(id, build); if (KEYED[id]) fillKeys(id, KEYED[id]); };
  resetSheet = function (id, build) { clearedSheet(id, build); if (KEYED[id]) fillKeys(id, KEYED[id]); };
  newProblem = function () { drawnProblem(); fillKeys('#prelabView', '#prelabScore'); };
}

   Theme switch
   The bench, the panels and the worksheets all read their colours from CSS, so switching is one attribute on
   <html>; nothing is redrawn. A tiny script in <head> applies the saved choice before first paint.
   ========================================================================== */
const THEME_KEY = 'experiment-simulation.theme';
const THEME_COLOR = { dark: '#070d18', light: '#edf2f9' };
const ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>';
const ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.2A8.5 8.5 0 1 1 10.8 3.5a6.8 6.8 0 0 0 9.7 9.7z"/></svg>';
const currentTheme = () => document.documentElement.dataset.theme === 'light' ? 'light' : 'dark';
function setTheme(t, save = true) {
  t = t === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', THEME_COLOR[t]);
  const b = $('#btnTheme');
  if (b) {
    /* The icon names where the click goes: a sun on the dark bench, a moon on the light one. */
    b.innerHTML = t === 'dark' ? ICON_SUN : ICON_MOON;
    const to = t === 'dark' ? 'Switch to light mode' : 'Switch to dark mode';
    b.title = to; b.setAttribute('aria-label', to);
  }
  if (save) { try { localStorage.setItem(THEME_KEY, t); } catch (e) {} }
}
setTheme(currentTheme(), false);
$('#btnTheme').addEventListener('click', () => setTheme(currentTheme() === 'light' ? 'dark' : 'light'));

/* ==========================================================================
   Calculator — the standard draggable scientific calculator (recursive-descent parser, no eval).
   Opened from the top-bar button, not a floating one: the step panel's Continue button owns the bottom-right corner.
   "Use result in answer box" fills whichever worksheet answer box was focused last.
   ========================================================================== */
(function () {
/* ---------- expression engine (no eval) ---------- */
function tokenize(s) {
  const out = []; let i = 0;
  while (i < s.length) {
    const rest = s.slice(i); let m;
    if (/^\s/.test(rest)) { i++; continue; }
    if ((m = /^(\d+\.?\d*|\.\d+)(E[+-]?\d+)?/.exec(rest))) { out.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue; }
    if ((m = /^(asin|acos|atan|sin|cos|tan|ln|log|sqrt|pi|ans|e)/.exec(rest))) {
      const w = m[1]; out.push({ t: (w === 'pi' || w === 'e' || w === 'ans') ? 'const' : 'fn', v: w }); i += w.length; continue;
    }
    if ('+-*/^()'.includes(rest[0])) { out.push({ t: 'op', v: rest[0] }); i++; continue; }
    throw new Error('Syntax error');
  }

}
function evaluate(str, opts) {
  const tk = tokenize(str); let p = 0;
  const peek = () => tk[p], nxt = () => tk[p++];
  const isOp = (t, v) => t && t.t === 'op' && t.v === v;
  const starts = (t) => t && (t.t === 'num' || t.t === 'const' || t.t === 'fn' || isOp(t, '('));
  const toRad = (x) => (opts.deg ? x * Math.PI / 180 : x);
  const fromRad = (x) => (opts.deg ? x * 180 / Math.PI : x);
  const F = {
    sin: (x) => Math.sin(toRad(x)), cos: (x) => Math.cos(toRad(x)), tan: (x) => Math.tan(toRad(x)),
    asin: (x) => fromRad(Math.asin(x)), acos: (x) => fromRad(Math.acos(x)), atan: (x) => fromRad(Math.atan(x)),
    ln: Math.log, log: Math.log10, sqrt: Math.sqrt,
  };
  function expr() {
    let v = term();
    while (isOp(peek(), '+') || isOp(peek(), '-')) { const o = nxt().v; const r = term(); v = o === '+' ? v + r : v - r; }
    return v;
  }
  function term() {
    let v = unary();
    for (;;) {
      const t = peek();
      if (isOp(t, '*') || isOp(t, '/')) { nxt(); const r = unary(); v = t.v === '*' ? v * r : v / r; }
      else if (starts(t)) v *= unary();
      else return v;
    }
  }
  function unary() {
    if (isOp(peek(), '-')) { nxt(); return -unary(); }
    if (isOp(peek(), '+')) { nxt(); return unary(); }
    return power();
  }
  function power() {
    const b = primary();
    if (isOp(peek(), '^')) { nxt(); return Math.pow(b, unary()); }
    return b;
  }
  function primary() {
    const t = nxt();
    if (!t) throw new Error('Incomplete');
    if (t.t === 'num') return t.v;
    if (t.t === 'const') return t.v === 'pi' ? Math.PI : t.v === 'e' ? Math.E : opts.ans;
    if (t.t === 'fn') {

function fmt(x) {

  const a = Math.abs(x);
  if (a >= 1e10 || a < 1e-6) return x.toExponential(6).replace(/\.?0+e/, 'e').replace('e+', 'e');

const pretty = (s) => s.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−').replace(/pi/g, 'π').replace(/sqrt\(/g, '√(').replace(/asin\(/g, 'sin⁻¹(').replace(/acos\(/g, 'cos⁻¹(').replace(/atan\(/g, 'tan⁻¹(');

/* ---------- UI ---------- */
function initCalculator(getLastInput) {
  const st = { expr: '', deg: true, inv: false, ans: 0, done: false, err: '' };
  const panel = document.getElementById('calc'), fab = document.getElementById('fab');
  const K = (label, act, cls, extra) => ({ label, act, cls: cls || '', extra: extra || '' });
  const rows = () => [
    [K('2nd', 'inv', st.inv ? 'on fn' : 'fn'), K(st.deg ? 'DEG' : 'RAD', 'deg', 'fn'), K('(', '('), K(')', ')'), K('⌫', 'back', 'clr')],
    [K(st.inv ? 'sin⁻¹' : 'sin', st.inv ? 'asin(' : 'sin(', 'fn'), K(st.inv ? 'cos⁻¹' : 'cos', st.inv ? 'acos(' : 'cos(', 'fn'), K(st.inv ? 'tan⁻¹' : 'tan', st.inv ? 'atan(' : 'tan(', 'fn'), K(st.inv ? 'eˣ' : 'ln', st.inv ? 'e^(' : 'ln(', 'fn'), K(st.inv ? '10ˣ' : 'log', st.inv ? '10^(' : 'log(', 'fn')],
    [K('√', 'sqrt(', 'fn'), K('x²', '^2', 'fn'), K('xʸ', '^', 'fn'), K('π', 'pi', 'fn'), K('e', 'e', 'fn')],
    [K('7', '7'), K('8', '8'), K('9', '9'), K('÷', '/', 'op'), K('C', 'clear', 'clr')],
    [K('4', '4'), K('5', '5'), K('6', '6'), K('×', '*', 'op'), K('Ans', 'ans', 'fn')],
    [K('1', '1'), K('2', '2'), K('3', '3'), K('−', '-', 'op'), K('EE', 'E', 'fn')],
    [K('0', '0'), K('.', '.'), K('+', '+', 'op'), K('=', '=', 'eq', 'grid-column:span 2')],
  ];

    <div class="calc-head" id="calcHead"><span class="grip"><span class="dots" aria-hidden="true">⠿</span>Calculator</span>
      <button type="button" id="calcClose" aria-label="Close calculator">&times;</button></div>
    <div class="disp"><div class="expr"><span id="cExpr"></span></div><div class="res" id="cRes">0</div>
      <div class="meta"><span id="cMode"></span><span>drag the header to move</span></div></div>
    <div class="keys" id="cKeys"></div>
    <div class="calc-foot"><button type="button" class="btn teal" id="cUse">Use result in answer box</button></div>`;
  const $c = (s) => panel.querySelector(s);

  function preview() {
    if (!st.expr.trim()) return { txt: '' };
    try { return { txt: fmt(evaluate(st.expr, st)) }; } catch (e) { return { txt: '' }; }
  }
  function paint() {
    const keys = $c('#cKeys'), flat = rows().flat();
    keys.innerHTML = flat.map((k, i) => `<button type="button" data-i="${i}" class="${k.cls}" style="${k.extra}">${k.label}</button>`).join('');
    keys.onclick = (e) => { const b = e.target.closest('button'); if (b) press(flat[Number(b.dataset.i)].act); };
    keys.onmousedown = (e) => e.preventDefault();
    $c('#cExpr').textContent = st.done ? pretty(st.shown) + ' =' : pretty(st.expr);
    const r = $c('#cRes');
    if (st.err) r.textContent = st.err;
    else if (st.done && !st.expr) r.textContent = fmt(st.ans);
    else r.textContent = preview().txt || '0';
    r.classList.toggle('err', !!st.err);
    $c('#cMode').textContent = (st.deg ? 'degrees' : 'radians') + (st.ans ? '   ans = ' + fmt(st.ans) : '');
  }
  function append(s) {
    if (st.done) {
      st.done = false;
      st.expr = (/^[+\-*/^]/.test(s) ? 'ans' : '') + s;   // operators continue from the last answer
      return;
    }
    st.expr += s;

    if (a === 'inv') st.inv = !st.inv;
    else if (a === 'deg') st.deg = !st.deg;
    else if (a === 'clear') { st.expr = ''; st.done = false; }
    else if (a === 'back') {
      if (st.done) { st.done = false; st.expr = ''; }
      else st.expr = st.expr.replace(/(asin\(|acos\(|atan\(|sqrt\(|sin\(|cos\(|tan\(|log\(|ln\(|ans|pi|.)$/, '');
    } else if (a === '=') {
      if (st.expr.trim()) {
        try { st.ans = evaluate(st.expr, st); st.shown = st.expr; st.expr = ''; st.done = true; }
        catch (e) { st.err = e.message; }
      }

    paint();
  }

  /* Opens under the top bar, at the right edge, unless the user has already dragged it somewhere. */
  function place() {
    if (panel.style.left) return;
    const bar = document.querySelector('.topbar');
    const top = Math.max(8, (bar ? bar.getBoundingClientRect().bottom : 60) + 8);
    const side = document.querySelector('.panel');
    const pr = side && side.offsetParent !== null ? side.getBoundingClientRect() : null;
    /* Beside the step panel, on the bench's side of it, so it never covers the Continue button. */
    const right = pr && pr.width && window.innerWidth > 1020 ? Math.max(12, window.innerWidth - pr.left + 12) : 12;
    panel.style.right = right + 'px'; panel.style.bottom = 'auto'; panel.style.top = top + 'px';
    panel.style.top = Math.max(4, Math.min(top, window.innerHeight - panel.offsetHeight - 4)) + 'px';
  }

  fab.setAttribute('aria-controls', 'calc'); setOpen(false);

    let v = st.done ? st.ans : (() => { try { return evaluate(st.expr || '0', st); } catch (e) { return NaN; } })();
    if (!isFinite(v) || !inp || !document.contains(inp) || inp.disabled) {

      setTimeout(() => { $c('#cUse').textContent = 'Use result in answer box'; }, 1400); return;
    }
    inp.value = String(Number(v.toPrecision(6)));
    inp.dispatchEvent(new Event('input', { bubbles: true }));   /* the sheet's own listeners see a typed answer */
    $c('#cUse').textContent = 'Inserted';

    if (e.ctrlKey || e.metaKey || e.altKey) return;

    else if (k === 'Enter' || k === '=') { press('='); e.preventDefault(); }
    else if (k === 'Backspace') { press('back'); e.preventDefault(); }
    else if (k === 'Escape') { setOpen(false); }
    else if (k === 'p') press('pi'); else if (k === 'e') press('e');

  head.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;

    if (!drag) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;

    const y = Math.min(Math.max(4, e.clientY - drag.dy), window.innerHeight - h - 4);
    panel.style.left = x + 'px'; panel.style.top = y + 'px';

  const end = () => { drag = null; };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);

    if (panel.style.left) {
      const r = panel.getBoundingClientRect();
      panel.style.left = Math.min(Math.max(4, r.left), Math.max(4, window.innerWidth - r.width - 4)) + 'px';
      panel.style.top = Math.min(Math.max(4, r.top), Math.max(4, window.innerHeight - r.height - 4)) + 'px';
    }
  });

window.initCalculator = initCalculator;
})();

/* The last numeric answer box the reader touched is where "Use result" puts the number. Name, course and section
   boxes are text for the hand-in sheet, so they are not answer boxes. */
let lastAnswerBox = null;
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el && el.matches && el.matches('input[data-ans], input[type="number"], input[inputmode="decimal"]')) lastAnswerBox = el;
});
$('#fab').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><rect x="8" y="5.5" width="8" height="4" rx="1"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg>';
window.initCalculator(() => lastAnswerBox);

render();
openIntro();
</script>
