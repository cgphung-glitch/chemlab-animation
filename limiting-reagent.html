  let ridges = '';
  for (let i = 0; i < 17; i++) ridges += `<line x1="${x-12+i*1.5}" y1="${y-142}" x2="${x-12+i*1.5}" y2="${y-119}" stroke="#aebdcf" stroke-opacity=".7" stroke-width=".7"/>`;
  return `<g>
    ${o.spray ? '' : shadow(x, y, 40)}
    <clipPath id="${id}"><path d="${body}"/></clipPath>
    <path d="${body}" fill="url(#clearliq)" opacity=".55"/>
    <path d="${body}" fill="url(#ldpe)"/>
    ${liquidBody(x, 36, y - 112, y + 6, id)}
    <line x1="${x+3}" y1="${y-118}" x2="${x+8}" y2="${y-3}" stroke="#ffffff" stroke-opacity=".55" stroke-width="2.4" clip-path="url(#${id})"/>
    <line x1="${x+3}" y1="${y-118}" x2="${x+8}" y2="${y-3}" stroke="#4a7ca3" stroke-opacity=".28" stroke-width=".9" clip-path="url(#${id})"/>
    <path d="M${x-34} ${y-20} Q${x} ${y-14} ${x+34} ${y-20} M${x-34} ${y-104} Q${x} ${y-98} ${x+34} ${y-104}" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.6" clip-path="url(#${id})"/>
    <path d="M${x+30} ${y-100} L${x+30} ${y-4}" stroke="#8aa3bd" stroke-opacity=".3" stroke-width="1" clip-path="url(#${id})"/>
    ${glassSheen(id, x, y - 116, y + 4, 34)}
    <path d="${body}" fill="none" stroke="#a9cbe8" stroke-opacity=".6" stroke-width="2"/>
    <rect x="${x-14}" y="${y-143}" width="28" height="25" rx="5" fill="#eef3f9" stroke="#8fa2b8"/>
    ${ridges}
    <rect x="${x-14}" y="${y-126}" width="28" height="4" fill="#3d8fd1" opacity=".85"/>
    <rect x="${x-10}" y="${y-147}" width="20" height="7" rx="3" fill="#f6f9fc" stroke="#8fa2b8"/>
    <path d="M${x-5} ${y-146} L${x-3} ${y-160} L${x+3} ${y-160} L${x+5} ${y-146} Z" fill="#e8eef5" stroke="#8fa2b8"/>
    <ellipse cx="${x}" cy="${y-160}" rx="3" ry="1.3" fill="#53657b"/>
    ${label}
    ${o.active ? `<ellipse cx="${x}" cy="${y-108}" rx="52" ry="66" fill="none" stroke="#4fb8ff" stroke-width="2" class="pulse"${loop()}/>` : ''}
  </g>`;
}

/* ---------- hot plate ---------- */
/* ---------- hot plate ---------- */
function hotplate(x, y, hot) {
  const ticks = [-135, -90, -45, 0, 45, 90, 135].map(a => {
    const r = a * Math.PI / 180, cx = x - 92, cy = y - 24;
    return `<line x1="${(cx + Math.sin(r) * 14.5).toFixed(1)}" y1="${(cy - Math.cos(r) * 14.5).toFixed(1)}" x2="${(cx + Math.sin(r) * 17.5).toFixed(1)}" y2="${(cy - Math.cos(r) * 17.5).toFixed(1)}" stroke="#c9d6e4" stroke-opacity=".7" stroke-width="1.3"/>`;
  }).join('');
  let slots = '';
  for (let i = 0; i < 4; i++) slots += `<rect x="${x-34}" y="${y-34+i*5.2}" width="68" height="2.4" rx="1.2" fill="#0a1017"/>`;
  return `<g>
    ${shadow(x, y, 120, 9)}
    <rect x="${x-102}" y="${y-3}" width="22" height="5" rx="2" fill="#0b1118"/><rect x="${x+80}" y="${y-3}" width="22" height="5" rx="2" fill="#0b1118"/>
    <rect x="${x-118}" y="${y-54}" width="236" height="54" rx="10" fill="url(#metal)" stroke="#2a394c" stroke-width="2"/>
    <rect x="${x-111}" y="${y-39}" width="222" height="33" rx="7" fill="#1d2937" stroke="#364b63"/>

    <path d="M${x-94} ${y-54} A 96 17 0 0 0 ${x+94} ${y-54}" fill="none" stroke="#dceaf6" stroke-opacity=".28" stroke-width="1.6"/>

/* ---------- filtration ---------- */
/* ---------- filtration ---------- */
function filterSetup(x, y, o = {}) {
  const fw = 74, fh = 172;        /* half the base's width, and the flask's height: its mouth sits at y - fh */
  const nw = 26;                  /* the neck's half-width: the rubber bung seats in it */
  const neck = 60;                /* the neck, from its mouth down to where the cone begins */
  const foot = 16;                /* the rounding at the base's corners */
  const padBase = 14;             /* the glass kept clear under the liquid */
  const mouth = y - fh;
  const coneTop = mouth + neck;   /* where the neck meets the cone */
  const id = uid();
  /* A conical filter flask rather than a beaker: a short straight neck, then a straight slant out to the base with
     no shoulder curve, and a rounded foot. The bung seats in the neck and the funnel's stem passes down through it. */
  const body = `M${x-nw} ${mouth} L${x-nw} ${coneTop} L${x-fw} ${y-foot}
    Q${x-fw} ${y} ${x-fw+foot} ${y} L${x+fw-foot} ${y} Q${x+fw} ${y} ${x+fw} ${y-foot}
    L${x+nw} ${coneTop} L${x+nw} ${mouth}`;
  const lvl = clamp(o.level || 0, 0, 1);
  /* The level is a fraction of the cone, so tuning the neck leaves the liquid where it was. */
  const top = coneTop + (y - padBase - coneTop) * (1 - lvl);
  /* The plate is measured from the bench this is drawn on, not from the flask's mouth, so the flask's height changes
     only how far its mouth sits below the funnel. */
  const plateY = y - PLATE_RISE, rim = plateY - BOWL_GAP;
  const bowlId = uid();
  const bowl = `M${x-84} ${rim} L${x-62} ${plateY} L${x+62} ${plateY} L${x+84} ${rim} Z`;
  const bowlLvl = clamp(o.bowl || 0, 0, 1);
  const bowlSurface = plateY - 6 - (plateY - rim - 12) * bowlLvl;
  let s = `${shadow(x, y, 92)}`;
  s += `<clipPath id="${id}"><path d="${body}"/></clipPath>`;
  const flaskFill = o.fillAnim
    ? ` class="pourfill" style="--fillfrom:${clamp(o.fillFrom ?? 0.03, 0, 1).toFixed(3)}${o.fillDelay ? `;animation-delay:${o.fillDelay}s` : ''}"`
    : '';
  if (lvl > 0.02) s += `<rect${flaskFill} x="${x-fw-4}" y="${top}" width="${(fw+4)*2}" height="${y-top+2}" fill="${o.fill || 'url(#clearliq)'}" clip-path="url(#${id})"/>`;
  if (o.milky && lvl > 0.02) s += `<rect x="${x-fw-4}" y="${top}" width="${(fw+4)*2}" height="${y-top+2}" fill="url(#milky)" opacity="${o.milky}" clip-path="url(#${id})"/>`;
  if (lvl > 0.02) {
    s += liquidBody(x, fw + 4, top, y + 2, id);
    /* The cone's wall is wider further down, so the surface's width is read from the level, not the base. */
    const halfAt = nw + (fw - nw) * clamp((top - coneTop) / (y - foot - coneTop), 0, 1);
    s += meniscus(id, x, top, Math.max(8, halfAt * 0.9));
  }
  s += glassSheen(id, x, mouth + 4, y - 6, fw);
  s += glassWall(body, id);
  s += `<path d="${body}" fill="url(#glassg)" stroke="#a9cbe8" stroke-opacity=".5" stroke-width="2"/>`;
  s += `<rect x="${x-fw}" y="${y-12}" width="${fw*2}" height="13" fill="url(#glassbase)" clip-path="url(#${id})"/>`;
  s += `<ellipse cx="${x}" cy="${y-5}" rx="${fw-14}" ry="5" fill="none" stroke="#cfe6ff" stroke-opacity=".22" stroke-width="1.6" clip-path="url(#${id})"/>`;
  /* the printed volume bars on a white enamel patch, as on the other glassware */
  s += `<rect x="${x+22}" y="${y-92}" width="26" height="42" rx="3" fill="#f3f8fd" fill-opacity=".78" clip-path="url(#${id})"/>`;
  s += enamelScale(x + 26, x + 44, y - 85, y - 56, 4, 0.9, '#51657d');
  s += vesselLip(x, mouth, nw, 6.6);
  /* The side arm leaves the middle of the neck, above the cone, as it does on a filter flask. It ends in a hose barb —
     a ridge the tubing is pushed over — and the heavy-walled vacuum tubing runs on to the wall port. */
  const armH = 14, armLen = 52;
  const armY = mouth + (neck - armH) / 2;
  const tube = `M${x+nw+armLen-12} ${armY + armH / 2} C ${x+150} ${armY+26} 900 ${y-160} 894 ${y-176}`;
  s += `<rect x="${x+nw-6}" y="${armY}" width="${armLen}" height="${armH}" rx="${armH / 2}" fill="url(#glassg)" stroke="#a9cbe8" stroke-opacity=".5" stroke-width="2"/>`;
  s += `<path d="${tube}" fill="none" stroke="#161d26" stroke-width="14" stroke-linecap="round"/>`;
  s += `<path d="${tube}" fill="none" stroke="#313e4d" stroke-width="10" stroke-linecap="round"/>`;
  s += `<path d="${tube}" fill="none" stroke="#7d91a7" stroke-opacity=".55" stroke-width="2" stroke-linecap="round" transform="translate(-2.4 -2.6)"/>`;
  s += `<rect x="${x+nw+armLen-19}" y="${armY-3}" width="5" height="${armH+6}" rx="2.4" fill="url(#glassg)" stroke="#a9cbe8" stroke-opacity=".6" stroke-width="1.4"/>`;
  /* The Büchner funnel itself: a rubber bung in the flask's neck, a short stem up to a flat perforated plate, and
     a shallow bowl above it that holds what is poured in until the vacuum draws it through. The bung is wider above
     the mouth than the neck is, so it seats on the rim; the stem runs down through it and stops inside. */
  const bungH = 24, bungSkirt = 8, bungWide = 30, bungSeat = 22;
  /* The stem runs down into the bung and stops inside it, short of the neck's mouth. */
  const stemStop = mouth - bungH + 6;
  s += `<path d="M${x-bungWide} ${mouth-bungH} L${x+bungWide} ${mouth-bungH} L${x+bungSeat} ${mouth+bungSkirt} L${x-bungSeat} ${mouth+bungSkirt} Z" fill="url(#rubber)" stroke="#10161d" stroke-width="1.5"/>`;
  s += `<ellipse cx="${x}" cy="${mouth-bungH}" rx="${bungWide}" ry="4.6" fill="#3b4654" stroke="#10161d"/>`;
  s += `<path d="M${x-bungWide+4} ${mouth-bungH+9} L${x+bungWide-4} ${mouth-bungH+9}" stroke="#0e141b" stroke-opacity=".7" stroke-width="1.6"/>`;
  s += `<rect x="${x-13}" y="${plateY}" width="26" height="${stemStop - plateY}" fill="url(#glassg)" stroke="#a9cbe8" stroke-opacity=".45" stroke-width="1.6"/>`;
  s += `<clipPath id="${bowlId}"><path d="${bowl}"/></clipPath>`;
  s += `<path d="${bowl}" fill="url(#glassg)" stroke="#a9cbe8" stroke-opacity=".5" stroke-width="2"/>`;
  if (bowlLvl > 0.01) {
    s += `<rect class="bowlpass" style="--dur:${o.bowlDur || '3s'}${o.bowlDelay ? `;animation-delay:${o.bowlDelay}s` : ''}${o.bowlPaused ? ';animation-play-state:paused' : ''}"
      x="${x-86}" y="${bowlSurface}" width="172" height="${plateY - bowlSurface + 2}" fill="url(#milky)" opacity=".85" clip-path="url(#${bowlId})"/>`;
    /* After the liquid, so the surface sits on it: the bowl wall slants, so its width follows the level. */
    const halfAt = 62 + 22 * clamp((plateY - bowlSurface) / (plateY - rim), 0, 1);
    s += meniscus(bowlId, x, bowlSurface, Math.max(10, halfAt * 0.9));
  }
  s += glassSheen(bowlId, x, rim + 2, plateY, 78);
  s += glassWall(bowl, bowlId);
  /* The plate, with the rings of holes the filtrate is pulled through. */
  s += `<ellipse cx="${x}" cy="${plateY}" rx="62" ry="10" fill="#dce8f4" opacity=".55" stroke="#cfe6ff" stroke-opacity=".55" stroke-width="1.6"/>`;
  for (let i = 0; i < 9; i++) {
    const a = Math.PI * (0.08 + 0.84 * i / 8);
    s += `<circle cx="${(x + Math.cos(a) * 50).toFixed(1)}" cy="${(plateY + Math.sin(a) * 6.5).toFixed(1)}" r="2.3" fill="#5f7894" opacity=".7"/>`;
  }
  for (let i = 0; i < 6; i++) {
    const a = Math.PI * (0.1 + 0.8 * i / 5);
    s += `<circle cx="${(x + Math.cos(a) * 28).toFixed(1)}" cy="${(plateY + Math.sin(a) * 3.8).toFixed(1)}" r="2" fill="#5f7894" opacity=".6"/>`;
  }
  s += vesselLip(x, rim, 84, 12);
  if (o.paper) {
    s += `<ellipse cx="${x}" cy="${plateY - 8}" rx="52" ry="8" fill="#f3f8fd" opacity=".95" stroke="#9fb6cc" stroke-opacity=".8"/>`;
    s += `<ellipse cx="${x}" cy="${plateY - 10}" rx="44" ry="6" fill="#eaf3fb" opacity=".95"/>`;
  }
  if (o.cake) {
    const c = clamp(o.cake, 0, 1);
    const crx = 6 + 32 * c, cry = 2 + 5 * c;
    s += `<ellipse cx="${x}" cy="${plateY - 14}" rx="${crx}" ry="${cry}" fill="#ffffff" opacity=".95"/>`;
    s += `<ellipse cx="${x}" cy="${plateY - 16}" rx="${crx * 0.78}" ry="${cry * 0.7}" fill="#f7fbff"/>`;
    for (let i = 0; i < 8; i++) s += `<circle cx="${(x - crx * .7 + (i * 31) % 100 / 100 * crx * 1.4).toFixed(1)}" cy="${(plateY - 16 + ((i * 17) % 7 - 3) * cry / 5).toFixed(1)}" r="1" fill="#b9cde2" opacity=".7"/>`;
    /* A dried cake shrinks and cracks as the last of the wash liquid comes out of it. */
    if (o.dry) s += `<path d="M${x-20} ${plateY-15} l9 4 l8 -5 M${x+5} ${plateY-20} l7 5 l9 -3"
      fill="none" stroke="#c3d5e6" stroke-width="1.3" stroke-linecap="round"/>`;
  }
  if (o.air) {
    /* The air the pump is drawing down through the cake and out under the plate. The dashes stay in the clear of
       the bowl above the cake, so they read against the dark interior rather than the white paper. */
    for (let i = 0; i < 5; i++) {
      const ax = x - 40 + i * 20, ay = plateY - 44 - (i % 2) * 7;
      s += `<line class="airpull" x1="${ax}" y1="${ay}" x2="${ax}" y2="${ay + 13}" stroke="#bfe6ff"
        stroke-width="2.6" stroke-linecap="round" opacity=".55" style="animation-delay:${(i * 0.18).toFixed(2)}s"/>`;
    }
  }
  if (o.drops) {
    s += `<circle class="drop" cx="${x}" cy="${plateY + 26}" r="4" fill="#bfe6ff" opacity=".8"${loop()}/>`;
    s += `<circle class="drop" cx="${x+5}" cy="${plateY + 22}" r="3" fill="#bfe6ff" opacity=".6"${loop(0.5)}/>`;
  }
  return s;
}

/* ---------- evaporating dish ---------- */
/* ---------- evaporating dish ---------- */
/* White glazed porcelain, as it is on the bench: opaque, with a rolled rim, a flat foot and a pouring spout. */
function dish(x, y, o = {}) {
  const id = uid();
  /* Sized to sit inside the gauze ring (half-width 74) and the balance pan (half-width 70) rather than overhang
     either: R is the rim, D the depth from rim to base. */
  const R = 60, D = 32;
  const bowl = `M${x-R} ${y-D} A ${R} ${D + 2} 0 0 0 ${x+R} ${y-D} Z`;
  let s = `<clipPath id="${id}"><path d="${bowl}"/></clipPath>`;
  s += `<ellipse cx="${x}" cy="${y+1}" rx="24" ry="3.4" fill="#8e9db1"/>`;
  s += `<path d="${bowl}" fill="url(#porcelain)" stroke="#8f9eb2" stroke-width="1.6"/>`;
  s += `<path d="M${x-R+13} ${y-D+11} Q${x-R+17} ${y-9} ${x-R+36} ${y-4}" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3.2" stroke-linecap="round" clip-path="url(#${id})"/>`;
  s += `<path d="M${x+R-6} ${y-D+6} Q${x+R-14} ${y-12} ${x+R-32} ${y-3}" fill="none" stroke="#6f8097" stroke-opacity=".28" stroke-width="5" stroke-linecap="round" clip-path="url(#${id})"/>`;
  /* the pouring spout */
  s += `<path d="M${x+R-4} ${y-D-3} L${x+R+10} ${y-D-6} L${x+R-2} ${y-D+7} Z" fill="url(#porcelain)" stroke="#8f9eb2" stroke-width="1.4" stroke-linejoin="round"/>`;
  /* the rim, and the opening inside it: shaded porcelain when empty, the contents when something is in it */
  s += `<ellipse cx="${x}" cy="${y-D}" rx="${R}" ry="8.6" fill="#f8fafc" stroke="#8f9eb2" stroke-width="1.6"/>`;
  s += `<ellipse cx="${x}" cy="${y-D+.8}" rx="${R-5}" ry="6.2" fill="${o.fill || 'url(#porcelainin)'}" stroke="#a9b6c6" stroke-width="1"/>`;
  s += `<path d="M${x-R+10} ${y-D+3} A ${R-8} 7 0 0 0 ${x-R+34} ${y-D+7}" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="1.6" stroke-linecap="round"/>`;
  /* One disc for the paper, painted white until it chars: painting a clean one under the char would leave a burnt
     paper reading as white with a grey spot. It keeps the paper's footprint so the dark still reads at this size,
     and wears the dish's own edge colour — on a white bowl a white paper shows only by its edge. The 2.4 stroke is
     not taste: at the narrowest layout (360 px window) the scene scales to 0.33, so a thinner one lands under a
     pixel and the rim fades to a tint. Do not shrink it back. */
  if (o.paper || o.paperBurnt) {
    s += o.paperBurnt
      ? `<ellipse cx="${x}" cy="${y-D-5.5}" rx="40" ry="8.6" fill="#1b1b1f" opacity=".92"/>`
      : `<ellipse cx="${x}" cy="${y-D-5.5}" rx="40" ry="8.6" fill="#e6f0fa" stroke="#a9cbe8" stroke-width="2.4"/>`;
    s += `<ellipse cx="${x}" cy="${y-D-7.3}" rx="25" ry="5.7" fill="#ffffff"/>`;
  }
  return s;
}

/* ---------- burner ---------- */

    <rect x="${x-11}" y="${y-72}" width="22" height="50" rx="3" fill="url(#nickel)" stroke="#2f3f52"/>
    <rect x="${x-13}" y="${y-74}" width="26" height="6" rx="2.5" fill="url(#nickel)" stroke="#2f3f52"/>
    <rect x="${x-15}" y="${y-46}" width="30" height="19" rx="3" fill="url(#nickel)" stroke="#2f3f52"/>
    <ellipse cx="${x-8}" cy="${y-36.5}" rx="1.7" ry="5.6" fill="#0d141c"/><ellipse cx="${x+8}" cy="${y-36.5}" rx="1.7" ry="5.6" fill="#0d141c"/>
    <line x1="${x-15}" y1="${y-29}" x2="${x+15}" y2="${y-29}" stroke="#2f3f52" stroke-width="1.2"/>
    ${on ? `<g>
      <ellipse cx="${x}" cy="${y-120}" rx="34" ry="62" fill="url(#glow)" opacity=".4"/>

      <path d="M${x} ${y-80} C ${x-9} ${y-104} ${x-5} ${y-128} ${x} ${y-150} C ${x+5} ${y-128} ${x+9} ${y-104} ${x} ${y-80} Z" fill="#eaf9ff" opacity=".85"/>
      <path d="M${x} ${y-80} C ${x-5} ${y-92} ${x-3} ${y-104} ${x} ${y-114} C ${x+3} ${y-104} ${x+5} ${y-92} ${x} ${y-80} Z" fill="#3b7dff" opacity=".7"/>

  s += `<g opacity=".85">

/* ---------- dropper ---------- */
/* ---------- dropper ---------- */
function dropper(x, y, label, active) {
  const barrel = `M${x-7} ${y-66} L${x-7} ${y-26} L${x-3.4} ${y-8} L${x-1.8} ${y} L${x+1.8} ${y} L${x+3.4} ${y-8} L${x+7} ${y-26} L${x+7} ${y-66} Z`;
