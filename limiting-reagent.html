  return `<g>
    <clipPath id="${id}"><path d="${barrel}"/></clipPath>
    <path d="M${x-3} ${y-70} C ${x-13} ${y-75} ${x-12} ${y-93} ${x-5} ${y-99} C ${x-2} ${y-102} ${x+2} ${y-102} ${x+5} ${y-99} C ${x+12} ${y-93} ${x+13} ${y-75} ${x+3} ${y-70} Z" fill="url(#rubberred)"/>
    <path d="M${x-7} ${y-90} Q${x-8} ${y-83} ${x-6} ${y-77}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
    <rect x="${x-9}" y="${y-72}" width="18" height="8" rx="2.5" fill="url(#castiron)" stroke="#10161d"/>
    <path d="${barrel}" fill="url(#glassg)" stroke="#a9cbe8" stroke-opacity=".6" stroke-width="1.6"/>
    <rect x="${x-8}" y="${y-52}" width="16" height="52" fill="url(#clearliq)" opacity=".9" clip-path="url(#${id})"/>
    <line x1="${x-8}" y1="${y-52}" x2="${x+8}" y2="${y-52}" stroke="#e6f6ff" stroke-opacity=".6" stroke-width="1.2"/>
    <line x1="${x-4}" y1="${y-64}" x2="${x-4}" y2="${y-14}" stroke="#fff" stroke-opacity=".32" stroke-width="2.4" stroke-linecap="round"/>
    <text x="${x}" y="${y-108}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#cfe4ff">${label}</text>
    ${active ? `<rect x="${x-16}" y="${y-104}" width="32" height="112" rx="12" fill="none" stroke="#4fb8ff" stroke-width="2" class="pulse"${loop()}/>` : ''}
  </g>`;
}
/* ==========================================================================
   Scenes — one stage of the procedure at a time
   ========================================================================== */
function scene() {
  switch (S.step) {
    case 0: return sWeigh();
    case 1: return sDissolve();
    case 2: return sMix();
    case 3: return sDigest();
    case 4: return sFilter();
    case 5: return sTest();
    case 6: return sDry();
  }
  return '';
}

function sWeigh() {
  const active = !S.weighed.ca ? 'ca' : (!S.weighed.na ? 'na' : null);
  const m = active ? S.draft[active] : S.weighed.na;
  let g = bg();
  g += jar(214, BENCH, { label: 'Ca(NO₃)₂·4H₂O', tint: '#cfe4ff', active: active === 'ca' });
  g += jar(746, BENCH, { label: 'Na₃PO₄·12H₂O', tint: '#d3ffe9', active: active === 'na' });
  if (S.weighed.ca != null) {
    g += weighBowl(338, BENCH, heapFrac(S.weighed.ca));
    /* A data label on the bowl, not a bench caption, so it keeps its own height instead of `cap`'s. */
    g += `<text x="338" y="${BENCH + 26}" text-anchor="middle" font-size="12.5" font-weight="650"
      fill="#8ea2c6">${S.weighed.ca.toFixed(3)} g</text>`;
  }
  g += balance(480, BENCH, `${m.toFixed(3)} g`);
  g += weighBowl(480, BENCH - 96, heapFrac(m));
  if (active && performance.now() - sprinkleAt < SPRINKLE_MS) g += sprinkleInto(480, BENCH - 96, since(sprinkleAt));
  /* Kept under 240 units wide so it starts to the right of the 1.100 g label over the left bowl (which ends at
     360) instead of running under it; "tared" and the spatula are the panel's business, not the bench's. */
  g += cap(480, 'weighing bowls · analytical balance');

  return g;
}

function sDissolve() {
  const now = performance.now();
  const pouring = k => now - pourAt[k] < WATER_POUR_MS;
  const swirling = k => now - swirlAt[k] < STIR_MS;   /* the ring spins while the flask is swirled, then goes */
  const anyPouring = pouring('ca') || pouring('na');
  /* Each 50 mL portion leaves the beaker on the bench as the jug takes it, so the reservoir is drawn full for as
     long as the water is still on its way to the flask. It holds 180 mL of its 250 mL, and the level is what is
     left of that rather than a number picked to look right. */
  const portions = ['ca', 'na'].filter(k => waterArrived(k)).length;
  const diLevel = (180 - 50 * portions) / 250;
  let g = bg();
  const FILL = 0.56;   /* 50 mL in a 125-mL flask */
  /* The solid is in the flask from the weigh-out; water is added on top of it and swirling dissolves it. */
  /* A swirl lifts the flask clear of the bench and rocks it about its own middle, then sets it back down. The ring
     is drawn inside the moving group, so it rides up and rocks with the glass instead of hanging at bench height. */
  const swirled = (k, x, o) => swirling(k)
    ? `<g class="swirlflask" style="animation-delay:${-since(swirlAt[k])}s">${flask(x, BENCH, o)}${swirlArc(x, BENCH - 104, since(swirlAt[k]))}</g>`
    : flask(x, BENCH, o);
  g += swirled('ca', 300, { sh: true, level: S.waterCA ? FILL : 0, fillAnim: pouring('ca'), fillDelay: JUG_IN_S - since(pourAt.ca), crystals: S.swirlCA ? 0 : solidFrac(S.weighed.ca, DRAFT_MAX) });
  g += swirled('na', 608, { sh: true, level: S.waterNA ? FILL : 0, fillAnim: pouring('na'), fillDelay: JUG_IN_S - since(pourAt.na), crystals: S.swirlNA ? 0 : solidFrac(S.weighed.na, DRAFT_MAX) });
  g += `<g class="dibench" opacity="${anyPouring ? '.35' : '1'}">${beaker(838, BENCH, { sh: true, level: diLevel, w: BEAKER_250_W, h: BEAKER_250_H })}</g>`;
  if (pouring('ca')) g += waterPour(300, BENCH, FILL, since(pourAt.ca));
  if (pouring('na')) g += waterPour(608, BENCH, FILL, since(pourAt.na));
  g += cap(300, waterArrived('ca') ? 'Ca(NO₃)₂ · 50 mL D.I. water' : 'Ca(NO₃)₂·4H₂O');
  g += cap(608, waterArrived('na') ? 'Na₃PO₄ · 50 mL D.I. water' : 'Na₃PO₄·12H₂O');
  g += cap(838, '250-mL beaker · D.I. water');
  return g;
}

/* D.I. water running out of a tilted jug into the flask mouth, drawn while the pour plays.
   The jug is pivoted on the rim corner nearest the flask, so that corner is the lowest point of the
   vessel and the stream leaves over the lip. The body sits up and to the left of the lip, clear of
   the fall, and the lip is placed over the neck so the water drops straight down. */
function waterPour(x, y, level, played = 0) {
  const mouthY = y - FLASK_H;
  const jugW = 74, jugH = 88;
  const lipX = x - 4, lipY = mouthY - 44;          /* lip, above the neck */
  const bx = lipX - jugW / 2, by = lipY + jugH;    /* rim's near corner sits on the lip */
  const wait = played ? ` style="animation-delay:${-played}s"` : '';   /* resumes a re-rendered pour */
  return `<g>
    <g class="juglift"${wait}>
      <g transform="rotate(98 ${lipX} ${lipY})">${beaker(bx, by, { level: 0.38, w: jugW, h: jugH })}</g>
    </g>
    ${pourStream(lipX, lipY, y + 4, flaskSurface(y, 0), flaskSurface(y, level), JUG_IN_S - played)}
  </g>`;
}

/* The wash bottle over a flask during a rinse. It is drawn upright with its spout on the pivot point, so
   tipping it swings the body up and to the left of the neck and the spray falls straight into the flask. */
function rinsePour(x, y, level, played = 0) {
  const lipX = x + 4, lipY = y - FLASK_H - 30;      /* the spout, clear of the neck */
  const bx = lipX, by = lipY + 160;                 /* spout tip sits on the pivot */
  return `<g>
    <g class="rinsespray"${played ? ` style="animation-delay:${-played}s"` : ''}>
      <g transform="rotate(104 ${lipX} ${lipY})">${bottle(bx, by, { spray: true, levelDeg: -104 })}</g>
    </g>
    ${pourStream(lipX, lipY, y + 4, flaskSurface(y, 0), flaskSurface(y, level), -played)}
  </g>`;
}

/* A stream of liquid falling from a lip into a vessel: drawn all the way to the vessel's floor and clipped back
   to the water line by streamcut, which runs on the same 1.15 s ease-out as fillup, so the tip rides the surface
   as it climbs instead of hanging above it. fromSurface is where the liquid was before this pour. */
function pourStream(x, lipY, floorY, fromSurface, toSurface, delay = 0, tint = '#cfe6ff', squirtS = 0) {
  const cut = s => ((floorY - (s + 3)) / (floorY - lipY) * 100).toFixed(2);
  const endY = toSurface + 3;
  return `<g class="pourstream" style="--pourcut0:${cut(fromSurface)}%;--pourcut:${cut(toSurface)}%${delay ? `;animation-delay:${delay}s` : ''}${squirtS ? `;--pours:${squirtS}s` : ''}">
    <line class="strm" x1="${x}" y1="${lipY}" x2="${x}" y2="${floorY}" stroke="${tint}" stroke-opacity=".72"
      stroke-width="7" stroke-linecap="round"/>
    <line x1="${x - 1.5}" y1="${lipY + 4}" x2="${x - 1.5}" y2="${floorY - 16}" stroke="#ffffff"
      stroke-opacity=".45" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${x}" cy="${endY}" r="3.4" fill="#eaf6ff" opacity=".55"/>
    <circle cx="${x + 7}" cy="${endY - 6}" r="2.2" fill="#eaf6ff" opacity=".45"/>
  </g>`;
}

function swirlArc(x, y, played = 0) {
  return `<g opacity=".55" class="pulse"${played ? ` style="animation-delay:${-played}s"` : ''}>
    <path d="M${x-46} ${y} a46 46 0 1 1 20 38" fill="none" stroke="#4fb8ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M${x-32} ${y-30} l8 12 l-14 4" fill="none" stroke="#4fb8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>`;
}

function sMix() {
  const mixed = S.pouredCA && S.pouredNA;
  const st = stoich(S.weighed.ca || 1, S.weighed.na || 1);
  const lvl = (S.pouredCA ? 0.2 : 0) + (S.pouredNA ? 0.2 : 0) + S.rinses * RINSE_LVL;
  const now = performance.now();
  const pouring = k => now - mixPourAt[k] < MIX_POUR_MS;
  const anyPour = pouring('ca') || pouring('na');
  /* A rinse goes into one flask at a time, in turn, so the beaker never has two flasks pouring into it at once. */
  const rinse = rinsePlaying(now);                /* the portion on the bench, if any */
  const rinsing = !!rinse, spraying = rinsing && now < rinse.at + RINSE_SPRAY;
  const rk = rinse && rinse.k;                    /* its flask */
  const rinseTarget = k => rinsing && rk === k;   /* the one flask this portion is going into */
  /* How far into its own animation a flask's node starts: a pour is already under way, a rinse waits out the
     spray. A flask that is pouring keeps its pour node even when a rinse is queued behind it. */
  const lead = k => (pouring(k) ? -since(mixPourAt[k]) : RINSE_S - since(rinse ? rinse.at : now));
  const BX = 628, FX = { ca: 196, na: 330 };          /* beaker on its stand, and where each flask sits */
  const floor = BENCH + 2, surf = l => beakerGeo(BENCH, 168, l);   /* the beaker's liquid surface */
  /* The beaker climbs from what it already held, not from empty, when the second portion goes in. */
  const beforeLvl = Math.max(0, lvl - (rinsing ? RINSE_LVL : 0.2));
  const fillFrom = lvl > 0.001 ? clamp((floor - surf(beforeLvl)) / (floor - surf(lvl)), 0, 1) : 0.03;
  /* A flask leaves its place on the bench while its twin is away, and comes back as the twin lands. With motion
     off the rinse is one still frame, so the flask stays put under the bottle while its twin hangs at the beaker. */
  const away = k => pouring(k) || (rinseTarget(k) && !motionReduced());
  const benchFlask = (k, poured) => {
    const washing = spraying && rinseTarget(k) && poured;   /* the washings rise in the flask under the bottle */
    return `<g${away(k) ? ` class="mixbenchhush" style="animation-delay:${lead(k)}s"` : ''}>${flask(FX[k], BENCH, {
      sh: true, level: poured ? (rinseTarget(k) ? RINSE_SPLASH : 0) : 0.56,
      fillAnim: washing, fillDelay: washing ? -since(rinse.at) : 0
    })}</g>`;
  };
  let g = bg();
  g += benchFlask('ca', S.pouredCA);
  g += benchFlask('na', S.pouredNA);
  const fillLead = lead(rinsing ? rk : pouring('ca') ? 'ca' : 'na') + MIX_STREAM_DELAY;
  g += beaker(BX, BENCH, {
    sh: true, level: lvl, fillAnim: anyPour || rinsing, fillFrom, fillDelay: fillLead,
    cloud: mixed ? 0.82 : 0, sediment: mixed ? solidFrac(st.theoretical) : 0, w: BEAKER_250_W, h: BEAKER_250_H
  });
  /* The flask itself travels: drawn upright at the beaker's mouth axis, then carried in from its place on the
     bench (--carryx), tipped over the rim and brought back, while the solution runs down into the beaker. */
  for (const k of ['ca', 'na']) {
    const isRinse = rinseTarget(k) && !pouring(k);
    if (!pouring(k) && !isRinse) continue;
    const mx = 604, my = BENCH - FLASK_H, start = lead(k);
    g += `<g class="mixcarry" style="--carryx:${FX[k] - mx}px;--mx:${mx}px;--my:${my}px;--lift:${MIX_LIFT}px;--liftup:${MIX_LIFT_UP}px;animation-delay:${start}s">${flask(mx, BENCH, { level: isRinse ? RINSE_SPLASH : 0.56 })}</g>`;
    g += pourStream(mx, my - MIX_LIFT, floor, surf(beforeLvl), surf(lvl), start + MIX_STREAM_DELAY);
  }
  if (spraying) g += rinsePour(FX[rk], BENCH, RINSE_SPLASH, since(rinse.at));
  if (S.stirred) {
    const stirring = now - stirAt < STIR_MS, played = since(stirAt);
    const rod = stirRod(BX, BENCH - 150);
    const wait = played ? `;animation-delay:${-played}s` : '';
    /* The rod swings about the beaker's mouth; when it is not being stirred it is just drawn in place. */
    g += stirring ? `<g class="stirring" style="--sx:${BX}px;--sy:${BENCH - 168}px${wait}">${rod}</g>` : rod;
    if (stirring) g += stirSwirl(BX, surf(lvl) + 6, played);
  }
  /* The bottle on the bench is the one that sprays, so it is simply not drawn while it is over a flask — one
     bottle in one place, no fade to keep in step with the spray. */
  if (!spraying) g += bottle(852, BENCH);
  g += cap(196, 'Ca(NO₃)₂');
  g += cap(330, 'Na₃PO₄');
  g += cap(628, '250-mL beaker · mixture');
  g += cap(852, 'wash bottle · D.I. water');
  /* Kept above the carry: a tipped flask reaches y ≈ 187 on its pivot over the rim. */
  if (mixed) g += `<text x="628" y="${BENCH - 330}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dff0ff" opacity=".85">Ca₃(PO₄)₂ forming — the mixture turns cloudy</text>`;
  return g;
}

/* The turning mixture under the rod: one dashed ring at the liquid surface, spun by the stirswirl animation. */
function stirSwirl(x, y, played = 0) {
  return `<ellipse class="stirswirl"${played ? ` style="animation-delay:${-played}s"` : ''} cx="${x}" cy="${y}" rx="54" ry="13" fill="none"
    stroke="#9fd8ff" stroke-opacity=".55" stroke-width="3" stroke-dasharray="18 13"/>`;
}

function stirRod(x, y) {
  return `<g><line x1="${x-52}" y1="${y-40}" x2="${x+34}" y2="${y+96}" stroke="#cfe6ff" stroke-opacity=".65" stroke-width="6" stroke-linecap="round"/>
  <line x1="${x-50}" y1="${y-38}" x2="${x+36}" y2="${y+96}" stroke="#fff" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
  <circle cx="${x-52}" cy="${y-40}" r="4.2" fill="#e9f6ff" fill-opacity=".7" stroke="#cfe6ff" stroke-opacity=".8"/>
  <circle cx="${x+34}" cy="${y+96}" r="3.6" fill="#e9f6ff" fill-opacity=".55"/></g>`;
}

/* The digest beaker's level: the volume it holds, as a fraction of the 250-mL beaker. */
const digestLvl = () => clamp((S.vol / 250) * 0.9, 0.02, 0.94);

/* The digest beaker is the reaction beaker carried over to the hot plate; it stands on the plate, so its base is
   DIGEST_BASE rather than the bench itself. */
const DIGEST_BASE = BENCH - 54;
const DIGEST_MOUTH = DIGEST_BASE - BEAKER_250_H;

function sDigest() {
  const lvl = digestLvl();
  const st = stoich(S.weighed.ca || 1, S.weighed.na || 1);
  const topping = performance.now() - topupAt < TOPUP_MS;
  /* The bottle parks with its spout 70 above the beaker's mouth, so the body swings up and clear of the glass
     when it tips; the stand is where it rests the rest of the time. */
  const spoutY = DIGEST_MOUTH - 70, bodyY = spoutY + 160;   /* the spout parks 70 above the beaker's mouth */
  let g = bg();
  g += hotplate(470, BENCH, S.heat !== 'off');
  g += beaker(470, BENCH - 54, {
    level: lvl, fill: 'url(#milky)', w: BEAKER_250_W, h: BEAKER_250_H,
    fillAnim: topping, fillFrom: clamp(topupLvlFrom / lvl, 0, 1),
    fillDelay: TOPUP_STREAM_S - since(topupAt),
    sediment: solidFrac(st.theoretical),
    bubbles: S.heat !== 'off', boil: S.heat, liqId: 'boilLiq'
  });
  if (S.heat !== 'off') {
    for (let i = 0; i < 4; i++) {
      g += `<path class="steam" d="M${440 + i * 22} ${DIGEST_MOUTH - 16} q 8 -18 0 -34 q -8 -16 0 -30" fill="none" stroke="#dff0ff" stroke-width="2.5" stroke-linecap="round" opacity=".5"${loop(i * 0.7)}/>`;
    }
  }
  if (topping) {
    /* The bottle that normally stands on the bench is the one being carried, so the stand copy is not drawn. */
    const topClock = `--dur:${TOPUP_MS / 1000}s;animation-delay:${-since(topupAt)}s`;
    g += `<g class="carry" style="--dx:${838 - 470}px;--dy:${BENCH - bodyY}px;${topClock}">
      <g class="tipopen" style="--px:470px;--py:${spoutY}px;--tipdeg:-150deg;${topClock}">${bottle(470, bodyY, { spray: true, tipped: topClock })}</g>
    </g>`;
    g += pourStream(470, spoutY, BENCH - 64,
      beakerGeo(DIGEST_BASE, BEAKER_250_H, topupLvlFrom), beakerGeo(DIGEST_BASE, BEAKER_250_H, lvl),
      TOPUP_STREAM_S - since(topupAt));
  } else {
    g += bottle(838, BENCH, { active: S.vol < 70 });
  }
  g += cap(470, '250-mL beaker on the hot plate');
  g += cap(838, 'wash bottle · D.I. water');
  const warn = S.vol < VOL_MIN;
  /* The note sits directly over the mouth the bottle pours into, so the action replaces it for its 2.6 s. */
  if (!topping) g += `<text x="470" y="${BENCH - 250}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${warn ? '#fb7185' : '#8ea2c6'}">${warn ? `Volume below ${VOL_MIN} mL — add water now` : S.heat === 'vigorous' ? 'Vigorous boil — splattering' : S.heat === 'gentle' ? `Gentle boil · digest ${DIGEST_MIN} min` : `Digest ${DIGEST_MIN} min · heat off`}</text>`;
  return g;
}

function sFilter() {
  const now = performance.now();
  const poured = S.pouredMix;
  const pouring = now - pourMixAt < POUR_MIX_MS;
  const rinsing = now - rinseBeakerAt < RINSE_BEAKER_MS;
  const bottleTurn = rinsing && now - rinseBeakerAt < RINSE_FILL_MS;   /* the wash bottle filling the beaker */
  const beakerTurn = rinsing && !bottleTurn;                           /* then the beaker rinsing the funnel */
  const washing = now - washAt < WASH_MS;
  const warmWash = washing && washFromBottle;   /* this wash gets the bottle, not the pipet */
  /* The trip runs on the wash's clock, not the render's: a repaint mid-wash (the vacuum clock ticking, a panel
     redraw) has to pick the animation up where it is, so it starts that far in on a negative delay. */
  const washClock = `--dur:${WASH_MS / 1000}s;animation-delay:${-since(washAt)}s`;
  const wetClock = `--dur:${WET_MS / 1000}s;animation-delay:${-since(wetAt)}s`;
  const carrying = pouring || beakerTurn;      /* the beaker is off its place on the bench */
  /* Seating the paper is the warm wash's own trip, so it only plays while the bottle and the funnel are otherwise
     idle: a pour or a wash begun during its 2.6 s is the one thing that would give the funnel a second stream. */
  const wetting = !motionReduced() && !carrying && !bottleTurn && !washing && now - wetAt < WET_MS;
  const milky = S.clarity === 'cloudy' ? 0.5 : (poured ? 0.15 : 0);
  /* The cake is what has been precipitated so far — the theoretical yield — sized like the dish. It is on the paper
     from the moment the mixture is filtered, washing only cleans it, so it thickens a little as it is washed. */
  const cake = solidFrac(stoich(S.weighed.ca || 1, S.weighed.na || 1).theoretical)
    * (0.86 + 0.14 * Math.min(1, S.washCount / WASH_MIN));
  /* The beaker's levels: the mixture, the rinse portion the bottle puts in, and a token one for a vessel on its
     way out — once poured the beaker is drawn empty, and the drain animation ends on nothing. */
  const MIX = 0.42, RINSED = 0.18, DRAWN = 0.02;
  /* Where the beaker is held to pour: tipped clockwise, its lowest corner is the far side of its mouth, so that
     corner — not the pivot — has to sit over the rim. Held high and tipped well over, the whole glass stays clear
     of the funnel: its lowest point sits above the rim's near edge at 224, and its body is left of the bowl. Only
     the stream crosses into the funnel. */
  const BH = BEAKER_250_H, POSE_X = 720, POSE_Y = 202;      /* the beaker's base in the pour pose */
  const PIVOT_X = POSE_X - BEAKER_250_W / 2, PIVOT_Y = POSE_Y - BH;   /* its rim's left corner, where the tip turns */
  const TIP = 70;                                  /* how far over it is tipped, in degrees */
  /* The lip is the rim's far corner swung down by the tip, so the stream leaves the glass wherever the pose puts it
     instead of at a height written out beside it. */
  const LIP_X = PIVOT_X + BEAKER_250_W * Math.cos(TIP * Math.PI / 180);
  const LIP_Y = PIVOT_Y + BEAKER_250_W * Math.sin(TIP * Math.PI / 180);
  /* To draw `from` while the rect is drawn at DRAWN: the rect runs from the base pad to the level, so it is
     12 + (h - 20) * level tall, not level / level. */
  const drainFrom = from => (12 + (BH - 20) * from) / (12 + (BH - 20) * DRAWN);
  let g = bg();
  g += iceBath(150, BENCH);
  /* A wash is poured from one of two tools: the transfer pipet for cold water, the wash bottle for warm. Both make
     the same trip, from their own place on the bench to the funnel and back, so they share one class, one clock and
     one destination. */
  const RIM_Y = PLATE - BOWL_GAP;        /* the bowl's mouth */
  const WASH_X = 700, WASH_Y = RIM_Y - 30;      /* a wash hangs higher: its label hangs with it */
  const WET_SPOUT_Y = RIM_Y - 12;        /* the squirt has no label, so it only clears the rim */
  const trip = (x, spoutY, toY = WASH_Y) => `--wx:${WASH_X - x}px;--wy:${toY - spoutY}px`;
  /* The wash bottle leaving its stand for the funnel: it travels as .tooltrip and tips as .tipopen about its spout,
     so the body swings clear above the funnel instead of covering the cake. A warm wash and wetting the paper are
     the same trip, differing only in the clock they are handed and how low they park. */
  const bottleTrip = (clock, toY = WASH_Y) => `<g class="tooltrip" style="${trip(262, BENCH - 160, toY)};${clock}">
      <g class="tipopen" style="--px:262px;--py:${BENCH - 160}px;--tipdeg:-150deg;${clock}">
        ${bottle(262, BENCH, { spray: true, tipped: clock })}
      </g>
    </g>`;
  const pipet = (active) => dropper(150, BENCH - 300, 'cold D.I. water', active);
  g += washing && !warmWash
    ? `<g class="tooltrip" style="${trip(150, BENCH - 300)};--dip:270px;${washClock}">${pipet(true)}</g>`
    : pipet(!washing && poured && S.washCount < WASH_MIN);
  /* The beaker travels to the funnel, tips, runs empty, and is set back down in its own place. It is kept out of
     the bench until after the funnel is drawn, so a tipped beaker sits in front of the bowl it is pouring into. */
  let carried = '';
  if (carrying) {
    const dur = pouring ? POUR_MIX_MS / 1000 : (RINSE_BEAKER_MS - RINSE_FILL_MS) / 1000;
    const wait = pouring ? 0 : RINSE_FILL_MS / 1000 - since(rinseBeakerAt);
    const drain = pouring
      ? { drainAnim: true, drainFrom: drainFrom(MIX), drainDelay: 0.9 - since(pourMixAt) }
      : { drainAnim: true, drainFrom: drainFrom(RINSED), drainDelay: 0.6 - since(rinseBeakerAt) + RINSE_FILL_MS / 1000 };
    /* A negative delay carries the second half of the rinse on from where the bottle left off rather than
       restarting its carry. Travel and tip share one clock. */
    const clock = `--dur:${dur}s;animation-delay:${wait}s`;
    carried = `<g class="carry" style="--dx:${400 - POSE_X}px;--dy:${BENCH - POSE_Y}px;${clock}">
      <g class="tipopen" style="--px:${PIVOT_X}px;--py:${PIVOT_Y}px;--tipdeg:${TIP}deg;${clock}">
        ${beaker(POSE_X, POSE_Y, { level: DRAWN, fill: 'url(#clearliq)', w: BEAKER_250_W, h: BH, ...drain })}
      </g>
    </g>`;
  } else {
    g += beaker(400, BENCH, {
      sh: true, level: bottleTurn ? RINSED : (poured ? 0 : MIX), fill: 'url(#milky)', w: BEAKER_250_W, h: BH,
      fillAnim: bottleTurn, fillFrom: 12 / (12 + (BH - 20) * RINSED), fillDelay: 0.62 - since(rinseBeakerAt)
    });
  }
  g += cap(400, '250-mL beaker · mixture');
  /* The wash bottle: it fills the beaker first, then stands by, and it is also what a warm wash is poured from.
     Either job takes it off its place on the bench, so only one of them draws it. */
  if (bottleTurn) {
    const clock = `--dur:${RINSE_FILL_MS / 1000}s;animation-delay:${-since(rinseBeakerAt)}s`;
    g += `<g class="carry" style="--dx:${262 - 400}px;--dy:${BENCH - 456}px;${clock}">
      <g class="tipopen" style="--px:400px;--py:296px;--tipdeg:-150deg;${clock}">
        ${bottle(400, 456, { spray: true, tipped: clock })}
      </g>
    </g>`;
    g += pourStream(400, 296, BENCH - 10,
      beakerGeo(BENCH, BH, 0), beakerGeo(BENCH, BH, RINSED), 0.62 - since(rinseBeakerAt));
  } else if (warmWash) {
    g += bottleTrip(washClock);
  } else if (wetting) {
    g += bottleTrip(wetClock, WET_SPOUT_Y);
  } else {
    g += bottle(262, BENCH, { active: poured && !S.beakerRinsed });
  }
  /* The funnel's bowl only fills once the water is arriving, so its clock starts with the stream, not the click.
     Time the pump spent off does not count either, and the paused animation holds the level it had reached: with
     nothing being drawn through, the liquid sits in the bowl instead of draining away. */
  const bowlDelay = (pouring ? POUR_STREAM_S : washing ? WASH_STREAM_S : RINSE_STREAM_S)
    - pumpSince(pouring ? pourMixAt : washing ? washAt : rinseBeakerAt);
  g += filterSetup(700, BENCH, {
    paper: S.paperWet, cake: poured ? cake : 0,
    dry: S.vacuumDry,
    level: poured ? 0.55 : 0, fillAnim: pouring, fillFrom: 0.03, fillDelay: 1.15 - since(pourMixAt),
    bowl: (pouring || beakerTurn || washing) ? 1 : 0,
    bowlDur: `${BOWL_MS / 1000}s`, bowlDelay, bowlPaused: !S.vacuum,
    air: vacDryLeft > 0 && S.vacuum, milky,
    /* Nothing is left to pull through a cake that has already drawn dry. */
    drops: S.vacuum && poured && !S.vacuumDry
  });
  g += carried;
  /* Whatever is pouring into the funnel runs its stream from the lip to the plate. It is tinted a little deeper
     than the other pours because it passes in front of the funnel's white paper. */
  const intoFunnel = (x, y, at, streamS, squirtS = 0) =>
    pourStream(x, y, PLATE, PLATE, PLATE, streamS - since(at), '#8ec4e6', squirtS);
  if (pouring) g += intoFunnel(LIP_X, LIP_Y + 6, pourMixAt, POUR_STREAM_S);
  if (beakerTurn) g += intoFunnel(LIP_X, LIP_Y + 6, rinseBeakerAt, RINSE_STREAM_S);
  if (washing) g += intoFunnel(WASH_X, WASH_Y, washAt, WASH_STREAM_S);
  if (wetting) g += intoFunnel(WASH_X, WET_SPOUT_Y, wetAt, WET_STREAM_S, WET_SQUIRT_S);
  g += vacPort(S.vacuum);
  g += cap(700, 'Büchner funnel · filter flask · vacuum pump');
  /* What the bench says about the pump: nothing draws through with the vacuum line off, and a dry cake is not left
     sitting under vacuum. They share one caption line above the funnel; the pump-off warning is only for something
     actually in flight, since at rest the panel already shows the line as off. */
  const drawing = carrying || bottleTurn || washing || vacDryLeft > 0;
  const pumpNote = !S.vacuum && drawing
          ? ['The vacuum pump is off — nothing is being drawn through the funnel', '#ffb066']
    : vacDryLeft > 0 ? ['Drawing air through the cake under vacuum', '#bfe6ff']
    : S.vacuumDry && S.vacuum ? ['The cake is dry — switch the vacuum pump off before lifting the funnel', '#ffb066']
    : null;
  if (pumpNote) g += `<text x="700" y="178" text-anchor="middle" font-size="12.5" font-weight="700" fill="${pumpNote[1]}">${pumpNote[0]}</text>`;
  g += cap(150, 'ice bath · wash water');
  return g;
}

function iceBath(x, y) {
  return `<g>
    ${beaker(x, y, { sh: true, level: 0.62, fill: 'url(#icedliq)', w: 132, h: 118, cubes: true })}
    ${beaker(x, y - 4, { level: 0.5, fill: 'url(#icedliq)', w: 62, h: 92 })}
  </g>`;
}

/* The dish goes to the balance and comes back: one clock, and the two repaints that belong to it — the one when the
   dish lands, where the pan starts reading it, and the one that sets it back down on the gauze. */
function carryDish() {
  dishAt = performance.now();
  repaintAfter(DISH_MS * DISH_LAND);
  repaintAfter(DISH_MS);
}

function sDry() {
  const now = performance.now();
  const weighing = now - dishAt < DISH_MS;   /* the dish is on its way to the pan, or on it */
  /* The balance holds the last mass it was given — the empty dish, the latest reweigh, or the final one — so a
     reading is never lost once it has been taken, drifted or not. But it reads its pan, not the log: the carry sets
     the dish down at its 30% keyframe, and until then the pan is empty and the display says so. With motion off the
     dish is pinned on the pan from the first frame, so it reads at once. */
  const last = S.finalWeigh ?? S.weigh1 ?? S.dishMass;
  const onPan = !animOn || now - dishAt >= DISH_MS * DISH_LAND;
  const shown = onPan ? last : 0;
  let g = bg();
  g += ringStand(360, BENCH);
  g += burner(360, BENCH, S.burner);
  g += balance(760, BENCH, shown != null ? `${shown.toFixed(3)} g` : '— — —');
  /* The dish is drawn once, either on the gauze or in the hand that carries it to the pan and back. On the gauze it
     sits on the ring's own plane, so the ring's front arc shows under the bowl instead of being swallowed by it. */
  const dishOpts = {
    paper: S.paperIn, paperBurnt: paperCharred(),
    fill: S.paperIn ? '#ffffff' : null
  };
  g += weighing
    ? `<g class="carry" style="--dx:${360 - 760}px;--dy:${336 - 410}px;--dur:${DISH_MS / 1000}s;animation-delay:${-since(dishAt)}s">${dish(760, 410, dishOpts)}</g>`
    : dish(360, 336, dishOpts);
  /* The burner is named in this line rather than under itself, so both captions sit on the same line as every
     other bench's. Named in full because this caption is the only place the apparatus is identified — the burner
     has no label of its own — and the lab runs a hot plate as well, so "burner" alone would not say which. */
  g += cap(360, 'ring stand · Bunsen burner · wire gauze · evaporating dish');
  g += cap(760, 'analytical balance');
  if (S.burner) g += `<text x="360" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffb066">Drying the precipitate — the filter paper burns off</text>`;
  return g;
}

function sTest() {
  const st = stoich(S.weighed.ca, S.weighed.na);
  const cloudA = dosed('a') && st.lim === 'ca' ? 0.35 + 0.65 * clamp(st.naFrac, 0, 1) : 0;
  const cloudB = dosed('b') && st.lim === 'na' ? 0.35 + 0.65 * clamp(st.caFrac, 0, 1) : 0;
  /* The two portions are drawn alike, so the droppers, the liquid surface and the drops can share one set of
     numbers: the droppers hang at DROP_Y and the filtrate sits at `surface`. */
  /* Portions of a ~100 mL filtrate, so these are drawn at the proportions a real 100-mL beaker has against the
     250-mL reaction beaker (0.71 as wide, 0.74 as tall) and filled to half their height: ~50 mL in a 100-mL beaker
     reads as half full. Drawn any larger they read as another 250-mL beaker, half full of the whole filtrate. */
  const LEVEL = 0.5, BE_W = 88, BE_H = 124, DROP_Y = BENCH - 200;
  const surface = beakerGeo(BENCH, BE_H, LEVEL);
  const dropping = k => {
    const played = since(dropAt[k]);
    return played < DROPS_MS / 1000 ? dropsInto(k === 'a' ? 320 : 640, DROP_Y, surface, played) : '';
  };
  let g = bg();
  g += beaker(320, BENCH, { sh: true, level: LEVEL, w: BE_W, h: BE_H, cloud: cloudA });
  g += beaker(640, BENCH, { sh: true, level: LEVEL, w: BE_W, h: BE_H, cloud: cloudB });
  g += dropper(320, DROP_Y, 'Ca(NO₃)₂ drops', !S.dropsA);
  g += dropper(640, DROP_Y, 'Na₃PO₄ drops', !S.dropsB);
  g += dropping('a') + dropping('b');     /* above the droppers, below the verdict they earn */
  /* A ~100 mL filtrate split in two, each half in a 100-mL beaker drawn to scale (see BE_W/BE_H). */
  g += cap(320, '100-mL beaker · filtrate portion A');
  g += cap(640, '100-mL beaker · filtrate portion B');
  if (dosed('a')) g += `<text x="320" y="${BENCH - 168}" text-anchor="middle" font-size="12" font-weight="700" fill="${cloudA ? '#dff0ff' : '#8ea2c6'}">${cloudA ? 'white precipitate' : 'no precipitate'}</text>`;
  if (dosed('b')) g += `<text x="640" y="${BENCH - 168}" text-anchor="middle" font-size="12" font-weight="700" fill="${cloudB ? '#dff0ff' : '#8ea2c6'}">${cloudB ? 'white precipitate' : 'no precipitate'}</text>`;
  return g;
}
/* ==========================================================================
   Panel renderers
   ========================================================================== */
function rail() {
  return STEPS.map((s, i) => {
    const cls = i < S.step ? 'done' : (i === S.step ? 'now' : '');
    return `<span class="pill ${cls}"><b>${i < S.step ? '✓' : i + 1}</b>${s.t}</span>`;
  }).join('');
}

function benchSummary() {
  const st = stoich(S.weighed.ca || 1, S.weighed.na || 1);
  const theo = `about ${st.theoretical.toFixed(2)} g`;
  const ca = S.weighed.ca, na = S.weighed.na;
  const state = (water, swirl) => water ? (swirl ? 'dissolved clear' : 'crystals settled in water') : 'still dry';
  const sentence = bits => {
    const s = bits.join('; ');
    return s.charAt(0).toUpperCase() + s.slice(1) + '.';
  };
  switch (S.step) {
    case 0: {
      if (ca != null && na != null) return `Recorded ${ca.toFixed(3)} g Ca(NO₃)₂·4H₂O and ${na.toFixed(3)} g Na₃PO₄·12H₂O.`;
      const k = ca == null ? 'ca' : 'na', m = S.draft[k];
      const rec = ca != null ? `Recorded ${ca.toFixed(3)} g Ca(NO₃)₂·4H₂O; ` : '';
      if (m === 0) return rec ? `${rec}${HYDRATE[k]} not weighed yet (0.000 g).` : 'Both bowls empty; the balance reads 0.000 g.';
      return `${rec}${HYDRATE[k]} on the balance: ${m.toFixed(3)} g, not recorded.`;
    }
    case 1:
      return `Ca(NO₃)₂·4H₂O ${ca.toFixed(3)} g, ${state(waterArrived('ca'), S.swirlCA)}; Na₃PO₄·12H₂O ${na.toFixed(3)} g, ${state(waterArrived('na'), S.swirlNA)}.`;
    case 2:
      if (!S.pouredCA && !S.pouredNA) return 'Beaker empty; both solutions are still in their flasks.';
      if (!(S.pouredCA && S.pouredNA)) return `The ${S.pouredCA ? 'calcium nitrate' : 'sodium phosphate'} solution is in the beaker; the other is still in its flask.`;
      return `Both solutions in the beaker (~100 mL), cloudy, ${theo} of Ca₃(PO₄)₂ precipitated; ${S.rinses}/${RINSE_MIN} rinses added${S.stirred ? ', stirred' : ''}.`;
    case 3: {
      const heat = S.heat === 'vigorous' ? 'vigorous boil, splattering'
        : S.heat === 'gentle' ? 'gentle boil'
        : S.vigorous ? 'heat off after a vigorous boil' : 'heat off';
      return `${Math.round(S.vol)} mL, ${heat}, ${theo} of precipitate settled${S.lowVol ? `, volume dipped below ${VOL_MIN} mL` : ''}.`;
    }
    case 4: {
      const bits = [];
      if (S.paperWet) bits.push('filter paper seated wet');
      bits.push(S.pouredMix ? `cake ${theo}` : 'nothing poured yet');
      if (S.pouredMix) bits.push(S.clarity === 'cloudy' ? 'filtrate cloudy, refilter it'
        : S.refilters ? 'refiltered, filtrate clear' : 'filtrate clear');
      bits.push(S.beakerRinsed ? 'beaker rinsed into the funnel' : 'beaker not rinsed');
      /* While a wash is running the summary names the tool. At the narrow width the drawn dropper and bottle are too
         small to tell apart, and the log line has already scrolled past by the time the wash is over. */
      bits.push(performance.now() - washAt < WASH_MS
        ? `washing with the ${washFromBottle ? 'wash bottle, warm water' : 'dropper, cold water'}`
        : `${S.washCount}/${WASH_MIN} washes${S.washWarm ? ', warm water from the wash bottle' : ' from the ice bath'}`);
      bits.push(`vacuum pump ${S.vacuum ? 'on' : 'off'}`);
      if (S.vacuumDry) bits.push('wash liquid drawn through');
      return sentence(bits);
    }
    case 5: {
      const a = !dosed('a') ? 'not tested' : (st.lim === 'ca' ? 'white precipitate' : 'no precipitate');
      const b = !dosed('b') ? 'not tested' : (st.lim === 'na' ? 'white precipitate' : 'no precipitate');
      return `A + Ca(NO₃)₂ drops: ${a}; B + Na₃PO₄ drops: ${b}.`;
    }
    case 6: {
      const charred = paperCharred() ? '; the filter paper is charred' : '';
      if (S.finalWeigh != null) return `Dish ${S.dishMass.toFixed(3)} g + ${S.measuredMass.toFixed(3)} g of Ca₃(PO₄)₂ = ${S.finalWeigh.toFixed(3)} g on the balance, constant to ${S.weighDelta.toFixed(3)} g${charred}.`;
      const bits = [];
      if (S.dishMass == null) bits.push('dish not weighed yet');
      else bits.push(`dish ${S.dishMass.toFixed(3)} g${S.paperIn ? ' with the filter paper and precipitate inside' : ', empty'}`);
      if (S.burner) bits.push(`over the lit burner, ${S.dryTime.toFixed(1)} min`);
      else if (S.dryTime > 0) bits.push(`heated ${S.dryTime.toFixed(1)} min, burner off`);
      if (charred) bits.push('filter paper charred');
      if (S.weigh1 != null) bits.push(`one reading ${S.weigh1.toFixed(3)} g, not constant yet`);
      bits.push('balance empty');
      return sentence(bits);
    }
  }
  return '';
}

function syncSummary() {
  const el = $('#benchSummary');
  if (el) el.textContent = benchSummary();
}

function massStrip() {
  const bits = [];
  if (S.weighed.ca != null) bits.push(`<span class="mchip">Ca(NO₃)₂·4H₂O <b>${S.weighed.ca.toFixed(3)} g</b></span>`);
  if (S.weighed.na != null) bits.push(`<span class="mchip">Na₃PO₄·12H₂O <b>${S.weighed.na.toFixed(3)} g</b></span>`);
  if (S.dishMass != null) bits.push(`<span class="mchip">dish <b>${S.dishMass.toFixed(3)} g</b></span>`);
  if (S.measuredMass != null) bits.push(`<span class="mchip">precipitate <b>${S.measuredMass.toFixed(3)} g</b></span>`);
  return bits.join('');
}

function logBlock() {
  if (!S.log.length) return '';
  const items = S.log.slice(0, 6).map(t => `<li>${t}</li>`).join('');
  return `<div class="log"><h4>Bench log</h4><ol>${items}</ol></div>`;
}

function sliderBlock(key, label, mm) {
  const v = S.draft[key];
  const hint = v === 0 ? 'Bowl is empty — tap + or drag the slider to add reagent.'
    : v < MASS_MIN ? `Below ${MASS_MIN.toFixed(3)} g — add more reagent.`
    : v > MASS_MAX ? `Over ${MASS_MAX.toFixed(3)} g — pour some back.`
    : 'Use − / + for 0.001 g steps.';
  return `<div class="slider">
    <div class="lab"><span>${label}</span><span>M = <b>${mm}</b> g/mol</span></div>
    <div class="steprow">
      <button class="stepbtn" data-act="bump" data-val="${key}:-0.001" aria-label="Remove 0.001 g">−</button>
      <input type="range" min="0" max="${DRAFT_MAX.toFixed(3)}" step="0.001" value="${S.draft[key].toFixed(3)}" data-range="${key}" aria-label="${label}">
      <button class="stepbtn" data-act="bump" data-val="${key}:0.001" aria-label="Add 0.001 g">+</button>
    </div>
    <div class="lab" style="margin:8px 0 0"><span class="small">Balance reading</span><b id="draftRead">${S.draft[key].toFixed(3)} g</b></div>
    <p class="small" style="margin:6px 0 0">${hint}</p>
  </div>`;
}

function panel() {
  switch (S.step) {
    case 0: return pWeigh();
    case 1: return pDissolve();
    case 2: return pMix();
    case 3: return pDigest();
    case 4: return pFilter();
    case 5: return pTest();
    case 6: return pDry();
  }
  return '';
}

function pWeigh() {
  const active = !S.weighed.ca ? 'ca' : (!S.weighed.na ? 'na' : null);
  let h = `<p class="instr">Weigh out <b>about 1.000 g</b> of each solid, as the handout's procedure asks — the balance accepts <b>${MASS_MIN.toFixed(3)}–${MASS_MAX.toFixed(3)} g</b>. The jars hold the <b>hydrates</b>, so the molar masses below are the tetrahydrate and the dodecahydrate. Both bowls start empty at <b>0.000 g</b>: drag the slider, then record the exact mass.</p>${motionNote()}`;

  h += `<div class="task ${S.weighed.ca != null ? 'done' : (active === 'ca' ? 'active' : '')}">
    <div class="taskhead"><span>① Ca(NO₃)₂·4H₂O</span>${S.weighed.ca != null ? '<span class="checkmark">✓</span>' : ''}</div>`;
  if (S.weighed.ca != null) {
    h += `<p class="small" style="margin:0">Recorded: <b style="color:var(--txt)">${S.weighed.ca.toFixed(3)} g</b> · ${sci(S.weighed.ca / M.ca)} mol</p>`;
  } else {
    h += sliderBlock('ca', 'Weigh out calcium nitrate', '236.15');
    h += `<div class="row"><button class="btn primary" data-act="record" ${inBand(S.draft.ca) ? '' : 'disabled'}>Record mass</button></div>`;
  }
  h += `</div>`;

  h += `<div class="task ${S.weighed.na != null ? 'done' : (active === 'na' ? 'active' : '')}">
    <div class="taskhead"><span>② Na₃PO₄·12H₂O</span>${S.weighed.na != null ? '<span class="checkmark">✓</span>' : ''}</div>`;
  if (S.weighed.na != null) {
    h += `<p class="small" style="margin:0">Recorded: <b style="color:var(--txt)">${S.weighed.na.toFixed(3)} g</b> · ${sci(S.weighed.na / M.na)} mol</p>`;
  } else if (active === 'na') {
    h += sliderBlock('na', 'Weigh out sodium phosphate', '380.12');
    h += `<div class="row"><button class="btn primary" data-act="record" ${inBand(S.draft.na) ? '' : 'disabled'}>Record mass</button></div>
    <p class="small" style="margin:8px 0 0">Use a fresh weighing bowl — the first one is not reused.</p>`;
  } else {
    h += `<p class="small" style="margin:0">Weigh the first reagent to unlock.</p>`;
  }
  h += `</div>`;
  return h + logBlock();
}

function pDissolve() {
  /* The button locks when it is pressed, so a second portion cannot be queued; everything the card reports — the tick,
     the done state, the checked step — waits for the water to arrive. */
  const card = (key, title, pressed, swirl) => {
    const arrived = waterArrived(key);
    return `
  <div class="task ${arrived && swirl ? 'done' : 'active'}">
    <div class="taskhead"><span>${title}</span>${arrived && swirl ? '<span class="checkmark">✓</span>' : ''}</div>
    <ul class="checks">
      <li class="${arrived ? 'done' : ''}">50 mL D.I. water added</li>
      <li class="${swirl ? 'done' : ''}">Swirled until the crystals dissolved</li>
    </ul>
    <div class="row">
      <button class="btn" data-act="water" data-val="${key}" ${pressed ? 'disabled' : ''}>Add 50 mL water</button>
      <button class="btn" data-act="swirl" data-val="${key}" ${!pressed || swirl ? 'disabled' : ''}>Swirl flask</button>
    </div>
  </div>`;
  };
  return `<p class="instr">Transfer each solid to its own <b>125-mL Erlenmeyer flask</b>, wash the crystals in with D.I. water, and swirl until the solution is clear.</p>${motionNote()}
  ${card('ca', 'Ca(NO₃)₂ solution', S.waterCA, S.swirlCA)}
  ${card('na', 'Na₃PO₄ solution', S.waterNA, S.swirlNA)}
  ${logBlock()}`;
}

function pMix() {
  const ready = S.pouredCA && S.pouredNA;
  return `<p class="instr">Pour both solutions into the <b>250-mL beaker</b>. The white Ca₃(PO₄)₂ begins to precipitate at once. Rinse the flasks into the beaker in ${RINSE_MIN} portions so no product is left behind, then stir with the glass rod.</p>${motionNote()}
  <div class="task ${S.pouredCA ? 'done' : 'active'}">
    <div class="taskhead"><span>Pour the Ca(NO₃)₂ solution</span>${S.pouredCA ? '<span class="checkmark">✓</span>' : ''}</div>
    <button class="btn ${S.pouredCA ? '' : 'primary'}" data-act="pour" data-val="ca" ${S.pouredCA ? 'disabled' : ''}>Pour into the beaker</button>
  </div>
  <div class="task ${S.pouredNA ? 'done' : 'active'}">
    <div class="taskhead"><span>Pour the Na₃PO₄ solution</span>${S.pouredNA ? '<span class="checkmark">✓</span>' : ''}</div>
    <button class="btn ${S.pouredNA ? '' : 'primary'}" data-act="pour" data-val="na" ${S.pouredNA ? 'disabled' : ''}>Pour into the beaker</button>
  </div>
  <div class="task ${S.rinses >= RINSE_MIN && S.stirred ? 'done' : 'active'}">
    <div class="taskhead"><span>Rinse and stir</span><span class="tag">${S.rinses}/${RINSE_MIN} rinses</span></div>
    <div class="row">
      <button class="btn" data-act="rinse" ${!ready || S.rinses >= RINSE_MIN ? 'disabled' : ''}>Rinse the flasks</button>
      <button class="btn" data-act="stir" ${!ready ? 'disabled' : ''}>${S.stirred ? 'Stir again' : 'Stir with rod'}</button>
    </div>
  </div>
  ${logBlock()}`;
}

function pDigest() {
  const pct = clamp(S.boilTime / DIGEST_MIN * 100, 0, 100);
  return `<p class="instr">Heat the mixture on the hot plate. A <b>gentle</b> boil for ${DIGEST_MIN} minutes builds larger, filterable crystals. Vigorous boiling throws product out and makes fines that pass the filter paper.</p>${motionNote()}
  <div class="clock"><span id="boilClock">${S.boilTime.toFixed(1)}</span><small>/ ${DIGEST_MIN.toFixed(1)} min digested</small></div>
  <div class="bar warm"><i id="boilBar" style="width:${pct}%"></i></div>
  <p class="vol ${S.vol < VOL_MIN ? 'warn' : ''}">Solution volume: <b id="boilVol">${S.vol.toFixed(0)}</b> mL <span class="small">(keep above ${VOL_MIN} mL)</span></p>
  <div class="row tight" style="margin-bottom:9px">
    <button class="btn ${S.heat === 'off' ? 'on' : ''}" data-act="heat" data-val="off">Heat off</button>
    <button class="btn ${S.heat === 'gentle' ? 'on' : ''}" data-act="heat" data-val="gentle">Gentle</button>
    <button class="btn ${S.heat === 'vigorous' ? 'on' : ''}" data-act="heat" data-val="vigorous">Vigorous</button>
  </div>
  <button class="btn" data-act="topup" style="width:100%" ${S.vol > 145 ? 'disabled' : ''}>Replenish 25 mL D.I. water</button>
  <ul class="checks" style="margin-top:10px">
    <li class="${S.boilTime >= DIGEST_MIN ? 'done' : ''}">Digested ${DIGEST_MIN} min</li>
    <li class="${!S.lowVol ? 'done' : ''}">Volume never fell below ${VOL_MIN} mL</li>
    <li class="${S.heat === 'off' ? 'done' : ''}">Heat turned off before removing the beaker</li>
  </ul>
  ${logBlock()}`;
}

function pFilter() {
  const cleared = S.clarity === 'clear' || S.refilters > 0;
  return `<p class="instr">Seat the filter paper in the Büchner funnel with a little D.I. water, start the vacuum pump, then decant the mixture through it. Rinse the beaker out into the funnel so the last of the solid follows, then wash the cake with <b>cold</b> water — warm water dissolves a little of the precipitate.</p>${motionNote()}
  <div class="task ${S.paperWet ? 'done' : 'active'}">
    <div class="taskhead"><span>Seat the filter paper</span>${S.paperWet ? '<span class="checkmark">✓</span>' : ''}</div>
    <button class="btn ${S.paperWet ? '' : 'primary'}" data-act="wetpaper" style="width:100%" ${S.paperWet ? 'disabled' : ''}>Wet the filter paper</button>
  </div>
  <div class="task ${S.vacuumDry && S.vacuum ? 'active' : S.vacuum ? 'done' : 'active'}">
    <div class="taskhead"><span>Vacuum pump</span><span class="tag">${S.vacuum ? 'on' : 'off'}</span></div>
    <button class="btn ${S.vacuumDry && S.vacuum ? 'warm' : ''}" data-act="vacuum" style="width:100%">${S.vacuum ? 'Turn the vacuum pump off' : 'Turn the vacuum pump on'}</button>
  </div>
  <div class="task ${S.pouredMix ? 'done' : 'active'}">
    <div class="taskhead"><span>Pour the mixture through</span>${S.pouredMix ? '<span class="checkmark">✓</span>' : ''}</div>
    <button class="btn ${S.pouredMix ? '' : 'primary'}" data-act="pourmix" style="width:100%" ${!S.paperWet || !S.vacuum || S.pouredMix ? 'disabled' : ''}>Pour into the funnel</button>
    ${S.pouredMix && !cleared ? `<div class="obs cloudy">The filtrate is still cloudy — fine particles are passing through. Refilter it.</div>` : ''}
    ${S.pouredMix && cleared ? `<div class="obs clear">Filtrate is clear and colourless.</div>` : ''}
  </div>
  ${S.pouredMix && !cleared ? `<button class="btn" data-act="refilter" style="width:100%;margin-bottom:9px">Pour the filtrate back and refilter</button>` : ''}
  <div class="task ${S.beakerRinsed ? 'done' : 'active'}">
    <div class="taskhead"><span>Rinse the beaker into the funnel</span>${S.beakerRinsed ? '<span class="checkmark">✓</span>' : ''}</div>
    <button class="btn ${S.beakerRinsed ? '' : 'primary'}" data-act="rinsebeaker" style="width:100%" ${!S.pouredMix || !S.vacuum || S.beakerRinsed ? 'disabled' : ''}>Rinse it out with the wash bottle</button>
    ${S.pouredMix && !S.vacuum && !S.beakerRinsed ? `<p class="small" style="margin:6px 0 0;color:var(--warnink)">Switch the vacuum pump on — a rinse would only sit in the funnel.</p>` : ''}
  </div>
  <div class="task ${S.washCount >= WASH_MIN ? 'done' : 'active'}">
    <div class="taskhead"><span>Wash the precipitate</span><span class="tag">${S.washCount}/${WASH_MIN} portions${S.washWarm ? ' · warm' : ''}</span></div>
    <div class="row">
      <button class="btn primary" data-act="wash" data-val="cold" ${!S.pouredMix || !S.vacuum || S.washCount >= WASH_MIN ? 'disabled' : ''}>Cold water</button>
      <button class="btn" data-act="wash" data-val="warm" ${!S.pouredMix || !S.vacuum || S.washCount >= WASH_MIN ? 'disabled' : ''}>Warm water</button>
    </div>
    <p class="small" style="margin:6px 0 0">Cold water keeps Ca₃(PO₄)₂ insoluble; warm water washes the NaNO₃ out faster but dissolves some product with it. A skipped wash leaves the NaNO₃ in the cake, where it weighs as extra product.</p>
    ${!S.vacuum ? `<p class="small" style="margin:4px 0 0;color:var(--warnink)">Switch the vacuum pump on — a wash only draws through with it running.</p>` : ''}
  </div>
  <div class="task ${S.vacuumDry ? 'done' : 'active'}">
    <div class="taskhead"><span>Draw air through the cake</span>${S.vacuumDry ? '<span class="checkmark">✓</span>' : ''}</div>
    ${vacDryLeft > 0
      ? `<div class="clock"><span id="vacDryClock">${mmss(vacDryLeft)}</span><small>left of ${VACDRY_MIN}:00 on the vacuum pump</small></div>
        <div class="bar"><i id="vacDryBar" style="width:${(100 * (1 - vacDryLeft / VACDRY_MIN)).toFixed(0)}%"></i></div>`
      : `<button class="btn" data-act="vacdry" style="width:100%" ${!S.pouredMix || !S.vacuum || S.vacuumDry ? 'disabled' : ''}>Run the vacuum pump 2 min</button>
        ${S.pouredMix && !S.vacuum && !S.vacuumDry ? `<p class="small" style="margin:6px 0 0">Switch the vacuum pump on to draw air through the cake.</p>` : ''}`}
  </div>
  ${S.vacuumDry && S.vacuum ? `<p class="small" style="margin:8px 0 0;color:var(--warnink)">The cake is dry — switch the vacuum pump off before you lift the funnel off the filter flask.</p>` : ''}
  ${logBlock()}`;
}

function pDry() {
  const needRedry = S.weigh1 != null && S.dryTime < S.weighDry + REDRY_MIN;
  const charred = paperCharred();
  let h = `<p class="instr">Weigh the clean evaporating dish, transfer the filter paper into it, then dry it over the burner. The ashless filter paper burns away cleanly and leaves only Ca₃(PO₄)₂ — but only if you stop at about ${DRY_MIN} min. Past ${CHAR_MIN} min the filter paper chars and the carbon it leaves is weighed as if it were product. Weigh the cooled dish, then heat it again and reweigh: a solid that is still damp reads heavy, and the reweigh is what catches it.</p>`;
  h += `<div class="task ${S.dishMass != null ? 'done' : 'active'}">
    <div class="taskhead"><span>Weigh the evaporating dish</span>${S.dishMass != null ? '<span class="checkmark">✓</span>' : ''}</div>
    ${S.dishMass != null
      ? `<p class="small" style="margin:0">Empty dish: <b style="color:var(--txt)">${S.dishMass.toFixed(3)} g</b></p>`
      : `<button class="btn primary" data-act="weighdish" style="width:100%">Place it on the balance</button>`}
  </div>`;
  h += `<div class="task ${S.paperIn ? 'done' : 'active'}">
    <div class="taskhead"><span>Transfer the filter paper</span>${S.paperIn ? '<span class="checkmark">✓</span>' : ''}</div>
    <button class="btn ${S.paperIn ? '' : 'primary'}" data-act="transfer" style="width:100%" ${S.dishMass == null || S.paperIn ? 'disabled' : ''}>Move it in with a spatula</button>
  </div>`;
  h += `<div class="task ${S.dryTime >= DRY_MIN ? 'done' : 'active'}" id="dryTask">
    <div class="taskhead"><span>Dry over the burner</span><span class="tag" id="dryClock">${S.dryTime.toFixed(1)} / ${DRY_MIN.toFixed(1)} min</span></div>
    <div class="bar"><i id="dryBar" style="width:${clamp(S.dryTime / DRY_MIN * 100, 0, 100)}%"></i></div>
    <div class="row">
      <button class="btn ${S.burner ? 'warm' : ''}" data-act="burner" ${!S.paperIn ? 'disabled' : ''}>${S.burner ? 'Turn the burner off' : 'Light the burner'}</button>
      <button class="btn primary" data-act="weighfinal" ${S.burner || !S.paperIn || needRedry ? 'disabled' : ''}>Cool &amp; weigh</button>
    </div>
    ${S.weigh1 != null && S.finalWeigh == null ? `<p class="small" style="margin:6px 0 0">Last reading <b style="color:var(--txt)">${S.weigh1.toFixed(3)} g</b>. ${needRedry ? `Heat it again for at least ${REDRY_MIN} min, then weigh.` : 'Weigh again.'} Two readings within ${WEIGH_TOL} g mean constant mass.</p>` : ''}
    ${charred ? `<div class="obs cloudy">The filter paper has charred — carbon stays with the solid, and each reweigh drifts. This dish will never reach constant mass.</div>` : ''}
    ${charred && S.charWeighs >= 2 && S.finalWeigh == null ? `<button class="btn" data-act="weighcharred" style="width:100%;margin-top:8px">Record the mass anyway — the determination is compromised</button>` : ''}
  </div>`;
  if (S.finalWeigh != null) {
    h += `<div class="task done"><div class="taskhead"><span>Final weighing</span><span class="checkmark">✓</span></div>
      <p class="small" style="margin:0">Dish + precipitate: <b style="color:var(--txt)">${S.finalWeigh.toFixed(3)} g</b><br>
      Precipitate: <b style="color:var(--txt)">${S.measuredMass.toFixed(3)} g</b><br>
      Constant mass: ${constMass()}</p></div>`;
  }
  return h + logBlock();
}

function pTest() {
  const st = stoich(S.weighed.ca || 1, S.weighed.na || 1);
  /* A card's button locks as the drops leave, so a second dose cannot queue behind the first; everything the card
     reports — the tick, the observation — waits for the last drop to land, which is where the bench is too. */
  const obsA = dosed('a') ? (st.lim === 'ca'
    ? 'White precipitate forms — phosphate was still in the filtrate.'
    : 'No precipitate — no phosphate was left to react with the added calcium.') : null;
  const obsB = dosed('b') ? (st.lim === 'na'
    ? 'White precipitate forms — calcium was still in the filtrate.'
    : 'No precipitate — no calcium was left to react with the added phosphate.') : null;
  return `<p class="instr">Split the filtrate into two portions. Add 5 drops of Ca(NO₃)₂ to one and 5 drops of Na₃PO₄ to the other. A white precipitate means the ion you added was <i>not</i> the one left over. This is the check that precipitation went to completion — best run before the solid is dried.</p>${motionNote()}
  <div class="task ${dosed('a') ? 'done' : 'active'}">
    <div class="taskhead"><span>Portion A + Ca(NO₃)₂</span>${dosed('a') ? '<span class="checkmark">✓</span>' : ''}</div>
    <button class="btn primary" data-act="drops" data-val="a" style="width:100%" ${S.dropsA ? 'disabled' : ''}>Add 5 drops</button>
    ${obsA ? `<div class="obs ${st.lim === 'ca' ? 'cloudy' : 'clear'}">${obsA}</div>` : ''}
  </div>
  <div class="task ${dosed('b') ? 'done' : 'active'}">
    <div class="taskhead"><span>Portion B + Na₃PO₄</span>${dosed('b') ? '<span class="checkmark">✓</span>' : ''}</div>
    <button class="btn primary" data-act="drops" data-val="b" style="width:100%" ${S.dropsB ? 'disabled' : ''}>Add 5 drops</button>
    ${obsB ? `<div class="obs ${st.lim === 'na' ? 'cloudy' : 'clear'}">${obsB}</div>` : ''}
  </div>
  ${LITE ? '' : `<div class="task ${S.answer ? 'done' : 'active'}">
    <div class="taskhead"><span>Which reagent was in excess?</span></div>
    <div class="row">
      <button class="btn ${S.answer === 'ca' ? 'on' : ''}" data-act="answer" data-val="ca" ${!dosed('a') || !dosed('b') ? 'disabled' : ''}>Ca(NO₃)₂·4H₂O</button>
      <button class="btn ${S.answer === 'na' ? 'on' : ''}" data-act="answer" data-val="na" ${!dosed('a') || !dosed('b') ? 'disabled' : ''}>Na₃PO₄·12H₂O</button>
    </div>
    ${S.answer ? `<p class="small" style="margin:8px 0 0">Your answer: <b style="color:var(--txt)">${S.answer === 'ca' ? 'Ca(NO₃)₂·4H₂O in excess' : 'Na₃PO₄·12H₂O in excess'}</b></p>` : ''}
  </div>`}
  ${logBlock()}`;
}
/* ==========================================================================
   Interaction
   ========================================================================== */
function gate() {
  switch (S.step) {
    case 0: return S.weighed.ca != null && S.weighed.na != null;
    case 1: return waterArrived('ca') && S.swirlCA && waterArrived('na') && S.swirlNA;
    case 2: return S.pouredCA && S.pouredNA && S.rinses >= RINSE_MIN && S.stirred;
    case 3: return S.heat === 'off';
    /* A cake still under vacuum cannot be lifted, so the pump has to be off before this step is done. The washes
       are a choice, not a gate: skipping one leaves NaNO₃ in the solid and comes back as extra weighed mass, and
       warm water pays for itself the same way. */
    case 4: return S.paperWet && S.pouredMix && S.vacuumDry && !S.vacuum
      && (S.clarity === 'clear' || S.refilters > 0);
    case 5: return dosed('a') && dosed('b') && (LITE || !!S.answer);
    case 6: return S.finalWeigh != null;
  }
  return false;
}

/* What the filtration step is still waiting for, in the order the panel lists it, so a reader who has finished every
   task can see why Continue is still off. */
function filterMissing() {
  if (!S.paperWet) return 'Wet the filter paper so it seats on the funnel.';
  if (!S.pouredMix) return S.vacuum ? 'Pour the mixture into the funnel.' : 'Turn the vacuum pump on, then pour the mixture into the funnel.';
  if (!(S.clarity === 'clear' || S.refilters > 0)) return 'The filtrate is cloudy — pour it back and refilter it.';
  if (!S.vacuumDry) return S.vacuum ? 'Run the vacuum pump 2 min to draw the cake dry.' : 'Turn the vacuum pump on, then run it 2 min to draw the cake dry.';
  if (S.vacuum) return 'The cake is dry — turn the vacuum pump off to finish this step.';
  return '';
}

function updateGate() {
  const b = $('#btnNext');
  if (!b) return;
  const ok = gate();
  b.disabled = !ok;
  b.textContent = S.step === STEPS.length - 1 ? (LITE ? 'Finish →' : 'See results →') : 'Continue →';
  const hint = $('#gateHint');
  if (hint) hint.textContent = ok ? '' : (S.step === 4 && filterMissing()) || STEPS[S.step].hint;
}

function render() {
  if (!$('#scene')) return;
  redrawScene();
  $('#sceneTag').textContent = STEPS[S.step].tag;
  $('#stepRail').innerHTML = rail();
  $('#massStrip').innerHTML = massStrip();
  $('#stepLabel').textContent = `Step ${S.step + 1} of ${STEPS.length}`;
  $('#panelTitle').textContent = STEPS[S.step].t;
  $('#panelBody').innerHTML = panel();
  updateGate();
}

/* The bench alone, for repaints that must leave the step panel standing: the weigh slider is dragged, and
   replacing the input would end the drag. A full render paints the bench through here. */
function redrawScene() {
  _uid = 0;
  const sc = $('#scene');
  if (sc) sc.innerHTML = defs() + scene();
  const legend = $('.caplegend');
  if (legend && sc) legend.textContent = [...sc.querySelectorAll('text.cap')].map(t => t.textContent).join(' / ');
  syncSummary();
}

function setDraft(k, v) {
  const before = S.draft[k];
  S.draft[k] = clamp(Math.round(+v * 1000) / 1000, 0, DRAFT_MAX);
  /* Reagent going back in never sprinkles; only mass added to the bowl does. */
  if (S.draft[k] > before) {
    sprinkleAt = performance.now();
    clearTimeout(sprinkleTimer);           /* one repaint, once the drag settles */
    sprinkleTimer = repaintAfter(SPRINKLE_MS, redrawScene);
  }
  const d = $('#draftRead');
  if (d) d.textContent = S.draft[k].toFixed(3) + ' g';
  const sl = document.querySelector(`#panelBody input[data-range="${k}"]`);
  if (sl) sl.value = S.draft[k].toFixed(3);
  const rec = document.querySelector('#panelBody [data-act="record"]');
  if (rec) rec.disabled = !inBand(S.draft[k]);
  redrawScene();
}

function doAct(act, val) {
  switch (act) {
    case 'record': {
      const k = S.weighed.ca == null ? 'ca' : 'na';
      if (!inBand(S.draft[k])) {
        toast(`Weigh between ${MASS_MIN.toFixed(3)} and ${MASS_MAX.toFixed(3)} g.`);
        return;
      }
      S.weighed[k] = Math.round(S.draft[k] * 1000) / 1000;
      sprinkleAt = -1e9;   /* recording is not adding: the next bowl starts quiet */
      log(`Weighed ${S.weighed[k].toFixed(3)} g of ${HYDRATE[k]}.`);
      if (k === 'ca') S.draft.na = 0;
      break;
    }
    case 'bump': {
      const parts = String(val).split(':');
      setDraft(parts[0], S.draft[parts[0]] + Number(parts[1]));
      return;
    }
    case 'water': {
      if (val === 'ca') S.waterCA = true; else S.waterNA = true;
      const at = pourAt[val] = performance.now();
      waterLands(val, at);                 /* the log line and the panel follow the water in */
      repaintAfter(WATER_POUR_MS);         /* the jug and its stream are taken away again */
      break;
    }
    case 'swirl':
      if (val === 'ca') S.swirlCA = true; else S.swirlNA = true;
      swirlAt[val] = performance.now();
      repaintAfter(STIR_MS);               /* the ring stops once the flask has settled */
      log('Swirled the flask until the solution was clear.');
      break;
    case 'pour':
      if (val === 'ca') S.pouredCA = true; else S.pouredNA = true;
      mixPourAt[val] = performance.now();
      repaintAfter(MIX_POUR_MS);
      log('Poured the solution into the 250-mL beaker.');
      if (S.pouredCA && S.pouredNA) {
        log('White Ca₃(PO₄)₂ precipitates; the mixture turns cloudy.');
        toast('Precipitate forms — the mixture turns cloudy');
      }
      break;
    case 'rinse': {
      S.rinses = Math.min(RINSE_MIN, S.rinses + 1);
      S.vol += 6;
      /* The portion waits until its flask has landed from its own pour and the portion before it has finished,
         so neither that pour nor the earlier rinse is cut short. */
      /* Portions go into the flasks in turn: the first the calcium flask, the second the sodium one. */
      const k = S.rinses === 1 ? 'ca' : 'na', clicked = performance.now();
      const start = Math.max(clicked, rinseEndsAt(), mixPourAt[k] + MIX_POUR_MS);
      rinseQueue.push({ k, at: start });
      if (start > clicked) setTimeout(render, start - clicked + 40);   /* the bench hands over */
      repaintAfter(start - clicked + RINSE_SPRAY);   /* the bottle is taken away, leaving the flask tipped */
      repaintAfter(start - clicked + RINSE_MS);
      log(`Rinsed the ${HYDRATE[k]} flask into the beaker (rinse ${S.rinses} of ${RINSE_MIN}).`);
      break;
    }
    case 'stir':
      stirAt = performance.now();          /* re-stirring only replays the rod, so the log keeps one entry */
      if (!S.stirred) {
        S.stirred = true;
        log('Stirred the mixture with the glass rod.');
      }
      repaintAfter(STIR_MS);               /* the rod settles back into the flask */
      break;
    case 'heat':
      S.heat = val;
      if (val !== 'off') {
        if (val === 'vigorous') S.vigorous = true;
        log(val === 'gentle' ? 'Hot plate set to a gentle boil.' : 'Hot plate set to a vigorous boil — the mixture is splattering.');
        ensureBoil();
      } else {
        log('Turned the heat off.');
      }
      break;
    case 'topup':
      topupLvlFrom = digestLvl();
      S.vol = Math.min(160, S.vol + 25);
      topupAt = performance.now();
      repaintAfter(TOPUP_MS);             /* the carried bottle is put back when the run is over */
      log('Replenished the beaker with 25 mL D.I. water.');
      break;
    case 'wetpaper':
      wetAt = performance.now();
      repaintAfter(WET_MS);
      wetLands(wetAt);
      break;
    case 'vacuum':
      S.vacuum = !S.vacuum;
      if (S.vacuum) { if (pumpOffAt) { pumpStall += performance.now() - pumpOffAt; pumpOffAt = 0; } }
      else if (!pumpOffAt) pumpOffAt = performance.now();
      log(S.vacuum ? 'Vacuum pump on.' : 'Vacuum pump off.');
      if (!S.vacuum && vacDryLeft > 0 && S.pouredMix) {
        /* A hold still running is ended by the pump going off: the cake is as dry as that run left it. */
        clearInterval(vacTimer); vacTimer = null;
        vacDryLeft = 0; S.vacuumDry = true;
        log('Stopped the pump during the air hold; the cake has drawn as dry as it will.');
      }
      break;
    case 'pourmix':
      S.pouredMix = true;
      pumpStall = 0; pumpOffAt = 0;
      pourMixAt = performance.now();
      repaintAfter(POUR_MIX_MS);
      S.clarity = S.boilTime >= DIGEST_MIN && !S.vigorous ? 'clear' : 'cloudy';
      log(S.clarity === 'clear'
        ? 'Decanted the mixture through the funnel; the filtrate runs clear.'
        : `Decanted the mixture; the filtrate is still cloudy because ${S.vigorous ? 'the vigorous boil threw fines through the filter paper' : 'the precipitate was not digested'}.`);
      break;
    case 'refilter':
      S.refilters++;
      S.clarity = 'clear';
      log('Returned the cloudy filtrate to the beaker and filtered again — it now runs clear.');
      break;
    case 'wash':
      if (!S.vacuum) { toast('The vacuum pump is off — a wash would not draw through the cake.'); return; }
      S.washCount = Math.min(WASH_MIN, S.washCount + 1);
      pumpStall = 0; pumpOffAt = 0;
      washAt = performance.now();
      washFromBottle = val === 'warm';   /* warm water comes from the bottle, cold from the pipet */
      repaintAfter(WASH_MS);
      if (val === 'warm') S.washWarm = true;
      log(val === 'warm'
        ? 'Washed the precipitate with warm D.I. water — some product dissolved with the NaNO₃.'
        : 'Washed the precipitate with cold D.I. water from the dropper.');
      break;
    case 'rinsebeaker':
      if (!S.vacuum) { toast('The vacuum pump is off — the rinse would only sit in the funnel.'); return; }
      S.beakerRinsed = true;
      pumpStall = 0; pumpOffAt = 0;
      rinseBeakerAt = performance.now();
      repaintAfter(RINSE_FILL_MS);        /* the handover: the bottle is done and the beaker takes the bench */
      repaintAfter(RINSE_BEAKER_MS);
      log('Rinsed the beaker into the funnel so the last of the solid followed it.');
      break;
    case 'vacdry':
      if (!S.vacuum) { toast('The vacuum pump is off — switch it on and run it again.'); return; }
      vacDryLeft = VACDRY_MIN;
      ensureVac();
      log('Ran the vacuum pump for 2 min; air is drawn through the cake until the wash liquid is gone.');
      break;
    case 'weighdish':
      S.dishMass = Math.round((41 + Math.random() * 6) * 1000) / 1000;
      carryDish();
      log(`Mass of the empty evaporating dish: ${S.dishMass.toFixed(3)} g.`);
      break;
    case 'transfer':
      S.paperIn = true;
      log('Transferred the filter paper and precipitate into the dish.');
      break;
    case 'burner':
      S.burner = !S.burner;
      if (S.burner) ensureDry();
      log(S.burner ? 'Lit the burner and began drying the precipitate.' : 'Turned the burner off and let the dish cool.');
      break;
    case 'weighfinal': {
      carryDish();
      if (S.scatter == null) S.scatter = (Math.random() * 2 - 1) * SCATTER;
      const charred = paperCharred();
      /* A charred paper sheds soot, so each reading sits higher than the last and the dish never
         settles: constant mass is never certified, and the run can only be closed by recording the
         mass as compromised, which is what the sheet then shows. The soot accumulates from the
         reweigh count, so the first reading is still the honest one. */
      const soot = charred ? CHAR_DRIFT * (S.charWeighs || 0) : 0;
      const reading = Math.round((S.dishMass + trial().measured + soot + (Math.random() - 0.5) * READ_NOISE) * 1000) / 1000;
      if (charred) {
        S.charWeighs = (S.charWeighs || 0) + 1;
        if (S.charFirst == null) S.charFirst = S.weigh1 != null ? S.weigh1 : reading;
        S.weigh1 = reading; S.weighDry = S.dryTime;
        log(`Reweighed: ${reading.toFixed(3)} g — still drifting, the charred paper will not settle.`);
        toast('Still drifting — a charred paper cannot reach constant mass');
        break;
      }
      if (S.weigh1 == null) {
        S.weigh1 = reading; S.weighDry = S.dryTime;
        log(`Weighed the cooled dish: ${reading.toFixed(3)} g. Heat it again and reweigh.`);
      } else if (Math.abs(reading - S.weigh1) > WEIGH_TOL || S.dryTime < DRY_MIN) {
        S.weigh1 = reading; S.weighDry = S.dryTime;
        log(`Reweighed: ${reading.toFixed(3)} g — ${S.dryTime < DRY_MIN ? 'still damp' : 'still drifting'}, so not constant yet.`);
      } else {
        S.weighDelta = Math.abs(reading - S.weigh1);
        S.finalWeigh = reading;
        S.measuredMass = Math.round((S.finalWeigh - S.dishMass) * 1000) / 1000;
        log(`Constant mass: ${S.weigh1.toFixed(3)} g and ${reading.toFixed(3)} g agree within ${WEIGH_TOL} g → precipitate ${S.measuredMass.toFixed(3)} g.`);
      }
      break;
    }
    case 'weighcharred': {
      if ((S.charWeighs || 0) < 2) { toast('Weigh it a second time — you have not seen it drift yet.'); return; }
      carryDish();
      /* The sheet prints the pair that was actually compared: the first reading and the last. */
      const last = S.weigh1;
      S.weigh1 = S.charFirst;
      S.finalWeigh = last;
      S.weighDelta = last - S.charFirst;
      S.measuredMass = Math.round((S.finalWeigh - S.dishMass) * 1000) / 1000;
      log(`Recorded ${S.finalWeigh.toFixed(3)} g anyway — the charred paper never reached constant mass, so the weighing is compromised.`);
      break;
    }
    case 'drops':
      if (val === 'a') S.dropsA = true; else S.dropsB = true;
      dropAt[val] = performance.now();
      repaintAfter(DROPS_MS);             /* take the falling drops away once the last one has landed */
      log(val === 'a'
        ? 'Added 5 drops of Ca(NO₃)₂ solution to filtrate portion A.'
        : 'Added 5 drops of Na₃PO₄ solution to filtrate portion B.');
      break;
    case 'answer':
      S.answer = val;
      log('Recorded the excess reagent indicated by the filtrate tests.');
      break;
  }
  render();
}

/* ---------- timers ---------- */
let boilTimer = null, dryTimer = null, vacTimer = null;

/* The pump hold runs its own 2 min countdown, on the panel's clock as well as on the bench. */
const mmss = m => `${Math.floor(m)}:${String(Math.round((m - Math.floor(m)) * 60)).padStart(2, '0')}`;
function ensureVac() {
  if (vacTimer) return;
  vacTimer = setInterval(() => {
    if (!S.vacuum) return;            /* the countdown waits while the pump is off */
    vacDryLeft = Math.max(0, +(vacDryLeft - 0.1).toFixed(1));
    const c = $('#vacDryClock');
    if (c) c.textContent = mmss(vacDryLeft);
    const b = $('#vacDryBar');
    if (b) b.style.width = (100 * (1 - vacDryLeft / VACDRY_MIN)).toFixed(0) + '%';
    if (vacDryLeft <= 0) {
      clearInterval(vacTimer); vacTimer = null;
      S.vacuumDry = true;      /* the cake is dry, and the step closes */
      log('The cake has drawn dry — cracked and matte on the filter paper.');
      render();
    }
  }, VAC_TICK);
}

function ensureBoil() {
  if (boilTimer) return;
  boilTimer = setInterval(() => {
    if (S.heat === 'off') return;
    S.boilTime += 0.1;
    S.vol -= (S.heat === 'gentle' ? 2.8 : 6.4) * 0.1;
    S.minVol = S.minVol == null ? S.vol : Math.min(S.minVol, S.vol);
    if (S.vol < VOL_MIN) S.lowVol = true;
    if (S.vol <= 8) {
      S.vol = 8;
      S.heat = 'off';
      log('The beaker nearly boiled dry — the hot plate was shut off.');
      render();
      return;
    }
    updateBoilUI();
  }, 120);
}

function updateBoilUI() {
  syncSummary();
  const c = $('#boilClock');
  if (c) c.textContent = S.boilTime.toFixed(1);
  const b = $('#boilBar');
  if (b) b.style.width = clamp(S.boilTime / DIGEST_MIN * 100, 0, 100) + '%';
  const v = $('#boilVol');
  if (v) v.textContent = S.vol.toFixed(0);
  if (v && v.parentElement) v.parentElement.classList.toggle('warn', S.vol < VOL_MIN);
  const liq = document.getElementById('boilLiq');
  if (liq) {
    const yB = DIGEST_BASE, hh = BEAKER_250_H;
    const top = beakerGeo(yB, hh, clamp((S.vol / 250) * 0.9, 0.02, 0.94));
    liq.setAttribute('y', top);
    liq.setAttribute('height', (yB - top + 2));
  }
  updateGate();
}

function ensureDry() {
  if (dryTimer) return;
  dryTimer = setInterval(() => {
    if (!S.burner) return;
    const before = S.dryTime;
    S.dryTime += 0.1;
    const c = $('#dryClock');
    if (c) c.textContent = `${S.dryTime.toFixed(1)} / ${DRY_MIN.toFixed(1)} min`;
    const b = $('#dryBar');
    if (b) b.style.width = clamp(S.dryTime / DRY_MIN * 100, 0, 100) + '%';
    const card = $('#dryTask');
    if (card) {
      card.classList.toggle('done', S.dryTime >= DRY_MIN);
      card.classList.toggle('active', S.dryTime < DRY_MIN);
    }
    updateGate();
    // Redraw the bench once the paper passes the charring point so the dish matches the caption;
    // render() refreshes the summary itself, so the other ticks just update it in place.
    if (before <= CHAR_MIN && paperCharred()) render();
    else syncSummary();
  }, 140);
}

/* ---------- yield model ---------- */
/* Every point of yield, traced: losses are negative, extra mass kept is positive. */
function yieldParts() {
  const charred = paperCharred();
  const parts = [
    { label: 'Left on the glassware and filter paper', pct: -LOSS_TRANSFER },
    { label: 'Poured and washed through', pct: -LOSS_HANDLING }
  ];
  if (!S.beakerRinsed) parts.push({ label: 'Left in the beaker — it was never rinsed into the funnel', pct: -LOSS_BEAKER });
  if (S.boilTime < DIGEST_MIN) parts.push({ label: 'Fines from a short digest', pct: -LOSS_FINES * (1 - S.boilTime / DIGEST_MIN) });
  if (S.vigorous) parts.push({ label: 'Splatter from a vigorous boil', pct: -LOSS_SPLATTER });
  if (S.lowVol) parts.push({ label: 'Product baked onto the beaker wall', pct: -LOSS_BAKED });
  if (S.refilters) parts.push({ label: `Refiltered ${times(S.refilters)}`, pct: -LOSS_REFILTER * S.refilters });
  if (S.washWarm) parts.push({ label: 'Product dissolved by the warm wash', pct: -LOSS_WARM });
  if (S.washCount < WASH_MIN) {
    const missing = WASH_MIN - S.washCount;
    parts.push({ label: `NaNO₃ left by ${missing} missed ${missing === 1 ? 'wash' : 'washes'}`, pct: GAIN_NANO3 * missing });
  }
  if (charred) parts.push({ label: 'Soot from the charred filter paper', pct: GAIN_CHAR });
  parts.push({ key: 'handling', label: 'Handling, this run', pct: S.scatter || 0 });
  return parts;
}

function trial() {
  const st = stoich(S.weighed.ca || 1, S.weighed.na || 1);
  // Recovery is 100 % minus what this run lost, plus any extra mass it kept, so every point of
  // yield traces to a cause named on the results screen.
  const parts = yieldParts();
  const pct = 100 + parts.reduce((sum, p) => sum + p.pct, 0);
  return { st, pct, parts, measured: st.theoretical * pct / 100 };
}

/* ---------- shared sheet builders ----------
   The full and the lite sheets read their data rows, observation rows and notebook header from here,
   so a change to a row or the header lands in both. LITE decides only which computed rows are left out. */
function dataRowList(opt = {}) {
  const moles = opt.moles ?? !LITE;
  const limiting = opt.limiting ?? !LITE;
  const percent = opt.percent ?? !LITE;
  const st = (S.weighed.ca != null && S.weighed.na != null) ? stoich(S.weighed.ca, S.weighed.na) : null;
  const rows = [
    ['Ca(NO₃)₂·4H₂O weighed', S.weighed.ca != null ? S.weighed.ca.toFixed(3) + ' g' : '—'],
    ['Na₃PO₄·12H₂O weighed', S.weighed.na != null ? S.weighed.na.toFixed(3) + ' g' : '—']
  ];
  if (moles) {
    rows.push(['Moles of Ca(NO₃)₂·4H₂O', st ? sci(st.nCa) + ' mol' : '—']);
    rows.push(['Moles of Na₃PO₄·12H₂O', st ? sci(st.nNa) + ' mol' : '—']);
  }
  if (limiting) rows.push(['Limiting reagent', st ? HYDRATE[st.lim] : '—']);
  rows.push(
    ['Digestion time', S.step >= 3 ? S.boilTime.toFixed(1) + ' min' : '—'],
    ['Lowest volume during digestion', S.minVol == null ? '—' : S.minVol.toFixed(1) + ' mL'],
    ['Volume at transfer', S.step >= 3 ? S.vol.toFixed(1) + ' mL' : '—'],
    ['Washes', S.pouredMix ? `${S.washCount} of ${WASH_MIN} (${S.washWarm ? 'warm' : 'cold'} water)` : '—'],
    ['Beaker rinsed into the funnel', S.pouredMix ? (S.beakerRinsed ? 'yes' : 'no') : '—'],
    ['Drying time over the burner', S.paperIn ? S.dryTime.toFixed(1) + ' min' : '—'],
    ['Filter paper', S.paperIn ? (paperCharred() ? 'charred' : 'burned off clean') : '—'],
    ['Mass of evaporating dish', S.dishMass != null ? S.dishMass.toFixed(3) + ' g' : '—'],
    ['Mass of dish + precipitate', S.finalWeigh != null ? S.finalWeigh.toFixed(3) + ' g' : '—'],
    ['Constant-mass check', constMass(), 'wrapval'],
    ['Mass of precipitate obtained', S.measuredMass != null ? S.measuredMass.toFixed(3) + ' g' : '—']
  );
  if (percent) rows.push(['Percent yield', S.measuredMass != null && st ? (S.measuredMass / st.theoretical * 100).toFixed(1) + '%' : '—']);
  return rows;
}

/* The two drop tests. These are the bench's own result, not an entry the student made: the simulation
   decides whether a cloud forms from its reaction model, so the full sheet keeps them and says so. */
function observationRowList() {
  const st = (S.weighed.ca != null && S.weighed.na != null) ? stoich(S.weighed.ca, S.weighed.na) : null;
  const rows = [
    ['Filtrate + Ca(NO₃)₂ drops', S.dropsA && st ? (st.lim === 'ca' ? 'white precipitate' : 'no precipitate') : '—'],
    ['Filtrate + Na₃PO₄ drops', S.dropsB && st ? (st.lim === 'na' ? 'white precipitate' : 'no precipitate') : '—']
  ];
  if (!LITE) rows.push(['Excess reagent (student answer)', HYDRATE[S.answer] || '—']);
  return rows;
}
