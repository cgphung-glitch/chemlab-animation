<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle in a Box – Time Evolution</title>
<style>
  body { font-family: sans-serif; }
  #controls { margin-bottom: 10px; }
  input[type="text"] { width: 160px; }
</style>
</head>
<body>
<div id="controls">
  n values (comma separated): 
  <input type="text" id="nInput" value="1,2,3">
  <button id="applyBtn">Apply</button>
  <button id="playPauseBtn">Pause</button>
  <label>Time speed:
    <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1">
  </label>
</div>
<canvas id="canvas" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const L = 1.0;
const nx = 500;
const hbar = 1.0;
const m = 1.0;

const xVals = [];
for (let i = 0; i < nx; i++) {
  xVals.push((i / (nx - 1)) * L);
}

function psi_n(x, n, L) {
  return Math.sqrt(2 / L) * Math.sin(n * Math.PI * x / L);
}

function E_n(n, L, m, hbar) {
  return (n * n * Math.PI * Math.PI * hbar * hbar) / (2 * m * L * L);
}

// global state for eigenbasis
let nList = [1, 2, 3];
let cList = [];           // complex coefficients: {re, im}
let psiBasis = [];        // psi_n(x) arrays
let energies = [];

function normalizeCoeffs() {
  let norm2 = 0;
  for (const c of cList) norm2 += c.re * c.re + c.im * c.im;
  const norm = Math.sqrt(norm2 || 1);
  for (const c of cList) {
    c.re /= norm;
    c.im /= norm;
  }
}

function rebuildBasis() {
  psiBasis = [];
  energies = [];
  cList = [];

  // equal real coefficients, you can customize later
  for (let k = 0; k < nList.length; k++) {
    const n = nList[k];

    const psiArr = [];
    for (let i = 0; i < nx; i++) {
      psiArr.push(psi_n(xVals[i], n, L));
    }
    psiBasis.push(psiArr);
    energies.push(E_n(n, L, m, hbar));

    cList.push({ re: 1.0, im: 0.0 });
  }
  normalizeCoeffs();
}

function psi_prob_at_t(t) {
  const psiRe = new Array(nx).fill(0);
  const psiIm = new Array(nx).fill(0);

  for (let k = 0; k < nList.length; k++) {
    const c = cList[k];
    const E = energies[k];
    const phase = -E * t / hbar;
    const cosP = Math.cos(phase);
    const sinP = Math.sin(phase);

    const aRe = c.re * cosP - c.im * sinP;
    const aIm = c.re * sinP + c.im * cosP;

    const psi_n_k = psiBasis[k];
    for (let i = 0; i < nx; i++) {
      psiRe[i] += aRe * psi_n_k[i];
      psiIm[i] += aIm * psi_n_k[i];
    }
  }

  const prob = new Array(nx);
  for (let i = 0; i < nx; i++) {
    prob[i] = psiRe[i] * psiRe[i] + psiIm[i] * psiIm[i];
  }
  return prob;
}

let t = 0;
let running = true;
let lastTimestamp = null;
let timeSpeed = 1.0;

const playPauseBtn = document.getElementById('playPauseBtn');
playPauseBtn.addEventListener('click', () => {
  running = !running;
  playPauseBtn.textContent = running ? 'Pause' : 'Play';
});

document.getElementById('speedSlider').addEventListener('input', e => {
  timeSpeed = parseFloat(e.target.value);
});

document.getElementById('applyBtn').addEventListener('click', () => {
  const txt = document.getElementById('nInput').value;
  const parts = txt.split(',');
  const newN = [];
  for (const p of parts) {
    const v = parseInt(p.trim(), 10);
    if (!isNaN(v) && v > 0) newN.push(v);
  }
  if (newN.length > 0) {
    nList = newN;
    rebuildBasis();
    t = 0;          // reset time for clarity
  }
});

// initial basis
rebuildBasis();

function drawFrame(timestamp) {
  if (lastTimestamp === null) lastTimestamp = timestamp;
  const dt_ms = timestamp - lastTimestamp;
  lastTimestamp = timestamp;

  if (running) {
    const dt = dt_ms / 1000;
    t += dt * timeSpeed;
  }

  const prob = psi_prob_at_t(t);
  const probMax = Math.max(...prob) || 1;

  ctx.clearRect(0, 0, W, H);

  function xToCanvas(x) {
    return x / L * W;
  }
  function yProbToCanvas(p) {
    return H * 0.8 - p / probMax * (H * 0.6);
  }

  ctx.strokeStyle = '#000';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.8);
  ctx.lineTo(W, H * 0.8);
  ctx.stroke();

  ctx.fillStyle = 'rgba(0,0,255,0.25)';
  ctx.strokeStyle = 'blue';
  ctx.beginPath();
  for (let i = 0; i < nx; i++) {
    const xc = xToCanvas(xVals[i]);
    const yc = yProbToCanvas(prob[i]);
    if (i === 0) ctx.moveTo(xc, yc);
    else ctx.lineTo(xc, yc);
  }
  ctx.lineTo(W, H * 0.8);
  ctx.lineTo(0, H * 0.8);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = 'black';
  ctx.fillText('|Ψ(x,t)|²', 10, H * 0.8 - 10);
  ctx.fillText(`t = ${t.toFixed(2)}`, 10, 20);
  ctx.fillText(`n = [${nList.join(', ')}]`, 10, 40);
  ctx.fillText('Infinite well: L=1, ħ=m=1', 10, 60);

  requestAnimationFrame(drawFrame);
}

requestAnimationFrame(drawFrame);
</script>
</body>
</html>
